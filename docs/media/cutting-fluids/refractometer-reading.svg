<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 510" role="img" aria-labelledby="title desc">
<title id="title">Read the Brix boundary</title><desc id="desc">Original teaching scale, zero to six Brix in 0.2 divisions. Dark above and light below meet at 3.2 Brix. Multiply that reading by the product factor.</desc>
