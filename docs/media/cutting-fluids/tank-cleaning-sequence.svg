<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="title desc">
<title id="title">Coolant tank cleaning sequence</title><desc id="desc">Six steps flow downward: prepare and isolate; skim and drain; remove solids; clean residue and passages; remove cleaner and rinse; refill, circulate and measure. Follow the machine and fluid suppliers' procedures.</desc>
<rect width="560" height="620" fill="white" rx="14"/>
<g font-family="Arial, sans-serif" fill="#102b46">
<text x="280" y="31" text-anchor="middle" font-size="24" font-weight="bold">Clean before the fresh charge</text>
<rect x="20" y="50" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="75" r="17" fill="#163e64"/><text x="49" y="82" text-anchor="middle" fill="white" font-size="21">1</text>
<text x="77" y="79" font-size="22" font-weight="bold">Prepare and isolate</text><text x="77" y="107" font-size="19">Procedure, SDS, containers, PPE</text>
<path d="M280 126v10m-6-6 6 6 6-6" fill="none" stroke="#163e64" stroke-width="3"/>
<rect x="20" y="140" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="165" r="17" fill="#163e64"/><text x="49" y="172" text-anchor="middle" fill="white" font-size="21">2</text>
<text x="77" y="169" font-size="22" font-weight="bold">Skim and drain</text><text x="77" y="197" font-size="19">Catch larger chips in a strainer</text>
<path d="M280 216v10m-6-6 6 6 6-6" fill="none" stroke="#163e64" stroke-width="3"/>
<rect x="20" y="230" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="255" r="17" fill="#163e64"/><text x="49" y="262" text-anchor="middle" fill="white" font-size="21">3</text>
<text x="77" y="259" font-size="22" font-weight="bold">Remove solids</text><text x="77" y="287" font-size="19">Clear chips, sludge and screens</text>
<path d="M280 306v10m-6-6 6 6 6-6" fill="none" stroke="#163e64" stroke-width="3"/>
<rect x="20" y="320" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="345" r="17" fill="#163e64"/><text x="49" y="352" text-anchor="middle" fill="white" font-size="21">4</text>
<text x="77" y="349" font-size="22" font-weight="bold">Clean residue and passages</text><text x="77" y="377" font-size="19">Use compatible, diluted cleaner</text>
<path d="M280 396v10m-6-6 6 6 6-6" fill="none" stroke="#163e64" stroke-width="3"/>
<rect x="20" y="410" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="435" r="17" fill="#163e64"/><text x="49" y="442" text-anchor="middle" fill="white" font-size="21">5</text>
<text x="77" y="439" font-size="22" font-weight="bold">Remove cleaner and rinse</text><text x="77" y="467" font-size="19">Follow instructions; capture waste</text>
<path d="M280 486v10m-6-6 6 6 6-6" fill="none" stroke="#163e64" stroke-width="3"/>
<rect x="20" y="500" width="520" height="75" rx="10" fill="#f0f5fa" stroke="#163e64" stroke-width="2"/>
<circle cx="49" cy="525" r="17" fill="#163e64"/><text x="49" y="532" text-anchor="middle" fill="white" font-size="21">6</text>
<text x="77" y="529" font-size="22" font-weight="bold">Refill, circulate and measure</text><text x="77" y="557" font-size="19">Record concentration and condition</text>
<text x="280" y="603" text-anchor="middle" font-size="18">Use the machine-specific maintenance procedure.</text></g></svg>