<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title">
<title id="title">Annotated generic title-block fields</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17354d"/></marker></defs>
<rect width="400" height="640" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#17354d"><text x="20" y="30" font-size="20" font-weight="bold">Read the title block first</text><text x="20" y="56">Illustrative fields, not a template</text><rect x="20" y="78" width="360" height="76" fill="#eef5fa" stroke="#17354d"/><text x="32" y="106" font-size="18" font-weight="bold">PART NAME: Spacer</text><text x="32" y="132">What is the item?</text><rect x="20" y="154" width="360" height="76" fill="#fff" stroke="#17354d"/><text x="32" y="182" font-size="18" font-weight="bold">DRAWING NO.: EX-100</text><text x="32" y="208">Which drawing record?</text><rect x="20" y="230" width="360" height="76" fill="#eef5fa" stroke="#17354d"/><text x="32" y="258" font-size="18" font-weight="bold">UNITS: mm</text><text x="32" y="284">What do dimension values mean?</text><rect x="20" y="306" width="360" height="76" fill="#fff" stroke="#17354d"/><text x="32" y="334" font-size="18" font-weight="bold">SHEET SCALE: 1:2</text><text x="32" y="360">Views at half size unless labeled</text><rect x="20" y="382" width="360" height="76" fill="#eef5fa" stroke="#17354d"/><text x="32" y="410" font-size="18" font-weight="bold">REVISION: B</text><text x="32" y="436">Which controlled revision?</text><rect x="20" y="458" width="360" height="76" fill="#fff" stroke="#17354d"/><text x="32" y="486" font-size="18" font-weight="bold">SHEET: 1 OF 2</text><text x="32" y="512">Is the other sheet available?</text><text x="20" y="564">Also check material, tolerance notes,</text><text x="20" y="588">and drawn / checked entries.</text><text x="20" y="620">Revision block → what changed and why.</text></g></svg>