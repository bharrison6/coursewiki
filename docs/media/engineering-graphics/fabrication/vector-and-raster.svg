<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">Vector paths and raster scans</title>
  <desc id="desc">The vector follows a boundary; the raster scans rows across an area. Path mode and cut depth are separate choices.</desc>
  <rect width="400" height="440" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#102e4a">
    <text x="20" y="30" font-size="20">Vector: follow a path</text>
    <path d="M70 65H330V155H70Z" fill="none" stroke="#102e4a" stroke-width="4"/>
    <path d="M190 59L201 65L190 71M324 103L330 114L336 103M211 149L200 155L211 161M64 119L70 108L76 119" fill="none" stroke="#102e4a" stroke-width="3"/>
    <text x="20" y="190">Settings determine cut or score.</text>
    <text x="20" y="245" font-size="20">Raster: scan an area</text>
    <rect x="70" y="270" width="260" height="100" fill="#d9edf5"/>
    <path d="M70 280H330V295H70V310H330V325H70V340H330V355H70" fill="none" stroke="#23728c" stroke-width="3"/>
    <text x="20" y="408">Rows form a filled surface mark.</text>
  </g>
</svg>
