<svg xmlns="http://www.w3.org/2000/svg" width="400" height="530" viewBox="0 0 400 530" role="img" aria-labelledby="title"><title id="title">Isometric and oblique views of a rectangular block</title><rect width="400" height="530" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#18354b"><text x="20" y="28">1. Isometric: three tilted face shapes</text><polygon points="145.00,173.00 248.92,233.00 248.92,153.00 145.00,93.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><polygon points="248.92,233.00 318.21,193.00 318.21,113.00 248.92,153.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="145.00,93.00 248.92,153.00 318.21,113.00 214.28,53.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><text x="20" y="290">2. Oblique: front face keeps its shape</text><polygon points="100.00,365.00 240.00,365.00 305.00,310.00 165.00,310.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><polygon points="240.00,365.00 305.00,310.00 305.00,410.00 240.00,465.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="100.00,365.00 240.00,365.00 240.00,465.00 100.00,465.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><text x="110" y="421">Front</text><text x="20" y="505">Parallel receding edges; no vanishing point.</text></g></svg>
