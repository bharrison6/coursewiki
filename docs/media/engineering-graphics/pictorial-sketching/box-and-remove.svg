<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" aria-labelledby="title"><title id="title">Three stages of sketching a block with a corner removed through its depth</title><rect width="400" height="820" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#18354b"><text x="20" y="30">1. Block in height, width, and depth</text><polygon points="145.00,180.00 248.92,240.00 248.92,160.00 145.00,100.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><polygon points="248.92,240.00 318.21,200.00 318.21,120.00 248.92,160.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="145.00,100.00 248.92,160.00 318.21,120.00 214.28,60.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><text x="20" y="270">2. Locate the cut on the front profile</text><polygon points="145.00,400.00 248.92,460.00 248.92,380.00 145.00,320.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><polygon points="248.92,460.00 318.21,420.00 318.21,340.00 248.92,380.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="145.00,320.00 248.92,380.00 318.21,340.00 214.28,280.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><polygon points="214.28,360.00 248.92,380.00 248.92,420.00" fill="#ffe6a1" stroke="#18354b" stroke-width="2" /><text x="20" y="490">Shaded triangle marks material to remove.</text><text x="20" y="510">3. Carry the cut through the depth</text><polygon points="145.00,660.00 248.92,720.00 248.92,680.00 214.28,620.00 145.00,580.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><polygon points="248.92,720.00 318.21,680.00 318.21,640.00 248.92,680.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="214.28,620.00 248.92,680.00 318.21,640.00 283.56,580.00" fill="#ffe6a1" stroke="#18354b" stroke-width="2" /><polygon points="145.00,580.00 214.28,620.00 283.56,580.00 214.28,540.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><text x="20" y="795">The new sloping face is a flat rectangle.</text></g></svg>
