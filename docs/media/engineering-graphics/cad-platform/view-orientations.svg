<svg xmlns="http://www.w3.org/2000/svg" width="400" height="510" viewBox="0 0 400 510" role="img" aria-labelledby="title desc">
<title id="title">Standard directions and normal to a plane</title>
<desc id="desc">An oblique cube with its front marked F, front and top projections, and a perpendicular viewing direction toward a plane shown edge-on.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#152c43"/></marker></defs>
<rect width="400" height="510" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#152c43" stroke-linejoin="round">
<text x="20" y="25">Oblique view: identify the front</text>
<g stroke="#152c43" stroke-width="2">
<path d="M135 90L200 52L265 90L200 128Z" fill="#d7e7f0"/>
<path d="M135 90L200 128L200 203L135 165Z" fill="#a8ccdf"/>
<path d="M200 128L265 90L265 165L200 203Z" fill="#639bb8"/>
<path d="M80 175L132 145" marker-end="url(#arrow)"/>
<path d="M200 30L200 70" marker-end="url(#arrow)"/>
</g>
<text x="160" y="150">F</text><text x="20" y="193">Front</text><text x="222" y="45">Top</text>
<text x="30" y="245">Front view</text><text x="230" y="245">Top view</text>
<rect x="40" y="265" width="100" height="100" fill="#a8ccdf" stroke="#152c43" stroke-width="2"/>
<text x="83" y="320">F</text>
<rect x="240" y="265" width="100" height="100" fill="#d7e7f0" stroke="#152c43" stroke-width="2"/>
<text x="20" y="401">Normal to: look perpendicular to a plane</text>
<path d="M205 425L295 485" stroke="#152c43" stroke-width="2" fill="none"/>
<path d="M220 500L250 455" stroke="#152c43" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M242 467L254 475L262 463" fill="none" stroke="#152c43" stroke-width="2"/>
<text x="20" y="430">Plane seen edge-on</text>
<text x="300" y="480">90°</text>
</g>
</svg>
