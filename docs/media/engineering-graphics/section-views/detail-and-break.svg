<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">Enlarged detail compared with shortened broken view</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="470" fill="white"/><text x="20" y="28">Detail: enlarge a selected region</text><rect class="edge" x="35" y="60" width="135" height="55" fill="white"/><circle class="edge" cx="145" cy="88" r="8" fill="white"/><circle cx="145" cy="88" r="20" fill="none" stroke="#135b88" stroke-width="2"/><text x="165" y="65">B</text><path class="project" d="M175,88 H230"/><circle class="edge" cx="282" cy="88" r="40" fill="white"/><circle class="edge" cx="282" cy="88" r="16" fill="white"/><text x="235" y="151">DETAIL B  2:1</text><text x="20" y="210">Break: omit a uniform middle length</text><path class="edge" d="M35,255 H165 L157,270 L173,285 L165,300 H35 Z M235,255 H365 V300 H235 L243,285 L227,270 Z"/><text x="20" y="352">The part remains one continuous piece.</text><text x="20" y="383">Read the dimension for its full length.</text><text x="20" y="435">Neither operation reveals an interior.</text></svg>