<svg xmlns="http://www.w3.org/2000/svg" width="400" height="495" viewBox="0 0 400 495" role="img" aria-labelledby="title desc"><title id="title">Broken-out section exposing a passage</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="495" fill="white"/><text x="20" y="28">1. Housing front; hidden passage</text><rect class="edge" x="70" y="70" width="260" height="130" fill="white"/><path class="hidden" d="M70,115 H330 M70,155 H330"/><path class="cut" d="M190,85 Q240,55 270,95 T280,175 Q235,200 195,170 T190,85"/><text x="20" y="235">Local boundary; cut only to the passage</text><text x="20" y="290">2. Same view with a local cutaway</text><rect class="edge" x="70" y="315" width="260" height="120" fill="white"/><defs><clipPath id="local"><path d="M190,325 Q240,300 270,340 T280,420 Q235,440 195,410 T190,325 Z"/></clipPath></defs><g clip-path="url(#local)"><rect class="edge" x="165" y="310" width="145" height="130" fill="url(#hatch)"/><rect class="edge" x="165" y="355" width="145" height="40" fill="white"/></g><path class="edge" d="M190,325 Q240,300 270,340 T280,420 Q235,440 195,410 T190,325 Z"/><text x="20" y="475">The irregular boundary is a break line.</text></svg>