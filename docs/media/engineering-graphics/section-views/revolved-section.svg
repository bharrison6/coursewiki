<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">Revolved rectangular section</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="470" fill="white"/><text x="20" y="28">1. Rectangular bar; transverse cut A–A</text><rect class="edge" x="60" y="95" width="280" height="60" fill="white"/><path class="cut" d="M200,70 V180"/><path class="cut" d="M200,70 l32,0" marker-end="url(#arrow)"/><path class="cut" d="M200,180 l32,0" marker-end="url(#arrow)"/><text x="180" y="60">A</text><text x="180" y="205">A</text><text x="20" y="250">Cross section is 80 wide × 60 high.</text><text x="20" y="295">2. Rotate slice 90° in place</text><rect class="edge" x="60" y="330" width="280" height="60" fill="white"/><path class="center" d="M200,305 V415"/><rect class="edge" x="160" y="330" width="80" height="60" fill="url(#hatch)"/><text x="20" y="450">Slice only; overlaid on the parent view.</text></svg>