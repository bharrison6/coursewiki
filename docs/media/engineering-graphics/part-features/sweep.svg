<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">A circular section follows a curved path</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Profile + path; 2. Sweep; 3. Bent rod. Section at path start; Carry the section; Constant size</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Profile + path</text><g transform="translate(0 40)"><path d="M30 115 L30 70 Q30 30 70 30 L150 30" fill="none" /><ellipse cx="30" cy="115" rx="16" ry="7" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section at path start</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Sweep</text><g transform="translate(0 40)"><path d="M30 115 L30 70 Q30 30 70 30 L150 30" fill="none" stroke-dasharray="6 5"/><ellipse cx="30" cy="100" rx="16" ry="7" fill="#fff" /><ellipse cx="37" cy="48" rx="13" ry="10" fill="#fff" /><ellipse cx="130" cy="30" rx="7" ry="16" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Carry the section</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Bent rod</text><g transform="translate(0 40)"><path d="M30 115 L30 70 Q30 30 70 30 L150 30" fill="none" stroke-width="30"/><path d="M30 115 L30 70 Q30 30 70 30 L150 30" fill="none" stroke="#dbe9f2" stroke-width="26"/><ellipse cx="30" cy="115" rx="14" ry="6" fill="#fff" /><ellipse cx="150" cy="30" rx="6" ry="14" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Constant size</text></g></g></svg>