<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Extruded pocket in section</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Face sketch; 2. Cut depth; 3. Pocket. Section through sketch; Into the body; Floor remains</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Face sketch</text><g transform="translate(0 40)"><rect x="20" y="25" width="140" height="110" fill="#dbe9f2" /><path d="M60 25 L120 25" fill="none" stroke="#b05018" stroke-width="5"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section through sketch</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Cut depth</text><g transform="translate(0 40)"><rect x="20" y="25" width="140" height="110" fill="#dbe9f2" /><path d="M60 25 V75 H120 V25" fill="none" stroke-dasharray="5 4"/><path d="M90 30 L90 65" fill="none" stroke="#b05018" stroke-width="4"/><path d="M84 57 L90 66 L96 57" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Into the body</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Pocket</text><g transform="translate(0 40)"><path d="M20 25 H60 V75 H120 V25 H160 V135 H20 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Floor remains</text></g></g></svg>