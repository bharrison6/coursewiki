<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">A web joins an L-shaped support</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Rib sketch; 2. Thickness; 3. Support web. Line spans supports; Across sketch plane; Material joins walls</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Rib sketch</text><g transform="translate(0 40)"><path d="M25 20 H40 V120 H165 V135 H25 Z" fill="#dbe9f2" /><path d="M40 40 L130 120" fill="none" stroke="#b05018" stroke-width="3"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Line spans supports</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Thickness</text><g transform="translate(0 40)"><path d="M25 20 H40 V120 H165 V135 H25 Z" fill="#dbe9f2" /><path d="M40 40 L130 120" fill="none" stroke="#b05018" stroke-width="3"/><path d="M46 40 L136 120" fill="none" stroke-dasharray="4 4"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Across sketch plane</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Support web</text><g transform="translate(0 40)"><path d="M25 20 H40 V120 H165 V135 H25 Z" fill="#dbe9f2" /><path d="M40 40 L130 120 H40 Z" fill="#adcbdc" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Material joins walls</text></g></g></svg>