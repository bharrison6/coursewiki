<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">A single-direction hole pattern</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Seed; 2. Direction; 3. Four total. One hole feature; Spacing and count; Three intervals</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Seed</text><g transform="translate(0 40)"><rect x="10" y="40" width="160" height="70" fill="#dbe9f2" /><ellipse cx="30" cy="75" rx="10" ry="10" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">One hole feature</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Direction</text><g transform="translate(0 40)"><rect x="10" y="40" width="160" height="70" fill="#dbe9f2" /><ellipse cx="30" cy="75" rx="10" ry="10" fill="#fff" /><path d="M30 20 L155 20" fill="none" /><path d="M147 14 L155 20 L147 26" fill="none" /><text x="90" y="135" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">spacing</text></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Spacing and count</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Four total</text><g transform="translate(0 40)"><rect x="10" y="40" width="160" height="70" fill="#dbe9f2" /><ellipse cx="30" cy="75" rx="10" ry="10" fill="#fff" /><ellipse cx="70" cy="75" rx="10" ry="10" fill="#fff" /><ellipse cx="110" cy="75" rx="10" ry="10" fill="#fff" /><ellipse cx="150" cy="75" rx="10" ry="10" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Three intervals</text></g></g></svg>