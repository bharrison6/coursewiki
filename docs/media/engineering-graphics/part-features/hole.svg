<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Position and shape of a counterbored hole</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Position; 2. Hole type; 3. Counterbore. Center on a face; Recess and bore; Section view</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Position</text><g transform="translate(0 40)"><rect x="25" y="20" width="130" height="110" fill="#dbe9f2" /><path d="M80 75 L100 75" fill="none" /><path d="M90 65 L90 85" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Center on a face</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Hole type</text><g transform="translate(0 40)"><path d="M55 15 V60 H75 V135 M125 15 V60 H105 V135" fill="none" /><path d="M90 10 L90 145" fill="none" stroke-dasharray="6 5"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Recess and bore</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Counterbore</text><g transform="translate(0 40)"><path d="M20 25 H55 V60 H75 V130 H20 Z" fill="#dbe9f2" /><path d="M160 25 H125 V60 H105 V130 H160 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section view</text></g></g></svg>