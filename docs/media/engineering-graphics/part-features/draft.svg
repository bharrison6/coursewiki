<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Draft with a fixed bottom neutral plane</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Side faces; 2. Bottom fixed; 3. Taper. Section view; Set angle and direction; Bottom width retained</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Side faces</text><g transform="translate(0 40)"><rect x="30" y="25" width="120" height="110" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section view</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Bottom fixed</text><g transform="translate(0 40)"><rect x="30" y="25" width="120" height="110" fill="#dbe9f2" /><path d="M15 135 L165 135" fill="none" stroke="#b05018" stroke-width="4"/><path d="M30 135 L50 25" fill="none" /><path d="M150 135 L130 25" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Set angle and direction</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Taper</text><g transform="translate(0 40)"><path d="M30 135 L50 25 H130 L150 135 Z" fill="#dbe9f2" /><path d="M15 135 L165 135" fill="none" stroke="#b05018" stroke-width="4"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Bottom width retained</text></g></g></svg>