<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Extruding a closed rectangle</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Sketch; 2. Give depth; 3. Solid. Closed region; Straight direction; Constant section</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Sketch</text><g transform="translate(0 40)"><rect x="35" y="40" width="100" height="75" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Closed region</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Give depth</text><g transform="translate(0 40)"><rect x="20" y="45" width="105" height="80" fill="none" /><rect x="55" y="20" width="105" height="80" fill="none" /><path d="M20 45 L55 20" fill="none" /><path d="M125 125 L160 100" fill="none" /><path d="M125 45 L160 20" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Straight direction</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Solid</text><g transform="translate(0 40)"><path d="M20 45 L125 45 L160 20 L55 20 Z" fill="#edf4f8" /><path d="M125 45 L160 20 L160 100 L125 125 Z" fill="#adcbdc" /><rect x="20" y="45" width="105" height="80" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Constant section</text></g></g></svg>