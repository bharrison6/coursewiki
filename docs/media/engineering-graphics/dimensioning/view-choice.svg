<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">Dimension the visible circular view</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="360" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><rect x="70" y="100" width="240.0" height="135.0" class="part"/><circle cx="137.5" cy="186.25" r="15.0" class="part"/><line x1="112.5" y1="186.25" x2="162.5" y2="186.25" class="axis" /><line x1="137.5" y1="161.25" x2="137.5" y2="211.25" class="axis" /><path d="M 146.14 173.98 L 225 62 h 15" class="lead"/><text x="245" y="68" font-size="18" text-anchor="start" >⌀.40</text><text x="24" y="285" font-size="18" text-anchor="start" >Front: circle shows the hole’s shape.</text><rect x="470" y="140" width="240" height="35" class="part"/><line x1="522.5" y1="140" x2="522.5" y2="175" class="hidden" /><line x1="552.5" y1="140" x2="552.5" y2="175" class="hidden" /><line x1="522.5" y1="135" x2="522.5" y2="83" class="thin" /><line x1="552.5" y1="135" x2="552.5" y2="83" class="thin" /><line x1="522.5" y1="90" x2="552.5" y2="90" class="dim" /><text x="537.5" y="82" font-size="18" text-anchor="middle" >⌀.40</text><text x="434" y="285" font-size="18" text-anchor="start" >Edge: hidden lines obscure the feature.</text><text x="24" y="330" font-size="18" text-anchor="start" >Use a visible outline, section or other suitable view for feature dimensions.</text></svg>