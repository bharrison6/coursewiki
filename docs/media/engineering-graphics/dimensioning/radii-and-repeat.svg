<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 635" role="img" aria-labelledby="title desc"><title id="title">Diameter, radius and repeated-feature notation</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="635" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">Diameter of a hole</text><circle cx="100" cy="140" r="48" class="part"/><line x1="40" y1="140" x2="160" y2="140" class="axis" /><line x1="100" y1="80" x2="100" y2="200" class="axis" /><path d="M 133.94 106.06 L 185 55 h 15" class="lead"/><text x="205" y="61" font-size="18" text-anchor="start" >⌀.60</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">Radius of an arc</text><path d="M480 210 V125 A48 48 0 0 1 528 77 H695 V210 Z" class="part"/><path d="M 494.06 91.06 L 450 47 h 15" class="lead"/><text x="470" y="53" font-size="18" text-anchor="start" >R.30</text><text x="24" y="285" font-size="20" text-anchor="start" font-weight="700">Repeated features share a callout, not a location</text><rect x="85" y="370" width="300" height="160" class="part"/><circle cx="135" cy="410" r="10" class="part"/><line x1="117" y1="410" x2="153" y2="410" class="axis" /><line x1="135" y1="392" x2="135" y2="428" class="axis" /><circle cx="135" cy="490" r="10" class="part"/><line x1="117" y1="490" x2="153" y2="490" class="axis" /><line x1="135" y1="472" x2="135" y2="508" class="axis" /><circle cx="335" cy="410" r="10" class="part"/><line x1="317" y1="410" x2="353" y2="410" class="axis" /><line x1="335" y1="392" x2="335" y2="428" class="axis" /><circle cx="335" cy="490" r="10" class="part"/><line x1="317" y1="490" x2="353" y2="490" class="axis" /><line x1="335" y1="472" x2="335" y2="508" class="axis" /><path d="M 343.32 404.45 L 440 340 h 15" class="lead"/><text x="460" y="346" font-size="18" text-anchor="start" >4X ⌀.20 THRU</text><line x1="135" y1="495" x2="135" y2="572" class="thin" /><line x1="335" y1="495" x2="335" y2="572" class="thin" /><line x1="135" y1="565" x2="335" y2="565" class="dim" /><text x="235.0" y="557" font-size="18" text-anchor="middle" >2.00</text><line x1="85" y1="535" x2="85" y2="612" class="thin" /><line x1="135" y1="535" x2="135" y2="612" class="thin" /><line x1="85" y1="605" x2="135" y2="605" class="dim" /><text x="110.0" y="597" font-size="18" text-anchor="middle" >.50</text><line x1="80" y1="410" x2="38" y2="410" class="thin" /><line x1="80" y1="490" x2="38" y2="490" class="thin" /><line x1="45" y1="410" x2="45" y2="490" class="dim" /><rect x="16" y="437.0" width="58" height="25" fill="white"/><text x="45" y="456.0" font-size="17" text-anchor="middle" >.80</text><line x1="390" y1="490" x2="427" y2="490" class="thin" /><line x1="390" y1="530" x2="427" y2="530" class="thin" /><line x1="420" y1="490" x2="420" y2="530" class="dim" /><rect x="391" y="497.0" width="58" height="25" fill="white"/><text x="420" y="516.0" font-size="17" text-anchor="middle" >.40</text><text x="475" y="445" font-size="18" text-anchor="start" >Same size, four places.</text><text x="475" y="480" font-size="18" text-anchor="start" >Center spacing and edge</text><text x="475" y="508" font-size="18" text-anchor="start" >offsets still define location.</text><text x="475" y="555" font-size="18" text-anchor="start" >Pattern shown rectangular.</text></svg>