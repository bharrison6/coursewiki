<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 535" role="img" aria-labelledby="title desc"><title id="title">Separate leaders and point them radially</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="535" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><rect x="55" y="110" width="290" height="130" class="part"/><circle cx="120" cy="180" r="22" class="part"/><circle cx="280" cy="180" r="22" class="part"/><path d="M 109.18 160.85 L 55 65 h 15" class="lead"/><text x="75" y="71" font-size="18" text-anchor="start" >⌀.44</text><path d="M 286.41 158.95 L 315 65 h 15" class="lead"/><text x="335" y="71" font-size="18" text-anchor="start" >⌀.44</text><rect x="465" y="110" width="290" height="130" class="part"/><circle cx="530" cy="180" r="22" class="part"/><circle cx="690" cy="180" r="22" class="part"/><path d="M 542 161 L 695 65 h 15" class="lead"/><text x="715" y="71" font-size="18" text-anchor="start" >⌀.44</text><path d="M 678 161 L 470 65 h 15" class="lead"/><text x="490" y="71" font-size="18" text-anchor="start" >⌀.44</text><text x="24" y="280" font-size="18" text-anchor="start" >Move each note to its own side.</text><text x="434" y="280" font-size="18" text-anchor="start" >Crossing leaders make targets harder to follow.</text><text x="24" y="335" font-size="20" text-anchor="start" font-weight="700">GOOD · radial leader</text><text x="434" y="335" font-size="20" text-anchor="start" font-weight="700">AVOID · tangent leader</text><circle cx="150" cy="430" r="42" class="part"/><line x1="98" y1="430" x2="202" y2="430" class="axis" /><line x1="150" y1="378" x2="150" y2="482" class="axis" /><path d="M 180 400 L 230 350 h 15" class="lead"/><text x="250" y="356" font-size="18" text-anchor="start" >⌀.84</text><circle cx="560" cy="430" r="42" class="part"/><line x1="508" y1="430" x2="612" y2="430" class="axis" /><line x1="560" y1="378" x2="560" y2="482" class="axis" /><path d="M 560 388 L 650 388 h 15" class="lead"/><text x="670" y="394" font-size="18" text-anchor="start" >⌀.84</text><text x="24" y="510" font-size="18" text-anchor="start" >Arrow direction aims toward the center.</text><text x="434" y="510" font-size="18" text-anchor="start" >Arrow grazes the edge; target is unclear.</text></svg>