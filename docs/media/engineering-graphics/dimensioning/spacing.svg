<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="title desc"><title id="title">Dimension spacing on the printed sheet</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="380" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><path d="M65 170H165V195H285V270H65Z" class="part"/><line x1="65" y1="165" x2="65" y2="113" class="thin" /><line x1="165" y1="165" x2="165" y2="113" class="thin" /><line x1="65" y1="120" x2="165" y2="120" class="dim" /><text x="115.0" y="112" font-size="18" text-anchor="middle" >1.00</text><line x1="65" y1="165" x2="65" y2="68" class="thin" /><line x1="285" y1="190" x2="285" y2="68" class="thin" /><line x1="65" y1="75" x2="285" y2="75" class="dim" /><text x="175.0" y="67" font-size="18" text-anchor="middle" >2.20</text><line x1="330" y1="170" x2="330" y2="120" class="dim" /><text x="343" y="150" font-size="17" text-anchor="start" >10 mm</text><line x1="330" y1="120" x2="330" y2="75" class="dim" /><text x="343" y="102" font-size="17" text-anchor="start" >6 mm</text><path d="M480 170H580V195H700V270H480Z" class="part"/><line x1="480" y1="165" x2="480" y2="148" class="thin" /><line x1="580" y1="165" x2="580" y2="148" class="thin" /><line x1="480" y1="155" x2="580" y2="155" class="dim" /><text x="530.0" y="147" font-size="18" text-anchor="middle" >1.00</text><line x1="480" y1="165" x2="480" y2="123" class="thin" /><line x1="700" y1="190" x2="700" y2="123" class="thin" /><line x1="480" y1="130" x2="700" y2="130" class="dim" /><text x="590.0" y="122" font-size="18" text-anchor="middle" >2.20</text><text x="24" y="310" font-size="18" text-anchor="start" >Visible gap at the part; overrun at the top.</text><text x="434" y="310" font-size="18" text-anchor="start" >Crowding obscures arrows and endpoints.</text><text x="24" y="354" font-size="18" text-anchor="start" >Sheet-space guides: 10 mm first, 6 mm after. Not part dimensions.</text></svg>