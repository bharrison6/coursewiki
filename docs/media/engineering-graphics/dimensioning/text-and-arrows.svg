<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" role="img" aria-labelledby="title desc"><title id="title">Text direction, limited space and staggered values</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="690" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><rect x="85" y="80" width="150" height="130" class="part"/><line x1="240" y1="80" x2="287" y2="80" class="thin" /><line x1="240" y1="210" x2="287" y2="210" class="thin" /><line x1="280" y1="80" x2="280" y2="210" class="dim" /><rect x="251" y="132.0" width="58" height="25" fill="white"/><text x="280" y="151.0" font-size="17" text-anchor="middle" >1.30</text><rect x="495" y="80" width="150" height="130" class="part"/><line x1="690" y1="80" x2="690" y2="210" class="dim" /><text x="680" y="145" font-size="18" text-anchor="middle" transform="rotate(-90 680 145)">1.30</text><text x="24" y="250" font-size="18" text-anchor="start" >Read from the bottom of the sheet.</text><text x="434" y="250" font-size="18" text-anchor="start" >Avoid rotating ordinary dimension text.</text><text x="24" y="300" font-size="20" text-anchor="start" font-weight="700">GOOD · move arrows outside</text><text x="434" y="300" font-size="20" text-anchor="start" font-weight="700">AVOID · squeeze everything in</text><line x1="140" y1="340" x2="140" y2="408" class="thin" /><line x1="170" y1="340" x2="170" y2="408" class="thin" /><line x1="90" y1="380" x2="140" y2="380" class="thin" marker-end="url(#a)"/><line x1="220" y1="380" x2="170" y2="380" class="thin" marker-end="url(#a)"/><text x="235" y="386" font-size="18" text-anchor="start" >.15</text><line x1="550" y1="340" x2="550" y2="408" class="thin" /><line x1="580" y1="340" x2="580" y2="408" class="thin" /><line x1="550" y1="380" x2="580" y2="380" class="dim" /><text x="565.0" y="372" font-size="18" text-anchor="middle" >.15</text><text x="24" y="445" font-size="18" text-anchor="start" >Keep text size and arrow size consistent.</text><text x="434" y="445" font-size="18" text-anchor="start" >Too little room between extension lines.</text><text x="24" y="495" font-size="20" text-anchor="start" font-weight="700">GOOD · stagger neighboring values</text><text x="434" y="495" font-size="20" text-anchor="start" font-weight="700">AVOID · a tight column of values</text><line x1="60" y1="540" x2="120" y2="540" class="dim" /><text x="90" y="532" font-size="18" text-anchor="middle" >.60</text><line x1="470" y1="540" x2="530" y2="540" class="dim" /><text x="500" y="532" font-size="18" text-anchor="middle" >.60</text><line x1="60" y1="580" x2="200" y2="580" class="dim" /><text x="130" y="572" font-size="18" text-anchor="middle" >1.40</text><line x1="470" y1="565" x2="610" y2="565" class="dim" /><text x="500" y="557" font-size="18" text-anchor="middle" >1.40</text><line x1="60" y1="620" x2="300" y2="620" class="dim" /><text x="180" y="612" font-size="18" text-anchor="middle" >2.40</text><line x1="470" y1="590" x2="710" y2="590" class="dim" /><text x="500" y="582" font-size="18" text-anchor="middle" >2.40</text><text x="24" y="660" font-size="18" text-anchor="start" >Stagger text without losing its endpoints.</text><text x="434" y="660" font-size="18" text-anchor="start" >Add space and separate the values.</text></svg>