<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Parallel: before and after</title><desc id="desc">Two lines have different directions. After: their directions match, but they are on different lines.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M30 90 L230 50"/><path d="M45 130 L240 140"/><g transform="translate(300 0)"><path d="M30 90 L230 50"/><path d="M40 140 L240 100"/></g></g></svg>