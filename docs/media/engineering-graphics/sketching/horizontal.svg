<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Horizontal: before and after</title><desc id="desc">A line slopes in the sketch plane. After: both endpoints have the same y coordinate.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M45 130 L225 60"/><g transform="translate(300 0)"><path d="M45 100 L225 100"/><path d="M20 155 L260 155" stroke-dasharray="7 5"/><text x="205" y="148" fill="#002144" stroke="none" font-size="17">x axis</text></g></g></svg>