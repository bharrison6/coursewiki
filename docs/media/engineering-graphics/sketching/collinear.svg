<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M25 115 L110 65"/><path d="M155 90 L250 105"/><g transform="translate(300 0)"><path d="M20 130 L260 50" stroke-dasharray="7 5" stroke-width="1"/><path d="M35 125 L110 100" stroke-width="5"/><path d="M155 85 L245 55" stroke-width="5"/></g></g></svg>