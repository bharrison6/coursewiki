<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Coincident: before and after</title><desc id="desc">Two endpoints are apart. After: the endpoints share one position.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M25 120 L105 60"/><circle cx="105" cy="60" r="5" fill="#002144"/><path d="M140 90 L245 120"/><circle cx="140" cy="90" r="5" fill="#002144"/><g transform="translate(300 0)"><path d="M25 120 L120 75"/><path d="M120 75 L245 120"/><circle cx="120" cy="75" r="5" fill="#002144"/></g></g></svg>