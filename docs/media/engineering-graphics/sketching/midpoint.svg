<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Midpoint: before and after</title><desc id="desc">A point is away from a segment. After: it sits halfway between the segment endpoints.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M35 110 L245 110"/><circle cx="95" cy="65" r="5" fill="#002144"/><g transform="translate(300 0)"><path d="M35 110 L245 110"/><circle cx="140" cy="110" r="5" fill="#002144"/><path d="M85 103 L90 117"/><path d="M190 103 L195 117"/></g></g></svg>