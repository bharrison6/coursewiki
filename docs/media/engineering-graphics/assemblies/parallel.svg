<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Parallel planar faces</title><rect width="640" height="220" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="26" font-size="21" fill="#172b3a" stroke="none">Parallel planar faces</text><text x="25" y="55" font-size="15" fill="#172b3a" stroke="none">Before</text><text x="350" y="55" font-size="15" fill="#172b3a" stroke="none">After</text><line x1="310" y1="50" x2="310" y2="170" stroke="#a7b2ba" stroke-dasharray="5 5"/><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><line x1="60" y1="75" x2="240" y2="120" /><g transform="translate(325 0)"><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><line x1="60" y1="95" x2="240" y2="95" /><text x="80" y="123" font-size="14" fill="#172b3a" stroke="none">gap free</text></g><text x="20" y="200" font-size="15" fill="#172b3a" stroke="none">Orientation is set; separation is not specified.</text></g></svg>