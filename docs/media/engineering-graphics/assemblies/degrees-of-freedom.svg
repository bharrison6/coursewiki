<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" role="img" aria-labelledby="title"><title id="title">Six free motions become zero when a component is grounded</title><rect width="640" height="395" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="28" font-size="22" fill="#172b3a" stroke="none">Free rigid body: six independent motions</text><rect x="90" y="80" width="45" height="30" fill="#d9edf5"/><text x="50" y="145" font-size="16" fill="#172b3a" stroke="none">Translate x</text><line x1="60" y1="95" x2="170" y2="95" /><path d="M60 95 l10 -7 m-10 7 l10 7 M170 95 l-10 -7 m10 7 l-10 7" fill="none"/><rect x="290" y="80" width="45" height="30" fill="#d9edf5"/><text x="250" y="145" font-size="16" fill="#172b3a" stroke="none">Translate y</text><line x1="260" y1="95" x2="370" y2="95" /><path d="M260 95 l10 -7 m-10 7 l10 7 M370 95 l-10 -7 m10 7 l-10 7" fill="none"/><rect x="490" y="80" width="45" height="30" fill="#d9edf5"/><text x="450" y="145" font-size="16" fill="#172b3a" stroke="none">Translate z</text><line x1="460" y1="95" x2="570" y2="95" /><path d="M460 95 l10 -7 m-10 7 l10 7 M570 95 l-10 -7 m10 7 l-10 7" fill="none"/><rect x="90" y="185" width="45" height="30" fill="#d9edf5"/><text x="50" y="250" font-size="16" fill="#172b3a" stroke="none">Rotate x</text><path d="M80 215 C45 145 180 145 150 215 l-4 -15 m4 15 l13 -8" fill="none"/><rect x="290" y="185" width="45" height="30" fill="#d9edf5"/><text x="250" y="250" font-size="16" fill="#172b3a" stroke="none">Rotate y</text><path d="M280 215 C245 145 380 145 350 215 l-4 -15 m4 15 l13 -8" fill="none"/><rect x="490" y="185" width="45" height="30" fill="#d9edf5"/><text x="450" y="250" font-size="16" fill="#172b3a" stroke="none">Rotate z</text><path d="M480 215 C445 145 580 145 550 215 l-4 -15 m4 15 l13 -8" fill="none"/><text x="20" y="295" font-size="20" fill="#172b3a" stroke="none">After grounding: 0 DOF relative to the assembly frame</text><rect x="270" y="320" width="65" height="40" fill="#d9edf5"/><line x1="235" y1="363" x2="365" y2="363" /><line x1="235" y1="363" x2="225" y2="376" /><line x1="250" y1="363" x2="240" y2="376" /><line x1="265" y1="363" x2="255" y2="376" /><line x1="280" y1="363" x2="270" y2="376" /><line x1="295" y1="363" x2="285" y2="376" /><line x1="310" y1="363" x2="300" y2="376" /><line x1="325" y1="363" x2="315" y2="376" /><line x1="340" y1="363" x2="330" y2="376" /><line x1="355" y1="363" x2="345" y2="376" /></g></svg>