<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Visible, hidden, center, and phantom line patterns"><rect width="760" height="440" fill="white"/><g fill="#182c40" font-family="system-ui,sans-serif" font-size="18"><g transform="translate(0 0)"><text x="20" y="47" font-weight="700">Visible</text><path d="M260 45L560 45" fill="none" stroke="#182c40" stroke-width="1.7" style="stroke-width:4"/><text x="20" y="91" font-size="17">Solid and thick: an edge you can see.</text><path d="M20 105h720" stroke="#d5dce2"/></g><g transform="translate(0 110)"><text x="20" y="47" font-weight="700">Hidden</text><path d="M260 45L560 45" fill="none" stroke="#182c40" stroke-width="1.7" stroke-dasharray="11 7"/><text x="20" y="91" font-size="17">Short dashes: an edge behind material.</text><path d="M20 105h720" stroke="#d5dce2"/></g><g transform="translate(0 220)"><text x="20" y="47" font-weight="700">Center</text><path d="M260 45L560 45" fill="none" stroke="#182c40" stroke-width="1.7" stroke-dasharray="48 7 7 7"/><text x="20" y="91" font-size="17">Long–short: axis, center, or symmetry.</text><path d="M20 105h720" stroke="#d5dce2"/></g><g transform="translate(0 330)"><text x="20" y="47" font-weight="700">Phantom</text><path d="M260 45L560 45" fill="none" stroke="#182c40" stroke-width="1.7" stroke-dasharray="48 7 7 7 7 7"/><text x="20" y="91" font-size="17">Long–short–short: alternate position or reference.</text><path d="M20 105h720" stroke="#d5dce2"/></g></g></svg>
