<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
<title id="title">Four practical steel families</title><desc id="desc">Steel branches into carbon, alloy, stainless and tool steel. Carbon branches into low, medium and high carbon. These categories overlap in chemistry.</desc>
<rect width="800" height="370" fill="#fff"/>
<g stroke="#18324b" stroke-width="3" fill="none"><path d="M400 75V110H105V145M400 110H695V145M300 110V145M500 110V145M105 210V250H55V275M105 250H225V275M140 250V275"/></g>
<g fill="#eef5fa" stroke="#18324b" stroke-width="2"><rect x="300" y="20" width="200" height="55" rx="8"/><rect x="20" y="145" width="170" height="65" rx="8"/><rect x="215" y="145" width="170" height="65" rx="8"/><rect x="415" y="145" width="170" height="65" rx="8"/><rect x="610" y="145" width="170" height="65" rx="8"/></g>
<g fill="#18324b" font-family="Arial,sans-serif" font-size="22" text-anchor="middle"><text x="400" y="55">Steel</text><text x="105" y="184">Carbon</text><text x="300" y="184">Alloy</text><text x="500" y="184">Stainless</text><text x="695" y="184">Tool</text><text x="55" y="300" font-size="18">Low</text><text x="140" y="300" font-size="18">Medium</text><text x="225" y="300" font-size="18">High</text><text x="400" y="348" font-size="18">Buying categories overlap in chemistry; specify grade and condition.</text></g>
</svg>
