<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" role="img" aria-labelledby="title desc">
<title id="title">Long-grain and end-grain glue surfaces</title><desc id="desc">Original CourseWiki schematic. Read labels and the accompanying page for limitations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#243b53"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b40;font-size:19px} .heading{font-size:23px;font-weight:700} .a{fill:#efd49c;stroke:#243b53;stroke-width:2} .b{fill:#acd5e5;stroke:#243b53;stroke-width:2} .motion{stroke:#243b53;stroke-width:2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)} .grain{stroke:#896b3b;stroke-width:2;fill:none}</style>
<rect width="900" height="455" rx="12" fill="#fffdf7"/><text class="heading" x="25" y="38">Glue contact and fiber direction</text>
<text class="heading" x="25" y="85">Long grain to long grain</text>
<rect class="a" x="35" y="115" width="370" height="85"/><rect class="a" x="35" y="210" width="370" height="85"/>
<path class="grain" d="M45 135H395 M45 155H395 M45 180H395 M45 230H395 M45 255H395 M45 280H395"/>
<rect x="35" y="200" width="370" height="10" fill="#147ca3"/>
<text x="35" y="330">Continuous contact along fibers</text>
<text class="heading" x="470" y="85">End grain to face</text>
<rect class="a" x="530" y="115" width="100" height="85"/><rect class="a" x="470" y="210" width="370" height="85"/>
<path class="grain" d="M545 120V193 M565 120V193 M585 120V193 M605 120V193 M620 120V193 M480 230H830 M480 255H830 M480 280H830"/>
<rect x="530" y="200" width="100" height="10" fill="#147ca3"/>
<path d="M545 200V170 M565 200V180 M585 200V165 M605 200V175 M620 200V180" stroke="#147ca3" stroke-width="6"/>
<text x="470" y="330">Adhesive can wick into cut ends</text>
<rect x="30" y="370" width="22" height="12" fill="#147ca3"/><text x="65" y="385">Blue = adhesive; brown lines = fiber direction</text>
<text x="30" y="425">End-grain bonds are possible; joint design and application still govern strength.</text></svg>