<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1000" role="img" aria-labelledby="title desc">
<title id="title">Six wood joints shown before assembly</title><desc id="desc">Original CourseWiki schematic. Read labels and the accompanying page for limitations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#243b53"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172b40;font-size:19px} .heading{font-size:23px;font-weight:700} .a{fill:#efd49c;stroke:#243b53;stroke-width:2} .b{fill:#acd5e5;stroke:#243b53;stroke-width:2} .motion{stroke:#243b53;stroke-width:2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)} .grain{stroke:#896b3b;stroke-width:2;fill:none}</style>
<rect width="960" height="1000" rx="12" fill="#fffdf7"/><text class="heading" x="28" y="38">Joint gallery · exploded profiles</text><text x="28" y="68">Dashed arrows show assembly direction. Not to scale.</text><g transform="translate(20 95)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Butt</text><g transform="translate(0 8)"><path class="a" d="M70 155H390V190H70Z"/><path class="b" d="M100 50H135V115H100Z"/><path class="motion" d="M118 122V150"/></g><text x="16" y="265" font-size="17">End meets an uncut face.</text></g><g transform="translate(490 95)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Rabbet</text><g transform="translate(0 8)"><path class="a" d="M70 150H135V175H390V210H70Z"/><path class="b" d="M135 45H170V130H135Z"/><path class="motion" d="M153 137V170"/></g><text x="16" y="265" font-size="17">A step at an edge receives the end.</text></g><g transform="translate(20 390)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Dado</text><g transform="translate(0 8)"><path class="a" d="M70 150H210V180H245V150H390V215H70Z"/><path class="b" d="M210 45H245V110H210Z"/><path class="motion" d="M227 118V173"/></g><text x="16" y="265" font-size="17">A channel across grain receives a part.</text></g><g transform="translate(490 390)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Half-lap</text><g transform="translate(0 8)"><path class="a" d="M40 110H170V135H220V160H40Z"/><path class="b" d="M270 110H430V160H320V135H270Z"/><path class="motion" d="M290 190H190"/><text x="65" y="75">Lower half</text><text x="270" y="75">Upper half</text></g><text x="16" y="265" font-size="17">Reduced ends overlap to full thickness.</text></g><g transform="translate(20 685)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Miter</text><g transform="translate(0 8)"><path class="a" d="M60 150H210L260 200H60Z"/><path class="b" d="M290 45H340V200L290 150Z"/><path class="motion" d="M282 120H215"/></g><text x="16" y="265" font-size="17">Angled faces meet at the corner.</text></g><g transform="translate(490 685)"><rect width="455" height="280" rx="10" fill="#ffffff" stroke="#b4c1c9"/><text class="heading" x="18" y="30">Mortise and tenon</text><g transform="translate(0 8)"><path class="a" d="M60 80H180V120H135V160H180V205H60Z"/><path class="b" d="M285 95H430V185H285V160H240V120H285Z"/><path class="motion" d="M260 215H160"/><text x="65" y="55">Socket (section)</text><text x="280" y="65">Tenon</text></g><text x="16" y="265" font-size="17">A tongue enters a matching socket.</text></g></svg>