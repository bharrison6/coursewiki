<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">Tangential, radial and longitudinal directions in wood</title><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="19" fill="#182d40" stroke-linejoin="round"><text x="30" y="35" font-size="23">Movement directions in normal straight-grained wood</text><circle cx="230" cy="245" r="155" fill="#f5deb0" stroke="#805929" stroke-width="2"/><circle cx="230" cy="245" r="120" fill="none" stroke="#805929" stroke-width="2"/><circle cx="230" cy="245" r="85" fill="none" stroke="#805929" stroke-width="2"/><circle cx="230" cy="245" r="50" fill="none" stroke="#805929" stroke-width="2"/><circle cx="230" cy="245" r="5" fill="#182d40" stroke="#805929" stroke-width="2"/><path d="M 230 245 L 345 245 M 334 237 L 345 245 L 334 253" stroke="#005e83" stroke-width="4" fill="none"/><text x="247" y="232" font-size="20">Radial</text><path d="M 106 208 A 130 130 0 0 1 230 115 M 217 108 L 230 115 L 219 124" stroke="#005e83" stroke-width="4" fill="none"/><text x="40" y="70" font-size="19">Tangential: around a ring</text><circle cx="230" cy="315" r="15" fill="white" stroke="#182d40" stroke-width="2"/><circle cx="230" cy="315" r="4" fill="#182d40" stroke="#805929" stroke-width="2"/><text x="450" y="140" font-size="22">Tangential: greatest movement</text><text x="450" y="185" font-size="22">Radial: smaller movement</text><text x="450" y="230" font-size="21">Longitudinal: usually much smaller</text><path d="M 246 315 H 425" stroke="#182d40" stroke-width="2" fill="none"/><text x="450" y="320" font-size="21">Longitudinal: out of this view</text><text x="40" y="445" font-size="18">Compare directions, not arrow lengths: this diagram is not a shrinkage scale.</text></g></svg>