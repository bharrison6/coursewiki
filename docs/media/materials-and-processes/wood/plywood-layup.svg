<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title"><title id="title">Exploded five-ply plywood with alternating veneer grain directions</title><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="19" fill="#182d40" stroke-linejoin="round"><text x="30" y="35" font-size="24">Plywood: a balanced five-ply example</text><path d="M 60 90 l 75 -25 h 330 l -75 25 z" stroke="#805929" stroke-width="2" fill="#f0d5a0"/><path d="M 60 90 v 13 h 330 v -13 M 390 103 l 75 -25 v -13" stroke="#805929" stroke-width="2" fill="#d5ab70"/><path d="M 130 80 h 260 m -10 -5 l 10 5 l -10 5" stroke="#005e83" stroke-width="3" fill="none"/><text x="520" y="90" font-size="21">Ply 1: lengthwise grain</text><path d="M 60 155 l 75 -25 h 330 l -75 25 z" stroke="#805929" stroke-width="2" fill="#f0d5a0"/><path d="M 60 155 v 13 h 330 v -13 M 390 168 l 75 -25 v -13" stroke="#805929" stroke-width="2" fill="#d5ab70"/><path d="M 170 153 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><path d="M 240 153 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><path d="M 310 153 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><text x="520" y="155" font-size="21">Ply 2: crosswise grain</text><path d="M 60 220 l 75 -25 h 330 l -75 25 z" stroke="#805929" stroke-width="2" fill="#f0d5a0"/><path d="M 60 220 v 13 h 330 v -13 M 390 233 l 75 -25 v -13" stroke="#805929" stroke-width="2" fill="#d5ab70"/><path d="M 130 210 h 260 m -10 -5 l 10 5 l -10 5" stroke="#005e83" stroke-width="3" fill="none"/><text x="520" y="220" font-size="21">Ply 3: lengthwise grain</text><path d="M 60 285 l 75 -25 h 330 l -75 25 z" stroke="#805929" stroke-width="2" fill="#f0d5a0"/><path d="M 60 285 v 13 h 330 v -13 M 390 298 l 75 -25 v -13" stroke="#805929" stroke-width="2" fill="#d5ab70"/><path d="M 170 283 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><path d="M 240 283 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><path d="M 310 283 l 57 -19 m -13 -2 l 13 2 l -8 8" stroke="#005e83" stroke-width="3" fill="none"/><text x="520" y="285" font-size="21">Ply 4: crosswise grain</text><path d="M 60 350 l 75 -25 h 330 l -75 25 z" stroke="#805929" stroke-width="2" fill="#f0d5a0"/><path d="M 60 350 v 13 h 330 v -13 M 390 363 l 75 -25 v -13" stroke="#805929" stroke-width="2" fill="#d5ab70"/><path d="M 130 340 h 260 m -10 -5 l 10 5 l -10 5" stroke="#005e83" stroke-width="3" fill="none"/><text x="520" y="350" font-size="21">Ply 5: lengthwise grain</text><text x="35" y="445" font-size="18">Veneers are bonded face to face. Gaps show the layup; they are not in the panel.</text></g></svg>