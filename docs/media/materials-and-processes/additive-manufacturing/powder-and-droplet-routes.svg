<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Powder fusion, binder on powder, and jetted build material</title>
  <desc id="desc">Three stacked sequences compare powder bed fusion, binder jetting, and material jetting. Each identifies what is placed, what selects or joins it, and the state after repeated layers.</desc>
  <rect width="400" height="1040" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:23px;font-weight:bold}.label{font-size:20px;font-weight:bold}.note{font-size:18px}.small{font-size:15px}.panel{fill:#eef6fa;stroke:#17324d;stroke-width:2}.powder{fill:#d8c7a3;stroke:#17324d;stroke-width:1.5}.selected{fill:#edac00;stroke:#17324d;stroke-width:2}.binder{fill:#00769d}.drop{fill:#8b4fa6}.arrow{fill:none;stroke:#17324d;stroke-width:2;marker-end:url(#arrow)}.energy{fill:none;stroke:#17324d;stroke-width:2;stroke-dasharray:7 5}</style>
  <text x="18" y="30" class="head">Powder and droplet routes</text>
  <text x="18" y="54" class="small">Material → joining → post-build steps</text>

  <g transform="translate(15 72)">
    <rect class="panel" width="370" height="300" rx="10"/><text x="16" y="30" class="label">Powder bed fusion</text>
    <g transform="translate(18 47)"><rect class="powder" width="112" height="44"/><circle cx="18" cy="14" r="3"/><circle cx="38" cy="31" r="3"/><circle cx="59" cy="15" r="3"/><circle cx="80" cy="31" r="3"/><circle cx="100" cy="14" r="3"/><text x="142" y="19" class="note">Spread build-material</text><text x="142" y="41" class="note">powder</text></g>
    <path class="arrow" d="M74 98V126"/><g transform="translate(18 135)"><rect class="powder" width="112" height="44"/><path class="selected" d="M22 35L42 12H78L98 35Z"/><path class="energy" d="M60 -5V12"/><text x="142" y="19" class="note">Energy fuses</text><text x="142" y="41" class="note">selected powder</text></g>
    <path class="arrow" d="M74 186V214"/><g transform="translate(18 223)"><rect class="powder" width="112" height="44"/><path class="selected" d="M22 35V12H98V35Z"/><text x="142" y="19" class="note">Fused layer remains</text><text x="142" y="41" class="note">surrounded by powder</text></g>
  </g>

  <g transform="translate(15 388)">
    <rect class="panel" width="370" height="300" rx="10"/><text x="16" y="30" class="label">Binder jetting</text>
    <g transform="translate(18 47)"><rect class="powder" width="112" height="44"/><circle cx="18" cy="14" r="3"/><circle cx="38" cy="31" r="3"/><circle cx="59" cy="15" r="3"/><circle cx="80" cy="31" r="3"/><circle cx="100" cy="14" r="3"/><text x="142" y="19" class="note">Spread build-material</text><text x="142" y="41" class="note">powder</text></g>
    <path class="arrow" d="M74 98V126"/><g transform="translate(18 135)"><rect class="powder" width="112" height="44"/><path class="binder" d="M30 2l7-11 7 11a7 7 0 11-14 0zM54 2l7-11 7 11a7 7 0 11-14 0zM78 2l7-11 7 11a7 7 0 11-14 0z"/><path class="selected" d="M22 36L42 14H78L98 36Z" opacity=".75"/><text x="142" y="19" class="note">Deposit binder</text><text x="142" y="41" class="note">in selected powder</text></g>
    <path class="arrow" d="M74 186V214"/><g transform="translate(18 223)"><path class="selected" d="M22 42V7H98V42Z" opacity=".75"/><text x="142" y="19" class="note">Green shape: consolidate</text><text x="142" y="41" class="note">as the route requires</text></g>
  </g>

  <g transform="translate(15 704)">
    <rect class="panel" width="370" height="300" rx="10"/><text x="16" y="30" class="label">Material jetting</text>
    <g transform="translate(18 42)"><path class="drop" d="M12 20L24 0l12 20a12 12 0 11-24 0zM48 20L60 0l12 20a12 12 0 11-24 0zM84 20L96 0l12 20a12 12 0 11-24 0z"/><text x="142" y="19" class="note">Droplets contain</text><text x="142" y="41" class="note">build material</text></g>
    <path class="arrow" d="M74 98V126"/><g transform="translate(18 135)"><path class="selected" d="M12 43V22H108V43Z"/><path class="energy" d="M28 9H92"/><text x="142" y="19" class="note">Deposit, then cure</text><text x="142" y="41" class="note">or solidify the droplets</text></g>
    <path class="arrow" d="M74 186V214"/><g transform="translate(18 223)"><path class="selected" d="M12 43V7H94V43Z"/><path class="binder" d="M94 43V22H112V43Z" opacity=".65"/><text x="142" y="19" class="note">Build material plus</text><text x="142" y="41" class="note">route-specific support</text></g>
  </g>
  <text x="200" y="1028" text-anchor="middle" class="small">Conceptual; particle and layer sizes are exaggerated.</text>
</svg>
