<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Flatness before parallel thickness</title><desc id="desc">Conceptual diagram, not a machine setup drawing. Not to scale.</desc><rect width="800" height="420" fill="#fff"/><style>text{font:18px sans-serif;fill:#12284c}.heading{font-size:22px;font-weight:bold}.wood{fill:#f7e5b5;stroke:#12284c;stroke-width:2}.line{fill:none;stroke:#12284c;stroke-width:3}.cut{fill:none;stroke:#b44015;stroke-width:4}.note{font-size:16px}</style>
<text x="25" y="35" class="heading">Jointer: establish one flat reference face</text>
<path d="M45 95Q120 65 195 90T345 85L345 155H45Z" class="wood"/>
<path d="M45 155H345" class="cut"/><text x="380" y="110">Opposite face still uneven</text>
<path d="M350 155H420" class="line"/><text x="430" y="162">Flat reference face</text>
<text x="25" y="225" class="heading">Planer: make the other face parallel</text>
<rect x="45" y="270" width="300" height="65" class="wood"/>
<path d="M45 270H345 M45 335H345" class="cut"/>
<path d="M30 345H365" class="line"/><text x="380" y="295">Opposite face cut parallel</text><text x="380" y="337">Reference face rests on bed</text>
<text x="25" y="390" class="note">Result geometry only. Jointing both faces does not ensure parallel faces.</text>
</svg>