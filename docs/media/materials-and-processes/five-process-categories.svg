<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" role="img" aria-labelledby="title desc">
<title id="title">Five manufacturing process categories</title>
<desc id="desc">Choose the category by the intended change. The categories are not a fixed production sequence.</desc>
<rect width="640" height="850" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#10263b">
<text x="26" y="43" font-size="29" font-weight="bold">What change are you making?</text>
<rect x="20" y="70" width="600" height="130" rx="10" fill="#f0f5f8" stroke="#466276"/>
<circle cx="51" cy="104" r="18" fill="#173b59"/>
<text x="51" y="112" text-anchor="middle" font-size="23" fill="#fff">1</text>
<text x="82" y="112" font-size="28" font-weight="bold">SEPARATING</text>
<text x="38" y="150" font-size="26">Remove material</text>
<text x="38" y="182" font-size="25">Saw wood; drill metal; laser-cut acrylic</text>
<rect x="20" y="215" width="600" height="130" rx="10" fill="#f0f5f8" stroke="#466276"/>
<circle cx="51" cy="249" r="18" fill="#173b59"/>
<text x="51" y="257" text-anchor="middle" font-size="23" fill="#fff">2</text>
<text x="82" y="257" font-size="28" font-weight="bold">FORMING</text>
<text x="38" y="295" font-size="26">Create shape</text>
<text x="38" y="327" font-size="25">Cast metal; mold plastic; 3D print</text>
<rect x="20" y="360" width="600" height="130" rx="10" fill="#f0f5f8" stroke="#466276"/>
<circle cx="51" cy="394" r="18" fill="#173b59"/>
<text x="51" y="402" text-anchor="middle" font-size="23" fill="#fff">3</text>
<text x="82" y="402" font-size="28" font-weight="bold">FABRICATING</text>
<text x="38" y="440" font-size="26">Join parts</text>
<text x="38" y="472" font-size="25">Weld a frame; glue wood; add screws</text>
<rect x="20" y="505" width="600" height="130" rx="10" fill="#f0f5f8" stroke="#466276"/>
<circle cx="51" cy="539" r="18" fill="#173b59"/>
<text x="51" y="547" text-anchor="middle" font-size="23" fill="#fff">4</text>
<text x="82" y="547" font-size="28" font-weight="bold">CONDITIONING</text>
<text x="38" y="585" font-size="26">Change internal properties</text>
<text x="38" y="617" font-size="25">Dry wood; cure resin; anneal metal</text>
<rect x="20" y="650" width="600" height="130" rx="10" fill="#f0f5f8" stroke="#466276"/>
<circle cx="51" cy="684" r="18" fill="#173b59"/>
<text x="51" y="692" text-anchor="middle" font-size="23" fill="#fff">5</text>
<text x="82" y="692" font-size="28" font-weight="bold">FINISHING</text>
<text x="38" y="730" font-size="26">Treat the surface</text>
<text x="38" y="762" font-size="25">Paint; plate; stain; polish</text>
<text x="26" y="824" font-size="24">Classify the purpose, then explain the overlap.</text>
</g></svg>