<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">FDM cross-section during printing</title>
  <desc id="desc">Filament enters a heated nozzle. The nozzle deposits layers on a part with solid walls and sparse infill. Temporary supports hold up an overhang. All rest on a build plate.</desc>
  <rect width="640" height="460" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#002144">
    <text x="24" y="32" font-size="23" font-weight="bold">FDM: build the part one layer at a time</text>
    <path d="M310 50V98" fill="none" stroke="#002144" stroke-width="9"/>
    <path d="M281 98H339V137L314 164H306L281 137Z" fill="#ecac00" stroke="#002144" stroke-width="2"/>
    <path d="M310 164V180H356" fill="none" stroke="#002144" stroke-width="6"/>
    <path d="M290 72H214M339 115H388" stroke="#002144" stroke-width="2"/>
    <text x="87" y="78">Filament</text><text x="399" y="121">Heated nozzle</text>
    <rect x="112" y="184" width="322" height="32" fill="#d8ebf3" stroke="#002144" stroke-width="2"/>
    <rect x="112" y="216" width="200" height="162" fill="#fff" stroke="#002144" stroke-width="2"/>
    <path d="M112 216H312M112 234H312M112 252H312M112 270H312M112 288H312M112 306H312M112 324H312M112 342H312M112 360H312" stroke="#afc6d5" stroke-width="2"/>
    <path d="M135 216V378M289 216V378" stroke="#002144" stroke-width="8"/>
    <path d="M143 216L281 270L143 324L281 378M281 216L143 270L281 324L143 378" stroke="#00719c" stroke-width="4" fill="none"/>
    <path d="M339 225V378M367 225V378M395 225V378M423 225V378M332 243H430M332 270H430M332 297H430M332 324H430M332 351H430" fill="none" stroke="#8a5700" stroke-width="3" stroke-dasharray="6 4"/>
    <rect x="76" y="380" width="414" height="20" rx="3" fill="#002144"/>
    <path d="M434 199H458M395 297H453M211 270L211 426H319M112 286H37V238" fill="none" stroke="#002144" stroke-width="2"/>
    <text x="466" y="204">Overhang</text>
    <text x="463" y="286">Temporary</text><text x="463" y="310">supports</text>
    <text x="326" y="432">Sparse infill</text>
    <text x="20" y="210">Layers</text><text x="20" y="233">and walls</text>
    <text x="77" y="432">Build plate</text>
  </g>
</svg>
