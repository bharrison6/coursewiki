<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
<title id="title">Sand-casting mold cross-section</title><desc id="desc">Cope and drag contain the cavity. A tapered sprue and runner feed it. A riser feeds shrinkage; a core is supported at both ends. Schematic, not a tooling design.</desc>
<rect width="820" height="440" fill="#fff"/>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#142b43} .small {font-size:15px} .head {font-size:23px;font-weight:bold} .line {stroke:#142b43;stroke-width:2;fill:none} .metal {fill:#b9d5e7;stroke:#142b43;stroke-width:2} .tool {fill:#cbd0d6;stroke:#142b43;stroke-width:2}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#142b43"/></marker></defs>

<text x="25" y="32" class="head">A mold shapes the outside; a core creates an opening</text>
<rect x="135" y="90" width="580" height="285" fill="#eee1c6" stroke="#142b43" stroke-width="2"/>
<path d="M175 90H220L211 285H184Z M184 275H355V295H184Z" fill="#e9ac45" stroke="#142b43" stroke-width="2"/>
<path d="M345 175H595V325H345Z M535 90H585V175H535Z" fill="#e9ac45" stroke="#142b43" stroke-width="2"/>
<rect x="315" y="225" width="310" height="50" fill="#b9d5e7" stroke="#142b43" stroke-width="2"/>
<path d="M135 250H315M625 250H715" class="line" stroke-dasharray="6 5"/>
<text x="25" y="155">Cope</text><path d="M85 150H130" class="line"/>
<text x="25" y="335">Drag</text><path d="M85 330H130" class="line"/>
<text x="155" y="65">Sprue</text><path d="M194 69V86" class="line"/>
<text x="525" y="65">Riser</text><path d="M560 69V86" class="line"/>
<text x="390" y="205">Metal-filled cavity</text><text x="375" y="257">Supported core</text>
<text x="180" y="355">Runner</text><path d="M220 335V301" class="line" marker-end="url(#arrow)"/>
<text x="330" y="365">Gate</text><path d="M350 345V301" class="line" marker-end="url(#arrow)"/>
<text x="25" y="409" class="small">Gold: metal / feed passages. Blue: core. Dashed line: mold parting plane. Not to scale.</text></svg>
