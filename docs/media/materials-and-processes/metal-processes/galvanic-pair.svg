<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title desc">
<title id="title">Galvanic contact and electrical isolation</title><desc id="desc">Left: dissimilar electrically connected metals share a conductive liquid. Right: insulating washers and a sleeve interrupt contact between a fastener and plate. Concept only, not a structural joint detail.</desc>
<rect width="880" height="410" fill="#fff"/>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#142b43} .small {font-size:15px} .head {font-size:23px;font-weight:bold} .line {stroke:#142b43;stroke-width:2;fill:none} .metal {fill:#b9d5e7;stroke:#142b43;stroke-width:2} .tool {fill:#cbd0d6;stroke:#142b43;stroke-width:2}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#142b43"/></marker></defs>

<text x="20" y="35" class="head">Connected and wet</text><text x="465" y="35" class="head">Interrupt the electrical path</text>
<path d="M440 15V365" class="line"/>
<path d="M35 140Q130 95 220 140T405 140V175H35Z" fill="#c9eafa" stroke="#142b43" stroke-width="2"/>
<text x="75" y="100">Conductive liquid</text>
<rect x="35" y="175" width="185" height="75" fill="#eed6a0" stroke="#142b43" stroke-width="2"/>
<rect x="220" y="175" width="185" height="75" class="metal"/>
<text x="55" y="205">More active</text><text x="55" y="232">metal: anode</text><text x="235" y="205">More noble</text><text x="235" y="232">metal: cathode</text>
<text x="55" y="295">Electrical contact at the joint</text><text x="55" y="325">Anode can lose metal faster</text>
<rect x="500" y="170" width="135" height="75" class="metal"/><rect x="685" y="170" width="135" height="75" class="metal"/>
<rect x="635" y="160" width="50" height="95" fill="#eed6a0" stroke="#142b43" stroke-width="2"/>
<rect x="610" y="150" width="100" height="15" fill="#eed6a0" stroke="#142b43" stroke-width="2"/>
<rect x="610" y="255" width="100" height="15" fill="#eed6a0" stroke="#142b43" stroke-width="2"/>
<rect x="649" y="140" width="22" height="145" class="tool"/><rect x="620" y="125" width="80" height="25" class="tool"/><rect x="625" y="270" width="70" height="28" class="tool"/>
<text x="490" y="85">Insulating washers + sleeve</text><path d="M680 95L700 145M615 105L640 195" class="line"/>
<text x="490" y="330">No shank-to-hole-wall contact</text>
<text x="20" y="390" class="small">Isolation must suit the loads and environment; drainage and coating design still matter.</text></svg>