<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">One-part mold from a printed pattern</title><desc id="desc">Four cross-sections show a tapered printed pattern on a flat base, silicone around the pattern, the inverted open mold after pattern removal, and a casting filling that cavity. The pattern is wider at its flat back so the final cavity widens toward its opening.</desc>
<rect width="800" height="560" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#172b3a">
<text x="30" y="35" font-size="25" font-weight="bold">Pattern → silicone cavity → casting</text>
<text x="35" y="80">1. Flat back on box base</text><text x="435" y="80">2. Silicone surrounds pattern</text>
<g stroke="#243746" stroke-width="2"><path d="M45 110V230H345V110" fill="none"/><path d="M120 230L145 150H245L270 230Z" fill="#edc56c"/>
<path d="M445 110V230H745V110" fill="none"/><path d="M445 130H745V230H670L645 150H545L520 230H445Z" fill="#b4dcea"/><path d="M520 230L545 150H645L670 230Z" fill="#edc56c"/></g>
<text x="55" y="264" font-size="17">Sloped sides give draft.</text><text x="448" y="264" font-size="17">Cure as the product specifies.</text>
<text x="35" y="322">3. Invert; remove pattern</text><text x="435" y="322">4. Fill the open cavity</text>
<g stroke="#243746" stroke-width="2"><path d="M45 350H120L145 430H245L270 350H345V460H45Z" fill="#b4dcea"/><path d="M445 350H520L545 430H645L670 350H745V460H445Z" fill="#b4dcea"/><path d="M520 350H670L645 430H545Z" fill="#d2d8dd"/></g>
<path d="M195 400V345M185 355L195 345L205 355" fill="none" stroke="#243746" stroke-width="2"/>
<text x="55" y="490" font-size="17">Opening is the widest section.</text><text x="448" y="490" font-size="17">Cure, remove and inspect casting.</text>
<rect x="35" y="521" width="18" height="18" fill="#edc56c" stroke="#243746"/><text x="63" y="537" font-size="17">Printed pattern</text><rect x="275" y="521" width="18" height="18" fill="#b4dcea" stroke="#243746"/><text x="303" y="537" font-size="17">Silicone mold</text><rect x="510" y="521" width="18" height="18" fill="#d2d8dd" stroke="#243746"/><text x="538" y="537" font-size="17">Casting material</text>
</g></svg>
