<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Thermoplastic injection molding cycle</title>
  <desc id="desc">Five schematic cross-sections show clamping, filling, packing, cooling and ejection. Melt enters a closed mold, pressure feeds shrinkage, the part cools, and the open tool releases it. Cooling begins during filling and packing.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#173a53"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#173a53;font-size:22px}.head{font-size:26px;font-weight:bold}.tool{fill:#e0e8ee;stroke:#173a53;stroke-width:3}.hot{fill:#ecac00;stroke:#173a53;stroke-width:2}.cold{fill:#73bbd8;stroke:#173a53;stroke-width:2}.motion{fill:none;stroke:#173a53;stroke-width:3;marker-end:url(#arrow)}.line{stroke:#173a53;stroke-width:3;fill:none}.small{font-size:19px}</style>
  </defs>
  <rect width="760" height="760" rx="14" fill="#fff"/>
  <text x="24" y="38" class="head">One shot → one repeating cycle</text>
  <text x="24" y="66" class="small">Schematic mold sections • gold = hot material • blue = cooled part</text>
  <g transform="translate(0 90)">
    <path class="tool" d="M80 0H150V25H125V75H150V100H80Z"/>
    <path class="tool" d="M205 0H275V100H205V75H230V25H205Z"/>
    <path class="motion" d="M35 50H70"/><path class="motion" d="M320 50H285"/>
    <text x="355" y="30" class="head">1  Clamp</text><text x="355" y="61">Close the mold.</text><text x="355" y="89">Hold the halves together.</text>
  </g>
  <path class="motion" d="M178 196V216"/>
  <g transform="translate(0 225)">
    <path class="tool" d="M110 0H180V25H155V75H180V100H110Z"/>
    <path class="tool" d="M180 0H250V100H180V75H205V25H180Z"/>
    <path class="hot" d="M155 25H180V75H155V56H75V44H155Z"/>
    <path class="motion" d="M30 50H65"/>
    <text x="355" y="30" class="head">2  Inject</text><text x="355" y="61">Push melt into the cavity.</text><text x="355" y="89">The shape begins to fill.</text>
  </g>
  <path class="motion" d="M178 331V351"/>
  <g transform="translate(0 360)">
    <path class="tool" d="M110 0H180V25H155V75H180V100H110Z"/>
    <path class="tool" d="M180 0H250V100H180V75H205V25H180Z"/>
    <path class="hot" d="M155 25H205V75H155V56H75V44H155Z"/>
    <path class="motion" d="M30 50H65"/>
    <text x="355" y="30" class="head">3  Hold / pack</text><text x="355" y="61">Keep pressure on the melt.</text><text x="355" y="89">Feed shrinkage through the gate.</text>
  </g>
  <path class="motion" d="M178 466V486"/>
  <g transform="translate(0 495)">
    <path class="tool" d="M110 0H180V25H155V75H180V100H110Z"/>
    <path class="tool" d="M180 0H250V100H180V75H205V25H180Z"/>
    <path class="cold" d="M155 25H205V75H155V56H75V44H155Z"/>
    <circle cx="129" cy="18" r="7" fill="#73bbd8"/><circle cx="231" cy="82" r="7" fill="#73bbd8"/>
    <text x="355" y="30" class="head">4  Cool</text><text x="355" y="61">Remove enough heat for release.</text><text x="355" y="89">Cooling already began in step 2.</text>
  </g>
  <path class="motion" d="M178 601V621"/>
  <g transform="translate(0 630)">
    <path class="tool" d="M65 0H135V25H110V75H135V100H65Z"/>
    <path class="tool" d="M245 0H315V100H245V75H270V25H245Z"/>
    <rect class="cold" x="168" y="25" width="50" height="50"/>
    <path class="line" d="M85 38H152M85 62H152"/>
    <path class="motion" d="M180 86V112"/><path class="motion" d="M132 10H100"/><path class="motion" d="M250 10H282"/>
    <text x="355" y="30" class="head">5  Open and eject</text><text x="355" y="61">Pins push the part free.</text><text x="355" y="89">Return to clamp for the next shot.</text>
  </g>
</svg>
