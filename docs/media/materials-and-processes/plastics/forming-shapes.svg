<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">Four forming processes and the shapes they produce</title>
  <desc id="desc">Side-by-side schematic comparisons: air expands a parison into a hollow bottle; rotation coats a heated mold to make a tank; vacuum lets air pressure form hot sheet into an open tray; a die shapes a continuous hollow profile with constant cross-section.</desc>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#173a53"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#173a53;font-size:23px;text-anchor:middle}.head{font-size:27px;font-weight:bold}.small{font-size:20px}.tool{fill:#e0e8ee;stroke:#173a53;stroke-width:3}.hot{stroke:#ac7600;stroke-width:8;fill:none}.part{fill:#d4eef7;stroke:#173a53;stroke-width:4}.arrow{fill:none;stroke:#173a53;stroke-width:3;marker-end:url(#a)}</style>
  </defs>
  <rect width="1120" height="530" rx="14" fill="#fff"/>
  <text x="560" y="35" class="head">Starting material → forming action → product</text>
  <path d="M280 58V510M560 58V510M840 58V510" stroke="#bccbd5" stroke-width="2"/>
  <g>
    <text x="140" y="82" class="head">Blow</text>
    <text x="140" y="112">Hot tube + air</text>
    <path class="tool" d="M45 155H110V180Q70 185 70 215V275H45Z M170 155H235V275H210V215Q210 185 170 180Z"/>
    <path class="hot" d="M120 155V265H160V155"/>
    <path class="arrow" d="M140 133V205"/><path class="arrow" d="M118 225H85"/><path class="arrow" d="M162 225H195"/>
    <path class="arrow" d="M140 282V323"/>
    <path class="part" d="M122 344H158V370Q185 380 185 405V457Q140 472 95 457V405Q95 380 122 370Z"/>
    <text x="140" y="507">Hollow bottle</text>
  </g>
  <g transform="translate(280 0)">
    <text x="140" y="82" class="head">Rotational</text>
    <text x="140" y="112">Powder + rotation</text>
    <rect class="tool" x="65" y="165" width="150" height="105" rx="24"/>
    <rect x="75" y="175" width="130" height="85" rx="18" class="hot"/>
    <path class="arrow" d="M55 207Q33 142 121 140"/><path class="arrow" d="M224 211Q249 279 166 288"/>
    <path class="arrow" d="M140 158Q175 210 140 274"/>
    <text x="140" y="315" class="small">Heated mold coats inside</text>
    <path class="arrow" d="M140 326V349"/>
    <path class="part" d="M76 376Q76 360 94 360H184Q204 360 204 380V447Q204 465 184 465H94Q76 465 76 447Z"/>
    <rect class="part" x="113" y="350" width="48" height="14"/>
    <path d="M88 433H192" stroke="#173a53" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="140" y="507">Large hollow tank</text>
  </g>
  <g transform="translate(560 0)">
    <text x="140" y="82" class="head">Thermoform</text>
    <text x="140" y="112">Hot sheet + vacuum</text>
    <path class="tool" d="M40 195H70L93 270H187L210 195H240V291H40Z"/>
    <path d="M35 186H245" stroke="#ac7600" stroke-width="4" stroke-dasharray="8 5"/>
    <path class="hot" d="M35 195H70L93 266H187L210 195H245"/>
    <path class="arrow" d="M100 135V177"/><path class="arrow" d="M180 135V177"/><path class="arrow" d="M140 275V320"/>
    <text x="140" y="349" class="small">Air removed below sheet</text>
    <path class="part" d="M55 381H85L101 443H179L195 381H225V390H202L185 452H95L78 390H55Z"/>
    <text x="140" y="507">Open tray or shell</text>
  </g>
  <g transform="translate(840 0)">
    <text x="140" y="82" class="head">Extrusion</text>
    <text x="140" y="112">Melt + shaped die</text>
    <path class="tool" d="M26 175H129V231H26Z"/>
    <rect class="tool" x="129" y="150" width="35" height="110"/>
    <path d="M30 203H151" class="hot"/>
    <path class="part" d="M164 183H248V223H164V211H236V195H164Z"/>
    <path class="arrow" d="M35 241H112"/><path class="arrow" d="M175 244H248"/>
    <text x="140" y="292" class="small">Continuous output</text>
    <path class="arrow" d="M140 310V347"/>
    <path class="part" d="M55 396L185 358H235L105 396Z"/>
    <path class="part" d="M105 396L235 358V420L105 458Z"/>
    <path class="part" fill-rule="evenodd" d="M55 396H105V458H55Z M66 407V447H94V407Z"/>
    <text x="140" y="481" class="small">Same section along length</text>
    <text x="140" y="510">Continuous profile</text>
  </g>
</svg>
