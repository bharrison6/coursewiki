<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="title desc">
<title id="title">Right-hand and left-hand screw travel</title><desc id="desc">Both screws rotate clockwise as viewed by the same observer. With the nut fixed, the right-hand screw advances away; the left-hand screw advances toward the observer.</desc><rect width="760" height="455" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:18px} .line{fill:none;stroke:#172b4d;stroke-width:3} .dim{fill:none;stroke:#172b4d;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#172b4d"/></marker></defs><text x="20" y="30" font-weight="bold">Nut fixed · screw rotates and moves · observer at the driving end</text><text x="20" y="80" font-weight="bold">Right-hand</text><circle cx="90" cy="142" r="33" class="line"/><path d="M58 104A49 49 0 0 1 137 146" fill="none" stroke="#172b4d" stroke-width="2" marker-end="url(#a)"/><text x="30" y="205" font-size="16">Clockwise end view</text><rect x="265" y="115" width="360" height="50" fill="#f2f5f8" stroke="#172b4d"/><path d="M280 115L298 165" stroke="#637895" stroke-width="2"/><path d="M305 115L323 165" stroke="#637895" stroke-width="2"/><path d="M330 115L348 165" stroke="#637895" stroke-width="2"/><path d="M355 115L373 165" stroke="#637895" stroke-width="2"/><path d="M380 115L398 165" stroke="#637895" stroke-width="2"/><path d="M405 115L423 165" stroke="#637895" stroke-width="2"/><path d="M430 115L448 165" stroke="#637895" stroke-width="2"/><path d="M455 115L473 165" stroke="#637895" stroke-width="2"/><path d="M480 115L498 165" stroke="#637895" stroke-width="2"/><path d="M505 115L523 165" stroke="#637895" stroke-width="2"/><path d="M530 115L548 165" stroke="#637895" stroke-width="2"/><path d="M555 115L573 165" stroke="#637895" stroke-width="2"/><path d="M580 115L598 165" stroke="#637895" stroke-width="2"/><path d="M605 115L623 165" stroke="#637895" stroke-width="2"/><rect x="470" y="102" width="60" height="76" fill="#ecac00" stroke="#172b4d"/><text x="465" y="88">Fixed nut</text><text x="210" y="96" font-size="14">Observer →</text><path d="M310 195H410" stroke="#172b4d" stroke-width="3" marker-end="url(#a)"/><text x="440" y="202">Screw moves away</text><text x="20" y="260" font-weight="bold">Left-hand</text><circle cx="90" cy="322" r="33" class="line"/><path d="M58 284A49 49 0 0 1 137 326" fill="none" stroke="#172b4d" stroke-width="2" marker-end="url(#a)"/><text x="30" y="385" font-size="16">Clockwise end view</text><rect x="265" y="295" width="360" height="50" fill="#f2f5f8" stroke="#172b4d"/><path d="M280 295L262 345" stroke="#637895" stroke-width="2"/><path d="M305 295L287 345" stroke="#637895" stroke-width="2"/><path d="M330 295L312 345" stroke="#637895" stroke-width="2"/><path d="M355 295L337 345" stroke="#637895" stroke-width="2"/><path d="M380 295L362 345" stroke="#637895" stroke-width="2"/><path d="M405 295L387 345" stroke="#637895" stroke-width="2"/><path d="M430 295L412 345" stroke="#637895" stroke-width="2"/><path d="M455 295L437 345" stroke="#637895" stroke-width="2"/><path d="M480 295L462 345" stroke="#637895" stroke-width="2"/><path d="M505 295L487 345" stroke="#637895" stroke-width="2"/><path d="M530 295L512 345" stroke="#637895" stroke-width="2"/><path d="M555 295L537 345" stroke="#637895" stroke-width="2"/><path d="M580 295L562 345" stroke="#637895" stroke-width="2"/><path d="M605 295L587 345" stroke="#637895" stroke-width="2"/><rect x="470" y="282" width="60" height="76" fill="#ecac00" stroke="#172b4d"/><text x="465" y="268">Fixed nut</text><text x="210" y="276" font-size="14">Observer →</text><path d="M410 375H310" stroke="#172b4d" stroke-width="3" marker-end="url(#a)"/><text x="440" y="382">Screw moves toward observer</text><text x="20" y="430">If the screw cannot move axially, the travelling nut moves the opposite way.</text></svg>
