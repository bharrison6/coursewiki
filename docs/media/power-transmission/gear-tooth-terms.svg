<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc">
<title id="title">Gear tooth terminology</title><desc id="desc">An enlarged external tooth sector marks addendum from pitch to tip, dedendum from pitch to root, and circular pitch along the pitch circle. A force diagram marks pressure angle from the common tangent to the line of action.</desc>
<rect width="820" height="480" fill="#fff"/>
<g font-family="Arial,sans-serif" font-size="18" fill="#172b4d">
<text x="30" y="30" font-weight="bold">Tooth sector (arcs flattened for clarity)</text>
<path d="M30 208H78Q90 208 95 185L120 100H160L185 185Q190 208 202 208H258Q270 208 275 185L300 100H340L365 185Q370 208 382 208H438Q450 208 455 185L480 100H520L545 185Q550 208 562 208H580V247H30Z" fill="#e4eaf1" stroke="#172b4d" stroke-width="2"/>
<path d="M25 100H610M25 208H610" stroke="#79869a" fill="none"/><path d="M25 150H610" stroke="#172b4d" stroke-dasharray="7 5"/>
<text x="625" y="105">Tip circle</text><text x="625" y="155">Pitch circle</text><text x="625" y="213">Root circle</text>
<g fill="none" stroke="#172b4d" stroke-width="1.5"><path d="M240 100V150M233 100H247M233 150H247M595 150V208M588 150H602M588 208H602"/><path d="M106 150V62M286 150V62M106 70H286M106 64V76M286 64V76"/></g>
<text x="196" y="58" text-anchor="middle" font-size="16">Circular pitch</text><text x="205" y="128" text-anchor="end" font-size="15">Addendum</text><text x="625" y="186" font-size="15">Dedendum</text>
<text x="30" y="289" font-weight="bold">At the pitch point of a standard external pair</text>
<path d="M170 315V456M55 409H410" stroke="#79869a" stroke-dasharray="6 4" fill="none"/>
<path d="M80 442L455 305" stroke="#172b4d" stroke-width="3" fill="none"/><path d="M250 409A80 80 0 0 0 245.2 381.6" stroke="#172b4d" stroke-width="2" fill="none"/>
<circle cx="170" cy="409" r="4" fill="#172b4d"/><text x="270" y="399">α</text><text x="440" y="413">Common tangent to pitch circles</text><text x="465" y="313">Line of action (contact force)</text><text x="33" y="471" font-size="15">Line of centers</text><text x="280" y="461" font-size="16">Pressure angle α is measured from the tangent.</text>
</g></svg>
