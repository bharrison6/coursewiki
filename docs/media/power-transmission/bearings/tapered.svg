<svg xmlns="http://www.w3.org/2000/svg" class="bgd-svg" viewBox="0 0 480 540" role="img" aria-label="Tapered roller. Conical rollers sit between conical raceways. Raceways and roller axes have a common cone apex on the shaft axis. A single row takes radial load plus thrust toward its small end, as drawn; an opposed bearing takes reverse thrust."><title>Tapered roller. Conical rollers sit between conical raceways. Raceways and roller axes have a common cone apex on the shaft axis. A single row takes radial load plus thrust toward its small end, as drawn; an opposed bearing takes reverse thrust.</title><style>.bgd-svg{--bgd-ink:#002144;--bgd-paper:#fbfaf8;--bgd-ring:#b7c4ce;--bgd-element:#deebf3;--bgd-shaft:#e8e7e2;--bgd-load:#b64114;--bgd-gold:#ecac00;background:var(--bgd-paper);color:var(--bgd-ink)}.bgd-svg text{fill:var(--bgd-ink);font-family:Arial,Helvetica,sans-serif;font-size:20px}.bgd-svg .title{font-size:23px;font-weight:700}.bgd-svg .small{font-size:17px}.bgd-svg .ring,.bgd-svg .element,.bgd-svg .shaft,.bgd-svg .housing{stroke:var(--bgd-ink);stroke-width:1.8;stroke-linejoin:round;fill:var(--bgd-ring)}.bgd-svg .element{fill:var(--bgd-element)}.bgd-svg .shaft{fill:var(--bgd-shaft)}.bgd-svg .housing{fill:#91a8b8}.bgd-svg .empty{fill:var(--bgd-paper);stroke:var(--bgd-ink);stroke-width:1.8}.bgd-svg .liner{fill:var(--bgd-gold);stroke:var(--bgd-ink);stroke-width:1}.bgd-svg .cage{fill:none;stroke:var(--bgd-gold);stroke-width:7}.bgd-svg .axis{fill:none;stroke:var(--bgd-ink);stroke-width:1;stroke-dasharray:10 4 2 4;opacity:.65}.bgd-svg .contact{fill:none;stroke:var(--bgd-load);stroke-width:2;stroke-dasharray:5 3}.bgd-svg .load,.bgd-svg .dim{fill:none;stroke:var(--bgd-load);stroke-width:3}.bgd-svg .load-head,.bgd-svg .dim-head{fill:var(--bgd-load)}.bgd-svg .leader{fill:none;stroke:var(--bgd-ink);stroke-width:1.5}.bgd-svg .divider{fill:none;stroke:#a5acb0;stroke-width:1}.bgd-svg .dimtext{fill:var(--bgd-load);font-size:20px;font-weight:700}</style><rect class="empty" x="0" y="0" width="480" height="540" rx="0"/><text class="title" x="18" y="29" text-anchor="start">Tapered roller</text><text class="small" x="18" y="53" text-anchor="start">Axial section · shaft axis runs left to right</text><g transform="translate(0 20)"><rect class="shaft" x="85" y="125" width="310" height="70" rx="0"/><path class="axis" d="M65 160L425 160"/><path class="ring" d="M155 49H315V51.1L155 86.3Z"/><path class="ring" d="M155 119.8L315 100.6V125H155Z"/><path class="element" d="M169 83.22L298 54.84L298 102.64L169 118.12Z"/><rect class="ring" x="298" y="90.64" width="10" height="34.36" rx="0"/><path class="axis" d="M165 101.35L305 77.55"/><g transform="translate(0 320) scale(1 -1)"><path class="ring" d="M155 49H315V51.1L155 86.3Z"/><path class="ring" d="M155 119.8L315 100.6V125H155Z"/><path class="element" d="M169 83.22L298 54.84L298 102.64L169 118.12Z"/><rect class="ring" x="298" y="90.64" width="10" height="34.36" rx="0"/><path class="axis" d="M165 101.35L305 77.55"/></g><path class="load" d="M370 77L370 125"/><path class="load-head" d="M370 125l-5 -10l10 0Z"/><text class="dimtext" x="383" y="97" text-anchor="start">Fᵣ</text><path class="load" d="M132 160L82 160"/><path class="load-head" d="M82 160l10 -5l0 10Z"/><text class="dimtext" x="75" y="188" text-anchor="start">Fₐ</text></g><path class="divider" d="M18 300L462 300"/><text class="small end-label" x="20" y="324" text-anchor="start">End view · covers omitted</text><g data-bgd-end=""><circle class="ring" cx="112" cy="410" r="76"/><circle class="empty" cx="112" cy="410" r="60"/><circle class="ring" cx="112" cy="410" r="46"/><circle class="empty" cx="112" cy="410" r="36"/><circle class="cage" cx="112" cy="410" r="53"/><circle class="element" cx="165" cy="410" r="10"/><circle class="element" cx="157.9" cy="436.5" r="10"/><circle class="element" cx="138.5" cy="455.9" r="10"/><circle class="element" cx="112" cy="463" r="10"/><circle class="element" cx="85.5" cy="455.9" r="10"/><circle class="element" cx="66.1" cy="436.5" r="10"/><circle class="element" cx="59" cy="410" r="10"/><circle class="element" cx="66.1" cy="383.5" r="10"/><circle class="element" cx="85.5" cy="364.1" r="10"/><circle class="element" cx="112" cy="357" r="10"/><circle class="element" cx="138.5" cy="364.1" r="10"/><circle class="element" cx="157.9" cy="383.5" r="10"/></g><text class="small" x="211" y="363" text-anchor="start">Conical contacts</text><text class="small" x="211" y="391" text-anchor="start">Large-end guiding rib</text><text class="small" x="211" y="423" text-anchor="start">Circles here are roller ends.</text><text class="small" x="18" y="525" text-anchor="start">Schematic geometry; arrows show load directions.</text></svg>
