<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
<title id="title">Pitch versus lead for one and three starts</title><desc id="desc">One full wrap advances ridge A by 2 mm with one start and 6 mm with three starts. Adjacent ridges remain 2 mm apart.</desc><rect width="760" height="580" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:18px} .line{fill:none;stroke:#172b4d;stroke-width:3} .dim{fill:none;stroke:#172b4d;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#172b4d"/></marker></defs><text x="20" y="30" font-weight="bold">Unwrap the screw: vertical distance = one turn around its circumference</text><text x="20" y="60" font-weight="bold">1 start · pitch 2 mm</text><rect x="110" y="100" width="560" height="120" fill="#f2f5f8" stroke="#7b8798"/><text x="15" y="108" font-size="14">0 turns</text><text x="15" y="220" font-size="14">1 turn</text><defs><clipPath id="clip1"><rect x="110" y="100" width="560" height="120"/></clipPath></defs><g clip-path="url(#clip1)"><path d="M-100 100L-30 220" stroke="#9da9b9" stroke-width="2"/><path d="M-30 100L40 220" stroke="#9da9b9" stroke-width="2"/><path d="M40 100L110 220" stroke="#9da9b9" stroke-width="2"/><path d="M110 100L180 220" stroke="#9da9b9" stroke-width="2"/><path d="M180 100L250 220" stroke="#9da9b9" stroke-width="2"/><path d="M250 100L320 220" stroke="#9da9b9" stroke-width="2"/><path d="M320 100L390 220" stroke="#9da9b9" stroke-width="2"/><path d="M390 100L460 220" stroke="#9da9b9" stroke-width="2"/><path d="M460 100L530 220" stroke="#9da9b9" stroke-width="2"/><path d="M530 100L600 220" stroke="#9da9b9" stroke-width="2"/><path d="M600 100L670 220" stroke="#9da9b9" stroke-width="2"/><path d="M670 100L740 220" stroke="#9da9b9" stroke-width="2"/><path d="M180 100L250 220" fill="none" stroke="#005a89" stroke-width="4" /></g><text x="188" y="128">A</text><text x="258" y="210">A</text><path d="M180 88H250" class="dim"/><text x="280" y="93">pitch = 2 mm</text><path d="M180 100V253" stroke="#172b4d" stroke-dasharray="4 4"/><path d="M180 245H250" class="dim"/><text x="265" y="250">lead = 2 mm/rev</text><text x="20" y="315" font-weight="bold">3 starts · pitch 2 mm</text><rect x="110" y="355" width="560" height="120" fill="#f2f5f8" stroke="#7b8798"/><text x="15" y="363" font-size="14">0 turns</text><text x="15" y="475" font-size="14">1 turn</text><defs><clipPath id="clip3"><rect x="110" y="355" width="560" height="120"/></clipPath></defs><g clip-path="url(#clip3)"><path d="M-100 355L110 475" stroke="#9da9b9" stroke-width="2"/><path d="M-30 355L180 475" stroke="#9da9b9" stroke-width="2"/><path d="M40 355L250 475" stroke="#9da9b9" stroke-width="2"/><path d="M110 355L320 475" stroke="#9da9b9" stroke-width="2"/><path d="M180 355L390 475" stroke="#9da9b9" stroke-width="2"/><path d="M250 355L460 475" stroke="#9da9b9" stroke-width="2"/><path d="M320 355L530 475" stroke="#9da9b9" stroke-width="2"/><path d="M390 355L600 475" stroke="#9da9b9" stroke-width="2"/><path d="M460 355L670 475" stroke="#9da9b9" stroke-width="2"/><path d="M530 355L740 475" stroke="#9da9b9" stroke-width="2"/><path d="M600 355L810 475" stroke="#9da9b9" stroke-width="2"/><path d="M670 355L880 475" stroke="#9da9b9" stroke-width="2"/><path d="M180 355L390 475" fill="none" stroke="#005a89" stroke-width="4" /><path d="M250 355L460 475" fill="none" stroke="#9c4400" stroke-width="4" stroke-dasharray="9 4"/><path d="M320 355L530 475" fill="none" stroke="#684194" stroke-width="4" stroke-dasharray="3 3"/></g><text x="188" y="383">A</text><text x="398" y="465">A</text><text x="258" y="383">B</text><text x="468" y="465">B</text><text x="328" y="383">C</text><text x="538" y="465">C</text><path d="M180 343H250" class="dim"/><text x="280" y="348">pitch = 2 mm</text><path d="M180 355V508" stroke="#172b4d" stroke-dasharray="4 4"/><path d="M180 500H390" class="dim"/><text x="405" y="505">lead = 6 mm/rev</text><text x="110" y="555">Horizontal distances are along the screw axis →</text></svg>
