<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Outside micrometer anatomy</title>
  <desc id="desc">An original schematic. A C-shaped frame holds the fixed anvil opposite a moving spindle. The sleeve, rotating thimble, spindle lock, and ratchet are labeled. The gap between measuring faces is the size being measured.</desc>
  <rect width="920" height="430" fill="#fff"/>
  <g stroke="#002144" stroke-width="3" fill="#e4e9ed">
    <path d="M130 150 L130 275 Q130 355 245 355 Q360 355 360 275 L360 150 L320 150 L320 270 Q320 310 245 310 Q170 310 170 270 L170 150 Z"/>
    <rect x="125" y="140" width="65" height="35"/>
    <rect x="270" y="143" width="145" height="29"/>
    <rect x="370" y="125" width="180" height="65"/>
    <rect x="550" y="113" width="165" height="89"/>
    <rect x="715" y="135" width="90" height="45"/>
    <rect x="336" y="110" width="25" height="32" fill="#ecac00"/>
  </g>
  <g stroke="#002144" stroke-width="2" fill="none">
    <path d="M390 158 H550 M405 158 V178 M435 158 V173 M465 158 V178 M495 158 V173 M525 158 V178"/>
    <path d="M555 135 H580 M555 158 H590 M555 180 H580 M730 137 V177 M745 137 V177 M760 137 V177 M775 137 V177"/>
    <path d="M157 140 V82 H90 M285 143 V65 H250 M430 125 V62 H445 M630 113 V65 M770 135 V80 H830 M350 110 V32 H350 M223 355 V390 H120"/>
    <path d="M190 183 V225 M270 183 V225 M190 212 H270 M190 212 L200 206 M190 212 L200 218 M270 212 L260 206 M270 212 L260 218"/>
  </g>
  <g fill="#002144" font-family="Arial,sans-serif" font-size="21">
    <text x="38" y="75">Fixed anvil</text><text x="185" y="55">Moving spindle</text>
    <text x="410" y="53">Sleeve</text><text x="585" y="55">Thimble</text><text x="790" y="70">Ratchet</text>
    <text x="315" y="25">Lock</text><text x="45" y="397">Frame</text>
    <text x="230" y="253" text-anchor="middle">Measured gap</text>
    <text x="475" y="285">Sleeve: coarse scale</text><text x="475" y="318">Thimble: fraction of a turn</text>
    <text x="475" y="351">Ratchet: controls contact force</text>
    <text x="475" y="394" font-size="17">Schematic; proportions are for explanation.</text>
  </g>
</svg>
