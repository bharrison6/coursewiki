<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">A vernier turns a small spacing difference into a visible alignment</title>
  <desc id="desc">Two shortened views of a 25-division inch vernier. Upper main-scale lines are 0.025 inch apart, lower vernier lines 0.024 inch apart. In the first view both zeros align. In the second the vernier shifts 0.003 inch, so the third vernier line aligns with main line three.</desc>
  <rect width="900" height="440" fill="#fff"/>
  <g fill="#002144" font-family="Arial,sans-serif" font-size="20">
    <text x="30" y="32">1. Zeros aligned: reading 0.000 in</text>
    <text x="30" y="245">2. Vernier shifted 0.003 in: division 3 aligns</text>
  </g>
  <g stroke="#002144" stroke-width="2">
    <path d="M70 110 H820 M70 100 V110 M170 75 V110 M270 75 V110 M370 75 V110 M470 75 V110 M570 75 V110 M670 75 V110 M770 75 V110 M70 75 V110"/>
    <path d="M70 118 H790 M70 118 V153 M166 118 V153 M262 118 V153 M358 118 V153 M454 118 V153 M550 118 V153 M646 118 V153 M742 118 V153"/>
    <path d="M70 320 H820 M70 285 V320 M170 285 V320 M270 285 V320 M370 285 V320 M470 285 V320 M570 285 V320 M670 285 V320 M770 285 V320"/>
    <path d="M82 328 H802 M82 328 V363 M178 328 V363 M274 328 V363 M370 328 V363 M466 328 V363 M562 328 V363 M658 328 V363 M754 328 V363"/>
  </g>
  <g stroke="#bb4a00" stroke-width="4"><path d="M70 75 V153 M370 285 V363"/></g>
  <g fill="#002144" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">
    <text x="70" y="65">0</text><text x="170" y="65">.025</text><text x="270" y="65">.050</text><text x="370" y="65">.075</text><text x="470" y="65">.100</text>
    <text x="70" y="177">0</text><text x="166" y="177">1</text><text x="262" y="177">2</text><text x="358" y="177">3</text><text x="454" y="177">4</text><text x="550" y="177">5</text><text x="646" y="177">6</text><text x="742" y="177">7</text>
    <text x="70" y="275">0</text><text x="170" y="275">.025</text><text x="270" y="275">.050</text><text x="370" y="275">.075</text><text x="470" y="275">.100</text>
    <text x="82" y="387">0</text><text x="178" y="387">1</text><text x="274" y="387">2</text><text x="370" y="387">3</text><text x="466" y="387">4</text><text x="562" y="387">5</text><text x="658" y="387">6</text><text x="754" y="387">7</text>
  </g>
  <g fill="#002144" font-family="Arial,sans-serif" font-size="18"><text x="550" y="65">Main: 0.025 in spaces</text><text x="70" y="207">Vernier: 0.024 in spaces; only the first 7 of 25 spaces shown.</text><text x="70" y="425">At division 3: 0.003 + 3 × 0.024 = 3 × 0.025 = 0.075 in.</text></g>
</svg>
