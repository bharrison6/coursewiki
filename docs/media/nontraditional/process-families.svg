<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" role="img" aria-labelledby="title">
<title id="title">Material-removal process family tree</title>
<rect width="800" height="940" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="36" fill="#002144">
<rect x="20" y="20" width="760" height="70" rx="12" fill="#002144"/>
<text x="400" y="67" text-anchor="middle" fill="white">Material removal</text>
<path d="M60 90V805M60 155H110M60 365H110M60 555H110" fill="none" stroke="#002144" stroke-width="5"/>
<rect x="110" y="115" width="670" height="195" rx="12" fill="#e6f3fa"/>
<text x="130" y="160" font-weight="bold">Defined cutting edges</text>
<text x="130" y="207">Turning · milling · drilling</text>
<text x="130" y="251">Sawing · broaching</text>
<text x="130" y="295">Shaping · planing</text>
<rect x="110" y="330" width="670" height="140" rx="12" fill="#fff1cc"/>
<text x="130" y="375" font-weight="bold">Abrasive grains</text>
<text x="130" y="425">Grinding · honing · lapping</text>
<rect x="110" y="505" width="670" height="355" rx="12" fill="#e6f3fa"/>
<text x="130" y="550" font-weight="bold">Nontraditional energy</text>
<text x="130" y="600">Thermal: EDM · laser · plasma</text>
<text x="130" y="650">Electrochemical: ECM</text>
<text x="130" y="700">Chemical: milling / etching</text>
<text x="130" y="750">Mechanical: waterjet</text>
<text x="130" y="800">and ultrasonic impact</text>
<text x="30" y="910">CNC controls motion across these families.</text></g></svg>