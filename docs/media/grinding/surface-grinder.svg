<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
<title id="title">Three surface grinder motions</title><desc id="desc">Side view shows the table reciprocating beneath the wheel. Top view shows crossfeed perpendicular to table travel. A second side view shows downfeed moving the wheel toward the work.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#102b49"/></marker></defs><rect width="800" height="900" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="36" fill="#102b49"><text x="30" y="48">Table travel · side view</text><text x="30" y="338">Crossfeed · top view</text><text x="30" y="628">Downfeed · side view</text></g>
<g fill="#eef4fa" stroke="#102b49" stroke-width="3"><circle cx="380" cy="125" r="55"/><rect x="180" y="185" width="400" height="32"/><rect x="140" y="217" width="480" height="25"/><rect x="180" y="375" width="400" height="155"/><rect x="350" y="390" width="60" height="125"/><circle cx="380" cy="715" r="55"/><rect x="180" y="805" width="400" height="32"/><rect x="140" y="837" width="480" height="25"/></g>
<g stroke="#102b49" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M210 273H550" marker-start="url(#arrow)"/><path d="M640 395v125" marker-start="url(#arrow)"/><path d="M470 680v105"/></g>
<g font-family="Arial, sans-serif" font-size="36" fill="#102b49"><text x="470" y="125">Wheel</text><text x="60" y="198">Work</text><text x="30" y="568">Across width, perpendicular to table travel</text><text x="510" y="725">Toward work</text></g>
</svg>
