<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" role="img"><title>TIMWOODS: eight wastes</title><rect width="720" height="335" fill="#fff"/><g font-family="Arial, sans-serif" font-size="18" fill="#142b49"><rect x="10" y="10" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="22" y="38">T — Transportation</text><text x="22" y="63" font-size="14">Materials move</text><rect x="360" y="10" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="372" y="38">I — Inventory</text><text x="372" y="63" font-size="14">Excess stock</text><rect x="10" y="90" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="22" y="118">M — Motion</text><text x="22" y="143" font-size="14">People move</text><rect x="360" y="90" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="372" y="118">W — Waiting</text><text x="372" y="143" font-size="14">Work cannot proceed</text><rect x="10" y="170" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="22" y="198">O — Overproduction</text><text x="22" y="223" font-size="14">Too much or too early</text><rect x="360" y="170" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="372" y="198">O — Over-processing</text><text x="372" y="223" font-size="14">More work than needed</text><rect x="10" y="250" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="22" y="278">D — Defects</text><text x="22" y="303" font-size="14">Fails the requirement</text><rect x="360" y="250" width="340" height="70" rx="6" fill="#edf3f8" stroke="#003b71"/><text x="372" y="278">S — Skills / unused talent</text><text x="372" y="303" font-size="14">Abilities left unused</text></g></svg>
