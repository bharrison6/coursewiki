<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Tolerance and illustrative process spreads</title>
  <desc id="d">Between limits 24.95 and 25.05 millimetres, a narrow spread from 24.98 to 25.02 is centred. A wide shifted spread from 24.97 to 25.08 crosses the upper limit.</desc>
  <rect width="800" height="450" fill="#fff"/>
  <rect x="200" y="100" width="350" height="240" fill="#e8edf2"/>
  <g stroke="#002144" stroke-width="2">
    <path d="M200 100V350 M550 100V350"/>
    <path d="M375 100V350" stroke-dasharray="7 5"/>
    <path d="M60 340H740"/>
    <rect x="305" y="160" width="140" height="35" fill="#b9deef"/>
    <rect x="270" y="265" width="385" height="35" fill="#f5dc9a"/>
  </g>
  <g font-family="sans-serif" font-size="32" fill="#002144">
    <g text-anchor="middle">
      <text x="400" y="40">Tolerance band</text>
      <text x="400" y="80">24.95–25.05 mm</text>
      <text x="200" y="385">24.95</text>
      <text x="375" y="385">25.00</text>
      <text x="550" y="385">25.05</text>
    </g>
    <!-- Halos separate row labels from the limit and centre lines. -->
    <g stroke="#fff" stroke-width="6" paint-order="stroke fill" stroke-linejoin="round">
      <text x="65" y="140">Narrow and centred</text>
      <text x="65" y="245">Wide and off-centre</text>
    </g>
    <text x="740" y="430" text-anchor="end">Increasing size (mm)</text>
  </g>
</svg>
