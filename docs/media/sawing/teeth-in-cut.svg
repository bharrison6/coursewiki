<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title">
  <title id="title">Thin and thick stock at the same tooth pitch</title>
  <rect width="800" height="600" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="32" fill="#14263d" stroke-linejoin="round">
    <text x="32" y="44" font-weight="bold">Same blade: 8 teeth per inch</text>
    <g transform="translate(40 10)">
<rect x="180" y="70" width="80" height="96" fill="#f4d778" stroke="#14263d" stroke-width="2" /><path d="M60 143V88L80 113H90L100 88L120 113H130L140 88L160 113H170L180 88L200 113H210L220 88L240 113H250L260 88L280 113H290L300 88L320 113H330L340 88L360 113H370L380 88L400 113H410L420 88L440 113H450L460 88L480 113H490L500 88L520 113H530L540 88L560 113H570L580 88L600 113H610L620 88V143Z" fill="#dbe5ef" fill-opacity="0.85" stroke="#14263d" stroke-width="2" />    </g>
    <text x="32" y="220">0.25 in contact</text>
    <text x="32" y="262">0.25 × 8 = about 2 teeth</text>
    <g transform="translate(40 70)">
<rect x="180" y="230" width="240" height="96" fill="#f4d778" stroke="#14263d" stroke-width="2" /><path d="M60 303V248L80 273H90L100 248L120 273H130L140 248L160 273H170L180 248L200 273H210L220 248L240 273H250L260 248L280 273H290L300 248L320 273H330L340 248L360 273H370L380 248L400 273H410L420 248L440 273H450L460 248L480 273H490L500 248L520 273H530L540 248L560 273H570L580 248L600 273H610L620 248V303Z" fill="#dbe5ef" fill-opacity="0.85" stroke="#14263d" stroke-width="2" />    </g>
    <text x="32" y="440">0.75 in contact</text>
    <text x="32" y="482">0.75 × 8 = about 6 teeth</text>
    <text x="32" y="544">Gold = continuous material crossed</text>
    <text x="32" y="586">along the tooth line.</text>
  </g>
</svg>
