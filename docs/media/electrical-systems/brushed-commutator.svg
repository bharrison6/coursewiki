<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-label="Fixed brushes exchange contact with rotating segments, reversing current in the coil">
<title>Fixed brushes exchange contact with rotating segments, reversing current in the coil</title><rect width="800" height="370" fill="#fff"/>
<style>text{font:18px sans-serif;fill:#142638}.small{font-size:16px}.line{stroke:#142638;stroke-width:2;fill:none}.stator{fill:#e6eef5;stroke:#142638;stroke-width:3}.rotor{fill:#ffe5a0;stroke:#142638;stroke-width:3}</style>
<text x="25" y="28">A two-segment commutator reverses coil current each half turn</text><path d="M172 151V80H228V151" fill="none" stroke="#845600" stroke-width="6"/><text x="200" y="64" text-anchor="middle">Rotating coil</text><path d="M192 150A45 45 0 0 0 192 238Z" fill="#c87932" stroke="#142638"/><path d="M208 150A45 45 0 0 1 208 238Z" fill="#ffd099" stroke="#142638"/><rect x="115" y="180" width="45" height="28" fill="#394653"/><rect x="240" y="180" width="45" height="28" fill="#394653"/><text x="90" y="200">+</text><text x="295" y="200">−</text><text x="171" y="202">A</text><text x="216" y="202">B</text><text x="200" y="274" text-anchor="middle">Before: + feeds A</text><path d="M572 151V80H628V151" fill="none" stroke="#845600" stroke-width="6"/><text x="600" y="64" text-anchor="middle">Rotating coil</text><path d="M592 150A45 45 0 0 0 592 238Z" fill="#ffd099" stroke="#142638"/><path d="M608 150A45 45 0 0 1 608 238Z" fill="#c87932" stroke="#142638"/><rect x="515" y="180" width="45" height="28" fill="#394653"/><rect x="640" y="180" width="45" height="28" fill="#394653"/><text x="490" y="200">+</text><text x="695" y="200">−</text><text x="571" y="202">B</text><text x="616" y="202">A</text><text x="600" y="274" text-anchor="middle">After 180°: + feeds B</text><text x="375" y="195">→</text><text x="400" y="320" text-anchor="middle">Dark blocks: fixed carbon brushes, pressed inward by springs (not shown).</text><text x="400" y="346" text-anchor="middle">A and B stay connected to the same coil ends while the assembly rotates.</text></svg>