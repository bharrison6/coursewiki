<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" role="img" aria-labelledby="title"><title id="title">Clean, coat, and retain a thin layer of solder</title><rect width="360" height="840" fill="white"/><style>text{font:18px sans-serif;fill:#172b4d} .head{font-weight:bold;font-size:22px} .wire{fill:none;stroke:#9a5119;stroke-width:9;stroke-linecap:round} .lead{fill:#ccc;stroke:#172b4d;stroke-width:2} .solder{fill:#b8d9ea;stroke:#172b4d;stroke-width:2} .pad{fill:#b87333;stroke:#172b4d} .board{fill:#e2eddf;stroke:#172b4d}</style><g transform="translate(0 0)"><text x="20" y="30" class="head">1. Clean briefly</text><path d="M80 195H280V220H80Z" fill="#ecac00" stroke="#172b4d"/><path d="M130 65H170L220 190L190 205Z" class="lead"/><text x="20" y="250">Damp sponge or brass wool.</text></g><g transform="translate(0 280)"><text x="20" y="30" class="head">2. Apply fresh solder</text><path d="M130 65H170L220 190L190 205Z" class="lead"/><path d="M189 178L220 190L190 205L179 178Z" class="solder"/><path d="M300 90L210 180" fill="none" stroke="#526b83" stroke-width="7"/><text x="20" y="250">Coat the hot working face.</text></g><g transform="translate(0 560)"><text x="20" y="30" class="head">3. Leave a thin coating</text><path d="M130 65H170L220 190L190 205Z" class="lead"/><path d="M189 178L220 190L190 205L179 178Z" class="solder"/><text x="20" y="245">Remove excess on the cleaner.</text><text x="20" y="270">Do not leave the hot face bare.</text></g></svg>