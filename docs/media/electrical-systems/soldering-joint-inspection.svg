<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" role="img" aria-labelledby="title"><title id="title">Joint inspection: schematic cross-sections</title><rect width="360" height="840" fill="white"/><style>text{font:18px sans-serif;fill:#172b4d} .head{font-weight:bold;font-size:22px} .wire{fill:none;stroke:#9a5119;stroke-width:9;stroke-linecap:round} .lead{fill:#ccc;stroke:#172b4d;stroke-width:2} .solder{fill:#b8d9ea;stroke:#172b4d;stroke-width:2} .pad{fill:#b87333;stroke:#172b4d} .board{fill:#e2eddf;stroke:#172b4d}</style><g transform="translate(0 0)"><text x="20" y="30" class="head">Good: wetted</text><path d="M40 190H320V215H40Z" class="board"/><path d="M85 180H275V190H85Z" class="pad"/><path d="M175 65H190V215H175Z" class="lead"/><path d="M95 180Q170 174 175 110V180Z M190 110Q200 174 265 180H190Z" class="solder"/><text x="20" y="245">Solder slopes from pad to lead.</text></g><g transform="translate(0 280)"><text x="20" y="30" class="head">Cold / poorly wetted</text><path d="M40 190H320V215H40Z" class="board"/><path d="M85 180H275V190H85Z" class="pad"/><path d="M175 65H190V215H175Z" class="lead"/><ellipse cx="130" cy="155" rx="37" ry="24" class="solder"/><text x="20" y="245">Bead fails to wet the lead.</text></g><g transform="translate(0 560)"><text x="20" y="30" class="head">Bridge: unwanted path</text><path d="M40 190H320V215H40Z" class="board"/><path d="M65 180H150V190H65Z M210 180H295V190H210Z" class="pad"/><path d="M105 65H120V215H105Z M240 65H255V215H240Z" class="lead"/><path d="M75 180Q100 165 105 130V160Q180 140 240 160V130Q270 170 285 180Z" class="solder"/><text x="20" y="245">Solder joins separate pads.</text></g></svg>