<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-label="Pumped hydro: electricity lifts water; falling water returns electricity">
<title>Pumped hydro: electricity lifts water; falling water returns electricity</title><rect width="800" height="455" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#18324b"/></marker></defs>
<style>text{font:20px sans-serif;fill:#18324b} .box{fill:#edf4f8;stroke:#18324b;stroke-width:2} .flow{fill:none;stroke:#18324b;stroke-width:3;marker-end:url(#arrow)} .wire{fill:none;stroke:#18324b;stroke-width:3}</style>

<rect class="box" x="260" y="35" width="280" height="70"/><text x="310" y="77">Upper reservoir</text>
<rect class="box" x="260" y="310" width="280" height="70"/><text x="310" y="352">Lower reservoir</text>
<path class="flow" d="M260 345 H160 V70 H250"/>
<path class="flow" d="M540 70 H640 V345 H550"/>
<rect class="box" x="70" y="170" width="185" height="85"/><text x="90" y="202">Pump + motor</text><text x="90" y="232">Electricity IN</text>
<rect class="box" x="540" y="170" width="245" height="85"/><text x="558" y="202">Turbine + generator</text><text x="558" y="232">Electricity OUT</text>
<text x="280" y="178">Charge: lift water</text><text x="280" y="213">Discharge: lower water</text>
<text x="155" y="425">Losses mean electrical energy out is less than energy in.</text>
</svg>