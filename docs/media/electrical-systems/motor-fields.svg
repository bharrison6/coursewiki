<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-label="The rotor follows a field that keeps advancing; simplified inner-rotor cross-sections">
<title>The rotor follows a field that keeps advancing; simplified inner-rotor cross-sections</title><rect width="800" height="370" fill="#fff"/>
<style>text{font:18px sans-serif;fill:#142638}.small{font-size:16px}.line{stroke:#142638;stroke-width:2;fill:none}.stator{fill:#e6eef5;stroke:#142638;stroke-width:3}.rotor{fill:#ffe5a0;stroke:#142638;stroke-width:3}</style>
<text x="25" y="28">Stator: fixed body. Rotor: rotating body. Arrows show magnetic-field directions.</text><circle class="stator" cx="205" cy="170" r="110"/><circle fill="white" stroke="#142638" cx="205" cy="170" r="80"/><circle class="rotor" cx="205" cy="170" r="65"/><g transform="translate(205 170) rotate(-90)"><path d="M-58 0H46" stroke="#845600" stroke-width="8"/><path d="M58 0l-20 -10v20Z" fill="#845600"/></g><g transform="translate(205 170) rotate(-45)"><path d="M-100 0H88" stroke="#005b82" stroke-width="4"/><path d="M100 0l-20 -10v20Z" fill="#005b82"/></g><circle cx="205" cy="170" r="9" fill="#142638"/><text x="205" y="310" text-anchor="middle">1. Rotor field follows</text><circle class="stator" cx="595" cy="170" r="110"/><circle fill="white" stroke="#142638" cx="595" cy="170" r="80"/><circle class="rotor" cx="595" cy="170" r="65"/><g transform="translate(595 170) rotate(-45)"><path d="M-58 0H46" stroke="#845600" stroke-width="8"/><path d="M58 0l-20 -10v20Z" fill="#845600"/></g><g transform="translate(595 170) rotate(0)"><path d="M-100 0H88" stroke="#005b82" stroke-width="4"/><path d="M100 0l-20 -10v20Z" fill="#005b82"/></g><circle cx="595" cy="170" r="9" fill="#142638"/><text x="595" y="310" text-anchor="middle">2. Target field advances</text><text x="25" y="53" class="small">Blue thin arrow: stator field</text><text x="430" y="53" class="small">Brown thick arrow: rotor field</text><text x="362" y="178">→</text><text x="400" y="350" text-anchor="middle" class="small">Both fields advance clockwise. The rotor follows. White gap: air gap.</text></svg>