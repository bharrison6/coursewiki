<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Inner and outer rotor permanent-magnet motor layouts">
<title>Inner and outer rotor permanent-magnet motor layouts</title><rect width="800" height="340" fill="#fff"/>
<style>text{font:18px sans-serif;fill:#142638}.small{font-size:16px}.line{stroke:#142638;stroke-width:2;fill:none}.stator{fill:#e6eef5;stroke:#142638;stroke-width:3}.rotor{fill:#ffe5a0;stroke:#142638;stroke-width:3}</style>
<text x="200" y="30" text-anchor="middle">Inner rotor / inrunner</text><circle class="stator" cx="200" cy="155" r="105"/><circle cx="200" cy="155" r="79" fill="white" stroke="#142638"/><circle class="rotor" cx="200" cy="155" r="65"/><text x="200" y="151" text-anchor="middle" class="small">Rotor</text><text x="200" y="175" text-anchor="middle" class="small">magnets</text><text x="200" y="282" text-anchor="middle">Outside: fixed windings</text><text x="600" y="30" text-anchor="middle">Outer rotor / outrunner</text><circle class="rotor" cx="600" cy="155" r="105"/><circle cx="600" cy="155" r="79" fill="white" stroke="#142638"/><circle class="stator" cx="600" cy="155" r="65"/><text x="600" y="151" text-anchor="middle" class="small">Stator</text><text x="600" y="175" text-anchor="middle" class="small">windings</text><text x="600" y="282" text-anchor="middle">Outside: rotating magnets</text><text x="400" y="322" text-anchor="middle">Blue: stationary stator. Gold: rotating rotor. White gap separates them.</text></svg>