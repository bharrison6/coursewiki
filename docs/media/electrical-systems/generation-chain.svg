<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" role="img" aria-label="Steam generation: heat to motion to electricity">
<title>Steam generation: heat to motion to electricity</title><rect width="800" height="255" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#18324b"/></marker></defs>
<style>text{font:20px sans-serif;fill:#18324b} .box{fill:#edf4f8;stroke:#18324b;stroke-width:2} .flow{fill:none;stroke:#18324b;stroke-width:3;marker-end:url(#arrow)} .wire{fill:none;stroke:#18324b;stroke-width:3}</style>

<text x="30" y="35">Steam route: heat → fluid motion → shaft work → electricity</text>
<rect class="box" x="25" y="70" width="140" height="70"/><text x="45" y="100">Heat source</text><text x="45" y="126">+ boiler</text>
<path class="flow" d="M165 105 H220"/><text x="170" y="65">Steam</text>
<rect class="box" x="230" y="70" width="130" height="70"/><text x="255" y="112">Turbine</text>
<path class="flow" d="M360 105 H425"/><text x="366" y="65">Shaft</text>
<rect class="box" x="435" y="70" width="145" height="70"/><text x="450" y="112">Generator</text>
<path class="flow" d="M580 105 H640"/>
<rect class="box" x="650" y="70" width="125" height="70"/><text x="663" y="112">Electricity</text>
<text x="30" y="190">Water, wind or combustion gases can drive a turbine directly.</text>
<text x="30" y="225">PV takes a different route: light → photovoltaic cell → DC electricity.</text>
</svg>