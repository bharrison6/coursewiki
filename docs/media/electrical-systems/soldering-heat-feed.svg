<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" role="img" aria-labelledby="title"><title id="title">Heat pad and lead, feed solder, then withdraw and cool</title><rect width="360" height="840" fill="white"/><style>text{font:18px sans-serif;fill:#172b4d} .head{font-weight:bold;font-size:22px} .wire{fill:none;stroke:#9a5119;stroke-width:9;stroke-linecap:round} .lead{fill:#ccc;stroke:#172b4d;stroke-width:2} .solder{fill:#b8d9ea;stroke:#172b4d;stroke-width:2} .pad{fill:#b87333;stroke:#172b4d} .board{fill:#e2eddf;stroke:#172b4d}</style><g transform="translate(0 0)"><text x="20" y="30" class="head">1. Heat both parts</text><path d="M40 190H320V215H40Z" class="board"/><path d="M85 180H275V190H85Z" class="pad"/><path d="M175 65H190V215H175Z" class="lead"/><path d="M55 90L80 70L175 165V180H153Z" class="lead"/><text x="20" y="245">Iron face touches pad and lead.</text></g><g transform="translate(0 280)"><text x="20" y="30" class="head">2. Feed into the joint</text><path d="M40 190H320V215H40Z" class="board"/><path d="M85 180H275V190H85Z" class="pad"/><path d="M175 65H190V215H175Z" class="lead"/><path d="M55 90L80 70L175 165V180H153Z" class="lead"/><path d="M300 80L210 167" fill="none" stroke="#526b83" stroke-width="7"/><path d="M190 140Q200 173 250 180H190Z" class="solder"/><text x="240" y="62">Solder</text><text x="20" y="245">Keep heating as solder wets both.</text></g><g transform="translate(0 560)"><text x="20" y="30" class="head">3. Withdraw and cool</text><path d="M40 190H320V215H40Z" class="board"/><path d="M85 180H275V190H85Z" class="pad"/><path d="M175 65H190V215H175Z" class="lead"/><path d="M95 180Q170 174 175 110V180Z M190 110Q200 174 265 180H190Z" class="solder"/><text x="20" y="245">Solder away, then iron. Hold still.</text></g></svg>