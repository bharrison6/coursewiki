<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1390" role="img" aria-labelledby="title desc">
<title id="title">Locate, grip and drive with five lathe workholding mechanisms</title>
<desc id="desc">Five large teaching panels compare a three-jaw scroll chuck, four-jaw independent chuck, representative taper collet, work between ordinary centers driven by a dog and drive plate, and direct faceplate clamping. Blue marks location, orange grip, green drive and purple support.</desc>
<defs>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#167b45"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45014"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b9c"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#aeb8bf" stroke-width="4"/></pattern>
  <style>
    .panel{fill:#f7f7f5;stroke:#26343c;stroke-width:3}.device{fill:#d7dde1;stroke:#26343c;stroke-width:4}.part{fill:#e7ecef;stroke:#26343c;stroke-width:4}.cut{fill:url(#hatch);stroke:#26343c;stroke-width:4}.axis{stroke:#7d8a91;stroke-width:3;stroke-dasharray:14 10}.thin{fill:none;stroke:#26343c;stroke-width:4}.locate{fill:#126b9c}.grip{fill:#c45014}.drive{fill:#167b45}.support{fill:#68469d}.role{font:700 30px Arial,sans-serif}.label{font:700 34px Arial,sans-serif;fill:#172126}.note{font:26px Arial,sans-serif;fill:#26343c}.small{font:23px Arial,sans-serif;fill:#26343c}.white{fill:#fff}.screw{stroke:#26343c;stroke-width:8}.jaw{fill:#cdd5da;stroke:#26343c;stroke-width:4}.force-orange{fill:none;stroke:#c45014;stroke-width:5;marker-end:url(#arrow-orange)}.force-green{fill:none;stroke:#167b45;stroke-width:5;marker-end:url(#arrow-green)}.force-blue{fill:none;stroke:#126b9c;stroke-width:5;marker-end:url(#arrow-blue)}
  </style>
</defs>
<rect width="900" height="1390" fill="#fff"/>
<text class="label" x="40" y="55">What each device does</text>
<g transform="translate(40 78)"><rect class="locate" width="42" height="32" rx="7"/><text class="role" x="55" y="28">Locate</text><rect class="grip" x="205" width="42" height="32" rx="7"/><text class="role" x="260" y="28">Grip</text><rect class="drive" x="390" width="42" height="32" rx="7"/><text class="role" x="445" y="28">Drive</text><rect class="support" x="585" width="42" height="32" rx="7"/><text class="role" x="640" y="28">Support</text></g>

<g id="three-jaw-scroll" transform="translate(35 135)">
 <title>Three-jaw scroll chuck</title><rect class="panel" width="830" height="235" rx="18"/><text class="label" x="25" y="43">Three-jaw scroll chuck</text>
 <g transform="translate(165 130)"><circle class="device" r="77"/><circle class="thin" r="54" stroke-dasharray="8 7"/><circle class="part" r="25"/>
  <g class="jaw"><path d="M-18-72H18L13-28H-13Z"/><path d="M-18-72H18L13-28H-13Z" transform="rotate(120)"/><path d="M-18-72H18L13-28H-13Z" transform="rotate(240)"/></g>
  <path class="force-green" d="M-103 45A113 113 0 0 1-104-43"/><path class="force-orange" d="M0-60V-30"/><path class="force-orange" d="M52 30L27 16"/><path class="force-orange" d="M-52 30L-27 16"/>
 </g>
 <text class="note" x="300" y="92">One internal scroll links all three jaws.</text><text class="note" x="300" y="130">Fast approximate centering is not zero runout.</text>
 <g transform="translate(300 155)"><rect class="locate" width="30" height="25" rx="5"/><text class="small" x="42" y="22">jaws approximately locate</text><rect class="grip" x="360" width="30" height="25" rx="5"/><text class="small" x="402" y="22">jaws grip</text><rect class="drive" y="39" width="30" height="25" rx="5"/><text class="small" x="42" y="61">chuck body drives</text></g>
</g>

<g id="four-jaw-independent" transform="translate(35 385)">
 <title>Four-jaw independent chuck</title><rect class="panel" width="830" height="235" rx="18"/><text class="label" x="25" y="43">Four-jaw independent chuck</text>
 <g transform="translate(165 132)"><circle class="device" r="78"/><rect class="part" x="-23" y="-31" width="50" height="50" transform="rotate(8)"/>
  <g><path class="jaw" d="M-18-73H18L14-34H-14Z"/><path class="screw" d="M0-100V-72"/><path class="jaw" d="M-18-73H18L14-34H-14Z" transform="rotate(90)"/><path class="screw" d="M0-100V-72" transform="rotate(90)"/><path class="jaw" d="M-18-73H18L14-34H-14Z" transform="rotate(180)"/><path class="screw" d="M0-100V-72" transform="rotate(180)"/><path class="jaw" d="M-18-73H18L14-34H-14Z" transform="rotate(270)"/><path class="screw" d="M0-100V-72" transform="rotate(270)"/></g>
  <path class="force-green" d="M-103 45A113 113 0 0 1-104-43"/><path class="force-orange" d="M0-58V-32"/><path class="force-orange" d="M58 0H32"/>
 </g>
 <text class="note" x="300" y="92">Each jaw has its own screw and adjustment.</text><text class="note" x="300" y="130">Indicate a surface true; hold irregular work.</text>
 <g transform="translate(300 155)"><rect class="locate" width="30" height="25" rx="5"/><text class="small" x="42" y="22">independent jaws locate</text><rect class="grip" x="360" width="30" height="25" rx="5"/><text class="small" x="402" y="22">jaws grip</text><rect class="drive" y="39" width="30" height="25" rx="5"/><text class="small" x="42" y="61">chuck body drives</text></g>
</g>

<g id="representative-collet" transform="translate(35 635)">
 <title>Representative taper collet</title><rect class="panel" width="830" height="235" rx="18"/><text class="label" x="25" y="43">Representative taper collet</text>
 <g transform="translate(42 75)"><path class="cut" d="M0 0H215L255 27V113L215 140H0Z"/><path class="part" d="M-8 52H275V88H-8Z"/><path class="device" d="M105 28L220 42V98L105 112Z"/><path class="thin" d="M125 40V100M151 43V97M177 46V94M203 49V91"/>
  <path class="force-orange" d="M270 25H225"/><path class="force-orange" d="M190 35L190 50"/><path class="force-orange" d="M190 105L190 90"/>
 </g>
 <text class="note" x="350" y="92">Split sleeve closes into the taper.</text><text class="note" x="350" y="130">One representative collet construction.</text>
 <g transform="translate(350 155)"><rect class="locate" width="30" height="25" rx="5"/><text class="small" x="42" y="22">taper locates</text><rect class="grip" x="185" width="30" height="25" rx="5"/><text class="small" x="227" y="22">split sleeve grips</text><rect class="drive" y="39" width="30" height="25" rx="5"/><text class="small" x="42" y="61">holder and collet drive</text></g>
</g>

<g id="centers-dog-drive-plate" transform="translate(35 885)">
 <title>Work between ordinary centers with a drive dog and dedicated drive plate</title><rect class="panel" width="830" height="235" rx="18"/><text class="label" x="25" y="43">Centers + dog + dedicated drive plate</text>
 <g transform="translate(25 77)"><circle class="device" cx="45" cy="70" r="52"/><circle class="thin" cx="45" cy="70" r="8"/><path class="support" d="M82 70L122 45V95Z"/><rect class="part" x="120" y="53" width="285" height="34" rx="12"/><path class="support" d="M445 70L405 45V95Z"/>
  <path class="grip" d="M137 38H184L202 52H137Z"/><path class="grip" d="M173 38L120 14L109 26L149 55Z"/><circle class="drive" cx="95" cy="22" r="10"/><path class="force-green" d="M51 7A68 68 0 0 1 4 36"/><path class="force-green" d="M95 22L128 31"/>
 </g>
 <text class="note" x="500" y="90">Centers locate and support.</text><text class="note" x="500" y="126">Dog + plate transmit torque.</text>
 <g transform="translate(500 152)"><rect class="support" width="30" height="25" rx="5"/><text class="small" x="42" y="22">support</text><rect class="locate" x="150" width="30" height="25" rx="5"/><text class="small" x="192" y="22">locate</text><rect class="grip" y="39" width="30" height="25" rx="5"/><text class="small" x="42" y="61">dog grips</text><rect class="drive" x="150" y="39" width="30" height="25" rx="5"/><text class="small" x="192" y="61">drive</text></g>
</g>

<g id="faceplate" transform="translate(35 1135)">
 <title>Direct faceplate clamping</title><rect class="panel" width="830" height="220" rx="18"/><text class="label" x="25" y="43">Faceplate: clamp work directly to the plate</text>
 <g transform="translate(160 126)"><circle class="device" r="78"/><path class="thin" d="M-58-44L58 44M-58 44L58-44"/><rect class="part" x="-38" y="-23" width="86" height="55" transform="rotate(-10)"/><path class="grip" d="M-72-21H-18V-5H-72ZM19 19H73V35H19Z"/><path class="force-orange" d="M-45-44V-18"/><path class="force-orange" d="M47 53V29"/><path class="force-green" d="M-104 45A113 113 0 0 1-104-43"/></g>
 <text class="note" x="300" y="88">Fixtures locate; clamps grip irregular work.</text><text class="note" x="300" y="125">Spindle drives plate and clamped work.</text>
 <g transform="translate(300 150)"><rect class="locate" width="30" height="25" rx="5"/><text class="small" x="42" y="22">fixture locates</text><rect class="grip" x="280" width="30" height="25" rx="5"/><text class="small" x="322" y="22">clamps grip</text><rect class="drive" y="39" width="30" height="25" rx="5"/><text class="small" x="42" y="61">faceplate drives</text></g>
</g>
</svg>
