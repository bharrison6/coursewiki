<style>text{font:32px sans-serif;fill:#142b46}  .line{fill:none;stroke:#142b46;stroke-width:2} .axis{stroke:#52697d;stroke-width:2;stroke-dasharray:8 5} .shape{fill:#e9f1f7;stroke:#142b46;stroke-width:2} .accent{fill:none;stroke:#ad4300;stroke-width:3}</style>

