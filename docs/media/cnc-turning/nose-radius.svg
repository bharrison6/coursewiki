<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
<title id="title">Imaginary tip versus rounded nose on a taper</title><desc id="desc">The left and bottom tangents to a circular tool nose meet at an imaginary tip. A desired taper through that tip is parallel to, but separated from, the actual tangent cut by the nose. The gap illustrates uncompensated profile error.</desc>
<rect width="800" height="650" fill="#fff"/><g font-family="Arial,sans-serif" font-size="32" fill="#142d4e">
<text x="25" y="42">Uncompensated nose · enlarged</text>
<circle cx="410" cy="220" r="80" fill="#e5edf3" stroke="#142d4e" stroke-width="4"/>
<path d="M330 115V340 M290 300H530" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
<path d="M190 160L530 500" stroke="#a63800" stroke-width="5" fill="none"/>
<path d="M190 113.14L530 453.14" stroke="#006493" stroke-width="5" fill="none"/>
<circle cx="330" cy="300" r="7" fill="#a63800"/>
<path d="M410 220L353.43 276.57" stroke="#142d4e" stroke-width="3"/><text x="430" y="218">r</text>
<path d="M335 310L145 355" stroke="#a63800" stroke-width="2" fill="none"/><text x="25" y="395">Imaginary tip</text>
<path d="M470 440L493.43 416.57" stroke="#142d4e" stroke-width="3"/><text x="535" y="390">Profile</text><text x="535" y="430">error</text>
<text x="525" y="160">Rounded</text><text x="525" y="200">nose</text>
<path d="M30 545H95" stroke="#a63800" stroke-width="5"/><text x="115" y="555">Desired taper through tip</text>
<path d="M30 595H95" stroke="#006493" stroke-width="5"/><text x="115" y="605">Actual tangent cut</text>
</g></svg>
