<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">End mill catalog dimensions and end profiles</title>
<desc id="desc">A reduced-neck end mill is mounted in a holder. Brackets distinguish overall length, length below shank, length of cut and holder-face projection. The cutting, neck, shank and holder regions are labeled. Separate silhouettes compare square, corner-radius and ball ends.</desc>
<defs><clipPath id="cutting-region"><rect x="580" y="136" width="100" height="78"/></clipPath></defs>
<rect width="800" height="620" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144">
<text x="25" y="34" font-size="27" font-weight="bold">CATALOG DIMENSIONS AND MOUNTING</text>
<rect x="180" y="136" width="150" height="78" fill="#cdd8e2" stroke="#002144" stroke-width="3"/>
<rect x="330" y="144" width="250" height="62" fill="#dcecf3" stroke="#002144" stroke-width="3"/>
<rect x="580" y="136" width="100" height="78" fill="#bfd3df" stroke="#002144" stroke-width="3"/>
<g clip-path="url(#cutting-region)"><path d="M570 208q35-76 70-70M600 212q36-76 72-72M632 212q28-58 48-65" fill="none" stroke="#6d93a9" stroke-width="14"/>
<path d="M570 202q35-70 70-64M600 206q36-70 72-66M632 206q28-54 48-59" fill="none" stroke="#002144" stroke-width="3"/></g>
<path d="M35 108H280L305 124V226L280 242H35Z" fill="#647987" stroke="#002144" stroke-width="3"/>
<text x="55" y="150" font-size="22" fill="#fff">Holder</text><text x="55" y="178" font-size="18" fill="#fff">face → tip is projection</text>
<path d="M305 96v164" stroke="#ff4500" stroke-width="3"/><text x="297" y="282" text-anchor="end" font-size="19">holder face</text>
<text x="220" y="126" font-size="20">Plain shank</text><text x="410" y="132" font-size="20">Reduced neck</text><text x="595" y="126" font-size="20">Cutting flutes</text>
<path d="M180 296H680M180 288v16M680 288v16" stroke="#002144" stroke-width="2"/><text x="430" y="322" text-anchor="middle" font-size="20">OAL — overall length</text>
<path d="M330 340H680M330 332v16M680 332v16" stroke="#002144" stroke-width="2"/><text x="505" y="366" text-anchor="middle" font-size="20">LBS — length below shank</text>
<path d="M580 384H680M580 376v16M680 376v16" stroke="#002144" stroke-width="2"/><text x="630" y="410" text-anchor="middle" font-size="20">LOC</text>
<path d="M305 78H680M305 70v16M680 70v16" stroke="#ff4500" stroke-width="2"/><text x="492" y="65" text-anchor="middle" font-size="19">Holder-face projection</text>
<text x="25" y="440" font-size="18">LBS includes LOC plus any relieved neck.</text><text x="25" y="464" font-size="18">Projection is a mounting dimension, not a catalog tool length.</text>
<text x="25" y="490" font-size="27" font-weight="bold">END PROFILES (SIDE SILHOUETTES)</text>
<g transform="translate(0 70)"><path d="M112 421v85h100v-85M352 421v65q0 20 20 20h60q20 0 20-20v-65M592 421v35a50 50 0 0 0 100 0v-35" fill="#cdd8e2" stroke="#002144" stroke-width="3"/>
<text x="121" y="547" font-size="22">Square</text><text x="321" y="547" font-size="22">Corner radius</text><text x="609" y="547" font-size="22">Ball</text></g>
</g></svg>
