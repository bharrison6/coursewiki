<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
<title id="title">Strap-clamp force share</title><desc id="desc">Side view with part contact at left, stud near the part and step-block heel at right. An ideal free-body diagram shows downward stud force P and upward part and heel reactions. Part force equals P b divided by a plus b.</desc>
<rect width="800" height="570" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="24" fill="#002144" stroke-linejoin="round">
<text x="28" y="36" font-weight="bold">SIDE VIEW: STUD NEAR THE PART</text>
<rect x="60" y="158" width="150" height="105" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><text x="89" y="233">Part</text>
<path d="M620 155h30v25h30v25h30v58H600v-83h20Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/>
<path d="M140 130H640V155H140Z" fill="#ECAC00" stroke="#002144" stroke-width="3"/>
<path d="M280 95V263" stroke="#002144" stroke-width="10"/><rect x="259" y="112" width="42" height="18" fill="#002144"/>
<path d="M35 267H755" stroke="#002144" stroke-width="6"/>
<text x="307" y="109">Stud + nut</text><text x="568" y="303">Step block</text>
<text x="28" y="347" font-weight="bold">FORCES ON THE STRAP (IDEALIZED)</text>
<path d="M140 437H640" stroke="#002144" stroke-width="5"/>
<path d="M280 360V430m-9-15 9 15 9-15M140 493V444m-9 15 9-15 9 15M640 493V444m-9 15 9-15 9 15" fill="none" stroke="#002144" stroke-width="4"/>
<text x="300" y="385">P ↓</text><text x="42" y="520">Part reaction ↑</text><text x="572" y="520">Heel ↑</text>
<path d="M140 408H280M140 401v14M280 401v14M294 408H640M640 401v14" stroke="#607080" stroke-width="2"/>
<text x="202" y="395">a</text><text x="457" y="395">b</text>
<text x="230" y="558" font-weight="bold">Part force = P × b / (a + b)</text>
</g></svg>
