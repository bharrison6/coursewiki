<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">ER collet assembly order</title><desc id="desc">Four panels. Match and clean the parts. Engage the collet groove in the nut retaining ring and snap it into place. Thread the captured nut and collet loosely onto the holder. Insert the tool shank and tighten to the manufacturer's torque.</desc>
<rect width="800" height="620" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="23" fill="#002144" stroke-linejoin="round">
<path d="M400 20V600M20 310H780" stroke="#ccd5dd" stroke-width="2"/>
<text x="25" y="44" font-weight="bold">1  Match and clean</text>
<path d="M75 120h110l-20 95H95Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><path d="M95 113h70M100 125l9 73M126 125v78M154 125l-9 73" stroke="#002144" stroke-width="3"/>
<ellipse cx="280" cy="170" rx="62" ry="42" fill="#ECAC00" stroke="#002144" stroke-width="3"/><ellipse cx="280" cy="167" rx="40" ry="26" fill="#fff" stroke="#002144" stroke-width="3"/>
<text x="83" y="252">Collet</text><text x="255" y="252">Nut</text>
<text x="28" y="286">Series + stated shank range</text>
<text x="425" y="44" font-weight="bold">2  Capture the collet</text>
<ellipse cx="610" cy="200" rx="66" ry="34" fill="#ECAC00" stroke="#002144" stroke-width="3"/><ellipse cx="603" cy="194" rx="41" ry="21" fill="#fff" stroke="#002144" stroke-width="4"/>
<g transform="rotate(-18 600 170)"><path d="M550 100h100l-18 82h-64Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><path d="M550 112h100" stroke="#002144" stroke-width="5"/></g>
<path d="M710 122q28 38-8 69m0-14v14h14" fill="none" stroke="#002144" stroke-width="3"/>
<text x="439" y="252">Groove → eccentric ring</text><text x="442" y="286">Tilt, then snap into the nut</text>
<text x="25" y="348" font-weight="bold">3  Thread on loosely</text>
<path d="M100 390h180v65H100Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><path d="M127 455l20 42h86l20-42" fill="#cdd8e2" stroke="#002144" stroke-width="3"/>
<rect x="127" y="481" width="126" height="28" fill="#ECAC00" stroke="#002144" stroke-width="3"/>
<path d="M308 438q30 40 0 67m0-15v15h15" fill="none" stroke="#002144" stroke-width="3"/>
<text x="55" y="548">Nut + collet onto holder</text><text x="60" y="584">Keep the bore open</text>
<text x="425" y="348" font-weight="bold">4  Insert shank, then torque</text>
<path d="M530 390h150v65H530Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><rect x="549" y="456" width="112" height="27" fill="#ECAC00" stroke="#002144" stroke-width="3"/>
<rect x="593" y="442" width="24" height="79" fill="#cdd8e2" stroke="#002144" stroke-width="3"/><path d="M593 521v22h24v-22m-21 0 18 22m-18-9 8 10" fill="none" stroke="#002144" stroke-width="3"/>
<text x="430" y="577">Required grip + planned reach</text><text x="473" y="605">Maker's torque and tools</text>
</g></svg>
