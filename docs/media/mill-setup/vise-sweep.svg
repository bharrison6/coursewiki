<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Interpreting a fixed-jaw sweep</title><desc id="desc">Top view. The left end is the pivot. The right end reads plus 0.06 millimeter, with positive readings defined as the jaw moving toward the indicator. Tap the right end away from the indicator. Tilt is exaggerated.</desc>
<rect width="800" height="460" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="23" fill="#002144">
<text x="28" y="38" font-weight="bold">FIXED JAW • TOP VIEW • TILT EXAGGERATED</text>
<path d="M115 135H680" stroke="#607080" stroke-width="2" stroke-dasharray="8 6"/><text x="310" y="108">Target: parallel to X travel</text>
<path d="M115 135L680 170V220L115 185Z" fill="#cdd8e2" stroke="#002144" stroke-width="3"/>
<circle cx="145" cy="154" r="8" fill="#002144"/><text x="30" y="86">Left pivot</text><path d="M115 92L143 143" stroke="#002144" stroke-width="2"/>
<path d="M680 158V99m-8 13 8-13 8 13" fill="none" stroke="#002144" stroke-width="4"/>
<text x="565" y="66" fill="#002144">Tap right end away</text>
<path d="M154 242H644m-12-8 12 8-12 8" fill="none" stroke="#002144" stroke-width="3"/>
<text x="210" y="280">Contact-point sweep: left → right</text>
<circle cx="145" cy="330" r="30" fill="#fff" stroke="#002144" stroke-width="3"/><path d="M145 300V189" stroke="#002144" stroke-width="3"/><circle cx="145" cy="188" r="5" fill="#002144"/><path d="M145 330l-15-16" stroke="#002144" stroke-width="3"/>
<circle cx="675" cy="330" r="30" fill="#fff" stroke="#002144" stroke-width="3"/><path d="M675 300V221" stroke="#002144" stroke-width="3"/><circle cx="675" cy="220" r="5" fill="#002144"/><path d="M675 330l16-17" stroke="#002144" stroke-width="3"/>
<text x="91" y="388">0.00 mm</text><text x="605" y="388">+0.06 mm</text>
<text x="263" y="330">Indicator on this side</text><text x="254" y="361">Two positions shown</text>
<text x="28" y="433" font-weight="bold">Defined response: jaw toward indicator → higher reading</text>
</g></svg>
