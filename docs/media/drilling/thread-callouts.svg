<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" role="img" aria-labelledby="title">
<title id="title">Reading Unified inch and metric thread callouts</title>
<rect width="800" height="850" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#10253f;font-size:32px;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}.label{font-weight:bold}.line{fill:none;stroke:#10253f;stroke-width:2}.axis{stroke:#687787;stroke-dasharray:7 4;fill:none}.metal{fill:#dce4ea;stroke:#10253f;stroke-width:2}.cut{fill:none;stroke:#b04d00;stroke-width:4}</style>
<text x="24" y="44" class="label">Unified inch thread</text>
<text x="24" y="106" class="label">1/4 – 20 UNC – 2B</text>
<path d="M24 128H776" stroke="#c5ced7"/>
<text x="24" y="182" class="label">1/4</text><text x="210" y="182">Nominal major diameter (in)</text>
<text x="24" y="240" class="label">20</text><text x="210" y="240">Threads per inch (TPI)</text>
<text x="24" y="298" class="label">UNC</text><text x="210" y="298">Unified coarse series</text>
<text x="24" y="356" class="label">2B</text><text x="210" y="356">Class 2; B = internal</text>
<path d="M24 396H776" stroke="#c5ced7"/>
<text x="24" y="448" class="label">Metric thread</text>
<text x="24" y="510" class="label">M6 × 1</text>
<path d="M24 532H776" stroke="#c5ced7"/>
<text x="24" y="584" class="label">M6</text><text x="210" y="584">Metric; nominal major</text><text x="210" y="626">diameter 6 mm</text>
<text x="24" y="684" class="label">1</text><text x="210" y="684">Pitch: 1 mm between crests</text>
<text x="24" y="758">Pitch is a distance; TPI is a count per inch.</text>
<text x="24" y="816">M6 × 1 alone states no tolerance class.</text>
</svg>
