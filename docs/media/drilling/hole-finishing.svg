<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title">
<title id="title">Counterbore, countersink, spot face and reamed hole compared</title>
<rect width="800" height="920" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#10253f;font-size:32px;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}.label{font-weight:bold}.line{fill:none;stroke:#10253f;stroke-width:2}.axis{stroke:#687787;stroke-dasharray:7 4;fill:none}.metal{fill:#dce4ea;stroke:#10253f;stroke-width:2}.cut{fill:none;stroke:#b04d00;stroke-width:4}</style>
<text x="24" y="44" class="label">Hole sections: finished shapes</text>
<text x="24" y="90">Gray = material; white = hole</text>
<text x="24" y="132">Dashed lines = axes; schematic only</text>
<g transform="translate(24,185)">
  <text x="0" y="0" class="label">Counterbore</text>
  <path class="metal" d="M50 30H85V90H115V180H50ZM225 30H190V90H160V180H225Z"/>
  <path class="axis" d="M137.5 15V195"/>
  <text x="0" y="234">Cylindrical recess</text><text x="0" y="276">Flat shoulder</text>
</g>
<g transform="translate(424,185)">
  <text x="0" y="0" class="label">Countersink</text>
  <path class="metal" d="M50 30H80L115 80V180H50ZM225 30H195L160 80V180H225Z"/>
  <path class="axis" d="M137.5 15V195"/>
  <text x="0" y="234">Conical seat</text><text x="0" y="276">Match head angle</text>
</g>
<g transform="translate(24,530)">
  <text x="0" y="0" class="label">Spot face</text>
  <path class="metal" d="M50 30L65 25L80 31H85V47H115V180H50ZM225 30L210 25L195 31H190V47H160V180H225Z"/>
  <path class="axis" d="M137.5 15V195"/>
  <text x="0" y="234">Shallow flat seat</text><text x="0" y="276">Bearing surface</text>
</g>
<g transform="translate(424,530)">
  <text x="0" y="0" class="label">Reamed hole</text>
  <path class="metal" d="M50 30H112V180H50ZM225 30H163V180H225Z"/>
  <path class="axis" d="M137.5 15V195"/><path class="cut" d="M112 31V179M163 31V179"/>
  <text x="0" y="234">Finished bore</text><text x="0" y="276">Size and finish</text>
</g>
<text x="24" y="864">Boring can also finish a straight bore.</text>
<text x="24" y="906">Shape alone does not identify the tool.</text>
</svg>
