# G-code playground: build a CNC program from blocks, read it as G-code and
# run it on the milling simulator's block. Mounted by any page element
# carrying data-interactive="gcode-playground". Paths are relative to this
# folder and load in this order:
#   gcode.js    CourseWikiGcode         the interpreter: lines to commands
#   machine.js  CourseWikiGcodeMachine  runs the commands on the block
#   blocks.js   CourseWikiGcodeBlocks   the blocks and the example programs
#   render.js   CourseWikiGcodeRender   the views as SVG (also run by Node
#                                       for the page's printed figures)
#   demo.js     builds the live playground in every mounted root
# The block, the cut model and the tools are the milling simulator's own
# (CourseWikiMillingSim, in milling-simulator/model.js). That module's page
# interface boots only on its own roots.
@@ID: gcode-playground
@@REQUIRES: milling-simulator
@@CSS: demo.css
@@JS: gcode.js, machine.js, blocks.js, render.js, demo.js
@@END
