# Milling simulator: make a target part on a simulated vertical mill by
# choosing tools and moving them, then inspect the part that is left.
# Mounted by any page element carrying data-interactive="milling-simulator".
# Paths are relative to this folder. model.js (CourseWikiMillingSim: the
# part, the tools and the machine rules) loads first; inspect.js
# (CourseWikiMillingInspect) and jobs.js (CourseWikiMillingJobs, the target
# parts) read it.
@@ID: milling-simulator
@@CSS: demo.css
@@JS: model.js, inspect.js, jobs.js
@@END
