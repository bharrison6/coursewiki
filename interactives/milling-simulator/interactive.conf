# Milling simulator: make a target part on a simulated vertical mill by
# choosing tools and moving them, then inspect the part that is left.
# Mounted by any page element carrying data-interactive="milling-simulator".
# Paths are relative to this folder and load in this order:
#   model.js    CourseWikiMillingSim      the part, the tools, the machine rules
#   inspect.js  CourseWikiMillingInspect  the part that is left against a drawing
#   jobs.js     CourseWikiMillingJobs     the target parts
#   draw.js     CourseWikiMillingDraw     drawings and sections as SVG (also
#                                         run by Node for the page's figures)
#   demo.js     builds the live simulator in every mounted root
@@ID: milling-simulator
@@CSS: demo.css
@@JS: model.js, inspect.js, jobs.js, draw.js, geometry-bundle.js, mesh.js, three-bundle.js, scene3d.js, demo.js
@@END
