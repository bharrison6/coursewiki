# Feeds-and-speeds calculator and cutting-motion demo. Mounted by any page
# element carrying data-interactive="feeds-and-speeds". Paths are relative to
# this folder; model.js must load before demo.js, which reads
# CourseWikiFeedsSpeeds from it. The cutter is drawn by the shared
# cutter-geometry module (CourseWikiCutter), which must load first.
@@ID: feeds-and-speeds
@@REQUIRES: cutter-geometry
@@CSS: demo.css
@@JS: model.js, demo.js
@@END
