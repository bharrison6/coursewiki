# Feeds-and-speeds calculator, material guidance and removal-power
# experiment. Mounted by any page element carrying
# data-interactive="feeds-and-speeds". Paths are relative to this folder.
# cutting-data.js (CourseWikiCuttingData, the coordinator's canonical
# material guidance) and model.js (CourseWikiFeedsSpeeds) load before
# demo.js, which reads both. The removed-solid drawing and power estimate
# come from the shared material-removal module (CourseWikiRemoval).
@@ID: feeds-and-speeds
@@REQUIRES: material-removal
@@CSS: demo.css
@@JS: cutting-data.js, model.js, demo.js
@@END
