# Sweep and loft lab: what the profile, path and profile order do, and why features fail.
# Mounted by any element with data-interactive="sweep-loft-lab"; data-sll-mode chooses
# sweep, loft or challenge. Load order:
#   model.js    CourseWikiSweepLoftModel    pure sweep/loft geometry and local checks
#   render.js   CourseWikiSweepLoftRender   SVG plan, chart and wireframes (live + static)
#   lessons.js  CourseWikiSweepLoftLessons  prediction rounds, challenges, static lessons
#   scene3d.js  CourseWikiSweepLoft3D       WebGL view on the shared three-runtime
#   demo.js     builds every mounted lab independently
@@ID: sweep-loft-lab
@@REQUIRES: three-runtime
@@CSS: demo.css
@@JS: model.js, render.js, lessons.js, scene3d.js, demo.js
@@END
