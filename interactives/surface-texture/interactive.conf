# Surface texture lab: a patch of machined surface, a stylus trace across it,
# the filter that splits waviness from roughness, Ra, Rz and Rt, and the
# drawing callouts that state a requirement. Mounted by any page element
# carrying data-interactive="surface-texture" (data-st-view="notation" or
# "challenge" for the other two views). Paths are relative to this folder
# and load in this order:
#   surface.js   CourseWikiTextureSurface   the teaching surfaces and their lay
#   profile.js   CourseWikiTextureProfile   trace, Gaussian mean line, Ra Rz Rt
#   notation.js  CourseWikiTextureNotation  symbols, lay, N grades, triangles
#   render.js    CourseWikiTextureRender    the pictures as SVG (also run by
#                                           Node for the page's printed figures)
#   quiz.js      CourseWikiTextureQuiz      read-the-callout questions
#   demo.js      builds the live views in every mounted root
@@ID: surface-texture
@@CSS: demo.css
@@JS: surface.js, profile.js, notation.js, render.js, quiz.js, demo.js
@@END
