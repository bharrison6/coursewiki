# Lathe simulator: make a part from a drawing by choosing tools and moving
# them against turning stock. Mounted by any page element carrying
# data-interactive="turning-simulator". Paths are relative to this folder.
# model.js (CourseWikiTurning) is the pure lathe engine, parts and inspection;
# render.js (CourseWikiTurningRender) draws its states as SVG and needs it;
# demo.js wires the controls to both, so it loads last.
@@ID: turning-simulator
@@CSS: demo.css
@@JS: model.js, render.js, demo.js
@@END
