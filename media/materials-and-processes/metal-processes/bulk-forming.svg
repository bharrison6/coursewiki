<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">Rolling, forging and extrusion</title><desc id="desc">Three sketches compare the direction of force and the resulting shape. Rolling reduces thickness, forging compresses a workpiece and extrusion pushes through an opening.</desc>
<rect width="900" height="350" fill="#fff"/>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#142b43} .small {font-size:15px} .head {font-size:23px;font-weight:bold} .line {stroke:#142b43;stroke-width:2;fill:none} .metal {fill:#b9d5e7;stroke:#142b43;stroke-width:2} .tool {fill:#cbd0d6;stroke:#142b43;stroke-width:2}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#142b43"/></marker></defs>

<text x="25" y="35" class="head">Rolling</text><text x="325" y="35" class="head">Forging</text><text x="625" y="35" class="head">Extrusion</text>
