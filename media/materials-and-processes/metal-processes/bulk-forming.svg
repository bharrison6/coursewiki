<path d="M40 110H95 M205 205H265" class="line" marker-end="url(#arrow)"/>
<text x="20" y="302">Thinner, longer stock</text>
<rect x="335" y="105" width="225" height="35" class="tool"/><rect x="335" y="230" width="225" height="35" class="tool"/>
<path d="M375 190Q448 155 520 190V225H375Z" class="metal"/>
<path d="M445 60V98" class="line" marker-end="url(#arrow)"/><path d="M445 160V185" class="line" marker-end="url(#arrow)"/>
