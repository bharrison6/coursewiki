<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Five welding processes compared</title><desc id="desc">Table graphic listing process, heat source, filler supply and typical application. Full trade-offs appear in the accompanying HTML table.</desc>
<rect width="1000" height="460" fill="#fff"/>
<style>text {font-family:Arial,sans-serif;font-size:18px;fill:#142b43} .small {font-size:15px} .head {font-size:23px;font-weight:bold} .line {stroke:#142b43;stroke-width:2;fill:none} .metal {fill:#b9d5e7;stroke:#142b43;stroke-width:2} .tool {fill:#cbd0d6;stroke:#142b43;stroke-width:2}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#142b43"/></marker></defs>
<text x="20" y="32" class="head">Compare the joining mechanism before the equipment</text><text x="20" y="75" font-weight="bold">Process</text><text x="225" y="75" font-weight="bold">Heat source</text><text x="430" y="75" font-weight="bold">Filler</text><text x="710" y="75" font-weight="bold">Typical fit</text><rect x="10" y="95" width="975" height="60" fill="#edf3f7"/><path d="M10 155H985" class="line"/><text x="20" y="131">Oxy-fuel</text><text x="225" y="131">Flame</text><text x="430" y="131">Separate rod, if needed</text><text x="710" y="131">Selected thin-steel work</text><rect x="10" y="157" width="975" height="60" fill="#fff"/><path d="M10 217H985" class="line"/><text x="20" y="193">Stick / SMAW</text><text x="225" y="193">Electric arc</text><text x="430" y="193">Flux-coated rod</text><text x="710" y="193">Steel repair</text><rect x="10" y="219" width="975" height="60" fill="#edf3f7"/><path d="M10 279H985" class="line"/><text x="20" y="255">GMAW (MIG/MAG)</text><text x="225" y="255">Electric arc</text><text x="430" y="255">Continuous wire</text><text x="710" y="255">Repeated fabrication</text><rect x="10" y="281" width="975" height="60" fill="#fff"/><path d="M10 341H985" class="line"/><text x="20" y="317">TIG / GTAW</text><text x="225" y="317">Electric arc</text><text x="430" y="317">Separate filler, if needed</text><text x="710" y="317">Controlled thin joints</text><rect x="10" y="343" width="975" height="60" fill="#edf3f7"/><path d="M10 403H985" class="line"/><text x="20" y="379">Resistance spot</text><text x="225" y="379">Resistance heating</text><text x="430" y="379">Usually none</text><text x="710" y="379">Overlapping sheet</text><text x="20" y="439" class="small">Each choice also depends on alloy, joint geometry, access and required performance.</text></svg>