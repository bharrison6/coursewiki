<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Steam bending compared with bent lamination</title><desc id="desc">Conceptual diagram, not a machine setup drawing. Not to scale.</desc><rect width="800" height="480" fill="#fff"/><style>text{font:18px sans-serif;fill:#12284c}.heading{font-size:22px;font-weight:bold}.wood{fill:#f7e5b5;stroke:#12284c;stroke-width:2}.line{fill:none;stroke:#12284c;stroke-width:3}.cut{fill:none;stroke:#b44015;stroke-width:4}.note{font-size:16px}</style>
<text x="25" y="35" class="heading">Steam bend: one softened piece</text>
<rect x="25" y="65" width="240" height="25" class="wood"/>
<path d="M295 78H370m-10 -8 10 8 -10 8" class="line"/>
<path d="M430 170Q560 -10 690 170L673 188Q560 25 447 188Z" class="wood"/>
<path d="M460 195Q560 58 660 195Z" fill="#d2d7df" stroke="#12284c" stroke-width="2"/>
<text x="535" y="177">Form</text><text x="25" y="127">Heat + moisture</text><text x="25" y="157">Bend; restrain while setting</text>
<text x="25" y="245" class="heading">Bent lamination: thin strips + adhesive</text>
<path d="M25 280H265 M25 292H265 M25 304H265" stroke="#ad7829" stroke-width="6"/>
<path d="M295 292H370m-10 -8 10 8 -10 8" class="line"/>
<path d="M430 375Q560 195 690 375 M438 383Q560 217 682 383 M446 391Q560 239 674 391" fill="none" stroke="#ad7829" stroke-width="6"/>
<path d="M460 409Q560 272 660 409Z" fill="#d2d7df" stroke="#12284c" stroke-width="2"/>
<text x="535" y="390">Form</text><text x="25" y="346">Bend together; restrain</text><text x="25" y="376">until the bond develops</text>
<text x="25" y="455" class="note">Both routes can spring back after release. Form compensation needs a trial.</text>
</svg>