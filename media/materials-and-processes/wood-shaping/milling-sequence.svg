<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img" aria-labelledby="title desc"><title id="title">Five-stage rough-lumber milling sequence</title><desc id="desc">Conceptual diagram, not a machine setup drawing. Not to scale.</desc><rect width="800" height="630" fill="#fff"/><style>text{font:18px sans-serif;fill:#12284c}.heading{font-size:22px;font-weight:bold}.wood{fill:#f7e5b5;stroke:#12284c;stroke-width:2}.line{fill:none;stroke:#12284c;stroke-width:3}.cut{fill:none;stroke:#b44015;stroke-width:4}.note{font-size:16px}</style><text x="25" y="35" class="heading">Rough stock → reference surfaces → final dimensions</text><rect x="25" y="65" width="750" height="78" rx="8" class="wood"/><text x="45" y="94" class="heading">1. Face-joint</text><text x="45" y="123">One flat face</text><path d="M400 145v20m-6 -6 6 6 6 -6" class="line"/><rect x="25" y="168" width="750" height="78" rx="8" class="wood"/><text x="45" y="197" class="heading">2. Edge-joint</text><text x="45" y="226">One edge square to that face</text><path d="M400 248v20m-6 -6 6 6 6 -6" class="line"/><rect x="25" y="271" width="750" height="78" rx="8" class="wood"/><text x="45" y="300" class="heading">3. Plane</text><text x="45" y="329">Opposite face parallel; set thickness</text><path d="M400 351v20m-6 -6 6 6 6 -6" class="line"/><rect x="25" y="374" width="750" height="78" rx="8" class="wood"/><text x="45" y="403" class="heading">4. Rip</text><text x="45" y="432">Opposite edge parallel; set width</text><path d="M400 454v20m-6 -6 6 6 6 -6" class="line"/><rect x="25" y="477" width="750" height="78" rx="8" class="wood"/><text x="45" y="506" class="heading">5. Crosscut</text><text x="45" y="535">Square ends; set length</text><text x="25" y="606" class="note">Each stage uses geometry established earlier. Inspect the result at each stage.</text></svg>