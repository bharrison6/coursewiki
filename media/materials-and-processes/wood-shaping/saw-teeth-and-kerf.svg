<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Tooth geometry and kerf</title><desc id="desc">Conceptual diagram, not a machine setup drawing. Not to scale.</desc><rect width="800" height="420" fill="#fff"/><style>text{font:18px sans-serif;fill:#12284c}.heading{font-size:22px;font-weight:bold}.wood{fill:#f7e5b5;stroke:#12284c;stroke-width:2}.line{fill:none;stroke:#12284c;stroke-width:3}.cut{fill:none;stroke:#b44015;stroke-width:4}.note{font-size:16px}</style>
<text x="25" y="32" class="heading">Representative circular-blade teeth: front views</text>
<text x="25" y="72">Rip: flat top, chisel-like edge</text>
<path d="M55 160V105H125V160 M155 160V105H225V160" class="wood"/>
<path d="M55 105H125 M155 105H225" class="cut"/>
<text x="420" y="72">Crosscut: alternate top bevel</text>
<path d="M450 160V95L520 125V160 M550 160V125L620 95V160" class="wood"/>
<path d="M450 95L520 125 M550 125L620 95" class="cut"/>
<text x="25" y="203" class="note">Edges emphasized; actual blades can use other tooth arrangements.</text>
<text x="25" y="248" class="heading">Clearance: blade body narrower than cut</text>
<rect x="35" y="275" width="270" height="90" class="wood"/><rect x="405" y="275" width="270" height="90" class="wood"/>
<rect x="335" y="300" width="40" height="65" fill="#d2d7df" stroke="#12284c" stroke-width="2"/>
<path d="M305 283H405 M305 275V291 M405 275V291" class="cut"/>
<text x="318" y="268" class="note">Kerf</text><text x="285" y="395">Blade body</text>
<text x="440" y="395" class="note">Set or wider tips provide clearance.</text>
</svg>