<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1050" role="img" aria-labelledby="title desc">
<title id="title">Four material families: qualitative comparison</title>
<desc id="desc">A comparison grid of mass and stiffness, conduction, and working behavior. Common tendencies only; individual grades and conditions vary.</desc>
<rect width="680" height="1050" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#10263b">
<text x="24" y="42" font-size="29" font-weight="bold">Four families, different starting points</text>
<rect x="20" y="65" width="640" height="218" rx="9" fill="#f0f5f8" stroke="#466276"/>
<text x="38" y="103" font-size="30" font-weight="bold">Metals</text>
<text x="38" y="137" font-size="24" font-weight="bold">Mass / stiffness</text>
<text x="280" y="137" font-size="22">Often dense and stiff</text>
<text x="38" y="184" font-size="24" font-weight="bold">Heat / electricity</text>
<text x="280" y="184" font-size="22">Usually good conductors</text>
<text x="38" y="231" font-size="24" font-weight="bold">Working behavior</text>
<text x="280" y="231" font-size="22">Many bend; alloy matters</text>
<rect x="20" y="297" width="640" height="218" rx="9" fill="#f0f5f8" stroke="#466276"/>
<text x="38" y="335" font-size="30" font-weight="bold">Plastics (polymers)</text>
<text x="38" y="369" font-size="24" font-weight="bold">Mass / stiffness</text>
<text x="280" y="369" font-size="22">Usually light; lower stiffness</text>
<text x="38" y="416" font-size="24" font-weight="bold">Heat / electricity</text>
<text x="280" y="416" font-size="22">Usually poor conductors</text>
<text x="38" y="463" font-size="24" font-weight="bold">Working behavior</text>
<text x="280" y="463" font-size="22">Often moldable; heat limits</text>
<rect x="20" y="529" width="640" height="218" rx="9" fill="#f0f5f8" stroke="#466276"/>
<text x="38" y="567" font-size="30" font-weight="bold">Wood &amp; Composites</text>
<text x="38" y="601" font-size="24" font-weight="bold">Mass / stiffness</text>
<text x="280" y="601" font-size="22">Often light; direction matters</text>
<text x="38" y="648" font-size="24" font-weight="bold">Heat / electricity</text>
<text x="280" y="648" font-size="22">Wood: low; composites vary</text>
<text x="38" y="695" font-size="24" font-weight="bold">Working behavior</text>
<text x="280" y="695" font-size="22">Grain, layers and binder matter</text>
<rect x="20" y="761" width="640" height="218" rx="9" fill="#f0f5f8" stroke="#466276"/>
<text x="38" y="799" font-size="30" font-weight="bold">Ceramics &amp; Glass</text>
<text x="38" y="833" font-size="24" font-weight="bold">Mass / stiffness</text>
<text x="280" y="833" font-size="22">Often stiff; density varies</text>
<text x="38" y="880" font-size="24" font-weight="bold">Heat / electricity</text>
<text x="280" y="880" font-size="22">Heat varies; many insulate current</text>
<text x="38" y="927" font-size="24" font-weight="bold">Working behavior</text>
<text x="280" y="927" font-size="22">Often hard and brittle</text>
<text x="24" y="1024" font-size="24">Typical behavior only. Check the specific material.</text>
</g></svg>