<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="title desc">
  <title id="title">Choose a plastic joining candidate</title>
  <desc id="desc">Identify both materials and the requirements. If disassembly is required, consider mechanical joining. Otherwise, if thermoplastics are weld-compatible, evaluate a weld. If they are not, evaluate a validated solvent cement or adhesive, or redesign. Test every candidate for the intended service.</desc>
  <rect width="600" height="640" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="19" fill="#002144" text-anchor="middle">
    <text x="300" y="32" font-size="24" font-weight="bold">Choose a joint, then test it</text>
    <g stroke="#002144" stroke-width="2" fill="#eef5f8">
      <rect x="70" y="53" width="460" height="60" rx="8"/>
      <rect x="28" y="155" width="275" height="67" rx="8"/>
      <rect x="373" y="155" width="202" height="67" rx="8" fill="#fff1c9"/>
      <rect x="28" y="278" width="275" height="82" rx="8"/>
      <rect x="373" y="278" width="202" height="82" rx="8" fill="#fff1c9"/>
      <rect x="28" y="417" width="275" height="86" rx="8" fill="#fff1c9"/>
      <rect x="70" y="560" width="460" height="58" rx="8"/>
    </g>
    <text x="300" y="79">Identify both resins and grades.</text><text x="300" y="102">Define load, environment and appearance.</text>
    <text x="165" y="184">Must the assembly</text><text x="165" y="208">come apart?</text>
    <text x="474" y="184">Mechanical joint</text><text x="474" y="208">Screws / release snaps</text>
    <text x="165" y="306">Compatible thermoplastics</text><text x="165" y="330">with an accessible,</text><text x="165" y="353">weldable joint?</text>
    <text x="474" y="310">Evaluate welding</text><text x="474" y="337">Process + joint design</text>
    <text x="165" y="444">Validated cement / adhesive?</text><text x="165" y="468">Check both surfaces.</text><text x="165" y="492">If none: redesign the joint.</text>
    <g stroke="#002144" stroke-width="2" fill="none">
      <path d="M165 113V155m-5-8 5 8 5-8M303 189H373m-8-5 8 5-8 5M165 222V278m-5-8 5 8 5-8M303 319H373m-8-5 8 5-8 5M165 360V417m-5-8 5 8 5-8M165 503V560m-5-8 5 8 5-8M474 222V260H588V530H474V560m-5-8 5 8 5-8M474 360V530H165"/>
    </g>
    <text x="338" y="178">Yes</text><text x="187" y="254">No</text><text x="338" y="307">Yes</text><text x="187" y="393">No</text>
    <text x="300" y="585">Test a representative joint after cure / cooling.</text><text x="300" y="608">Check load, fit and sealing where required.</text>
  </g>
</svg>
