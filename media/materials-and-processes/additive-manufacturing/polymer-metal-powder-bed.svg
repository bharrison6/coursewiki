<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Polymer and metal powder bed fusion cases</title>
  <desc id="desc">A stacked original diagram shows the shared spread-select-lower cycle, a polymer part surrounded by removable powder with an access opening, and a stated metal laser powder bed overhang attached to the build plate by thermal supports.</desc>
  <rect width="400" height="1040" fill="#fff"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#17324d}.head{font-size:23px;font-weight:bold}.label{font-size:20px;font-weight:bold}.note{font-size:18px}.small{font-size:15px}.panel{fill:#eef6fa;stroke:#17324d;stroke-width:2}.powder{fill:#d8c7a3;stroke:#17324d;stroke-width:1.5}.part{fill:#edac00;stroke:#17324d;stroke-width:2}.metal{fill:#aeb9c4;stroke:#17324d;stroke-width:2}.support{fill:#00769d;stroke:#17324d;stroke-width:1.5}.energy{fill:none;stroke:#9b2f22;stroke-width:3;stroke-dasharray:7 5}.motion{fill:none;stroke:#17324d;stroke-width:2;marker-end:url(#arrow)}</style>
  <text x="18" y="30" class="head">Powder bed fusion cases</text>
  <text x="18" y="54" class="small">Shared cycle; material-specific assumptions</text>

  <g transform="translate(15 72)">
    <rect class="panel" width="370" height="265" rx="10"/><text x="16" y="30" class="label">Shared layer cycle</text>
    <g transform="translate(20 50)"><rect class="powder" width="110" height="42"/><circle cx="20" cy="14" r="3"/><circle cx="43" cy="29" r="3"/><circle cx="67" cy="13" r="3"/><circle cx="91" cy="29" r="3"/><text x="140" y="27" class="note">1. Spread a powder layer</text></g>
    <path class="motion" d="M75 100V126"/><g transform="translate(20 133)"><rect class="powder" width="110" height="42"/><path class="part" d="M25 34L45 11H75L95 34Z"/><path class="energy" d="M60 -5V11"/><text x="140" y="18" class="note">2. Select regions with</text><text x="140" y="40" class="note">the stated thermal route</text></g>
    <path class="motion" d="M75 184V210"/><text x="140" y="218" class="note">3. Lower or advance,</text><text x="140" y="240" class="note">then repeat</text>
  </g>

  <g transform="translate(15 353)">
    <rect class="panel" width="370" height="315" rx="10"/><text x="16" y="30" class="label">Stated polymer SLS / MJF case</text>
    <g transform="translate(25 55)"><rect class="powder" width="320" height="150"/><path class="part" fill-rule="evenodd" d="M70 125V35H250V125ZM112 100H208V62H112Z"/><path d="M208 81H280" fill="none" stroke="#fff" stroke-width="18"/><path d="M208 81H280" fill="none" stroke="#17324d" stroke-width="2" stroke-dasharray="6 4"/><text x="10" y="174" class="note">Loose powder surrounds the part</text><text x="10" y="198" class="note">Access opening lets powder leave</text></g>
    <text x="20" y="280" class="small">SLS: laser selection · MJF: agents plus heat</text>
  </g>

  <g transform="translate(15 684)">
    <rect class="panel" width="370" height="315" rx="10"/><text x="16" y="30" class="label">Stated metal laser-PBF case</text>
    <g transform="translate(25 55)"><rect class="powder" width="320" height="150"/><rect class="metal" x="25" y="115" width="270" height="20"/><path class="metal" d="M78 115V55H242V82H135V115Z"/><path class="support" d="M145 115L163 82H182L164 115ZM190 115L208 82H227L209 115Z"/><path class="energy" d="M190 25V55"/><text x="10" y="174" class="note">Build plate + stated supports:</text><text x="10" y="198" class="note">anchor overhang and conduct heat</text></g>
    <text x="20" y="280" class="small">Other laser/electron-beam strategies can differ.</text>
  </g>
  <text x="200" y="1027" text-anchor="middle" class="small">Conceptual; particles, layers and supports are exaggerated.</text>
</svg>
