<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 970" role="img" aria-labelledby="title desc">
<title id="title">Toolholder gripping mechanisms</title>
<desc id="desc">Original concept sketches. The spindle connection is separate from the tool grip. Adjustable jaws, a screw on a flat, a nut-drawn ER collet, thermal interference, a fluid-loaded sleeve, a mechanical bearing drive and a pressed tapered collet create different force paths. No dimensions, settings or performance rankings are shown.</desc>
<rect width="900" height="970" rx="12" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#002144;font-size:22px}.head{font-size:27px;font-weight:bold}.label{font-size:23px;font-weight:bold}.small{font-size:20px}.line{fill:none;stroke:#002144;stroke-width:3;stroke-linejoin:round}.body{fill:#d8e0e7;stroke:#002144;stroke-width:3}.tool{fill:#91c2db;stroke:#002144;stroke-width:3}.grip{fill:#ecac00;stroke:#002144;stroke-width:2}</style>
<defs><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs>
<text x="25" y="37" class="head">Identify the force path, not just the outer shape</text>
<path d="M450 60V905M15 270H885M15 480H885M15 690H885" stroke="#ccd5dd" stroke-width="2"/>

<g transform="translate(15 65)">
 <text x="12" y="25" class="label">Two ends, two choices</text>
 <path d="M25 85L85 70H145V130H85L25 115Z" class="body"/>
 <rect x="140" y="90" width="150" height="25" class="tool"/>
 <rect x="140" y="80" width="28" height="10" class="grip"/><rect x="140" y="115" width="28" height="10" class="grip"/>
 <path d="M255 91L274 113M267 91L286 113" class="line"/>
 <text x="18" y="60" class="small">Machine end</text><text x="175" y="60" class="small">Tool end</text>
 <text x="18" y="163">Spindle interface</text><text x="230" y="163">Grip</text>
 <text x="18" y="193" class="small">ER alone does not name the spindle fit.</text>
</g>

<g transform="translate(465 65)">
 <text x="12" y="25" class="label">Ordinary drill chuck</text>
 <circle cx="105" cy="112" r="63" class="body"/>
 <g class="grip"><path d="M96 54H114L112 88H98Z"/><path d="M96 54H114L112 88H98Z" transform="rotate(120 105 112)"/><path d="M96 54H114L112 88H98Z" transform="rotate(240 105 112)"/></g>
 <circle cx="105" cy="112" r="23" class="tool"/>
 <text x="200" y="90">Jaws close</text><text x="200" y="120">around shank.</text>
 <text x="200" y="158" class="small">Keyed or keyless</text>
 <text x="18" y="193" class="small">A brand name does not rate a milling job.</text>
</g>

<g transform="translate(15 275)">
 <text x="12" y="25" class="label">Weldon / side-lock</text>
 <circle cx="105" cy="112" r="61" class="body"/><circle cx="105" cy="112" r="35" fill="#fff"/>
 <path d="M81 97A28 28 0 1 0 129 97Z" class="tool"/>
 <rect x="96" y="50" width="18" height="46" class="grip"/>
 <path d="M105 34V47" class="line" marker-end="url(#force)"/>
 <path d="M81 97H129" class="line"/>
 <text x="200" y="86">Screw bears</text><text x="200" y="116">on the tool's</text><text x="200" y="146">designated flat.</text>
 <text x="18" y="193" class="small">Match bore, shank and flat.</text>
</g>

<g transform="translate(465 275)">
 <text x="12" y="25" class="label">ER collet</text>
 <path d="M35 60H175V150H35Z" class="body"/>
 <path d="M65 87L170 68V142L65 123Z" fill="#fff" stroke="#002144" stroke-width="2"/>
 <path d="M70 87L170 73V91H70ZM70 119H170V137L70 123Z" class="grip"/>
 <rect x="78" y="94" width="180" height="22" class="tool"/>
 <path d="M167 62H191V92H167ZM167 118H191V148H167Z" class="grip"/>
 <path d="M218 66H193" class="line" marker-end="url(#force)"/>
 <text x="280" y="85">Nut draws</text><text x="280" y="115">split collet</text><text x="280" y="145">into taper.</text>
 <text x="18" y="193" class="small">The collet's rated range still matters.</text>
</g>

<g transform="translate(15 485)">
 <text x="12" y="25" class="label">Shrink fit</text>
 <circle cx="105" cy="112" r="60" class="body"/>
 <circle cx="105" cy="112" r="28" class="tool"/>
 <circle cx="105" cy="112" r="36" fill="none" stroke="#b34720" stroke-width="3" stroke-dasharray="6 4"/>
 <path d="M100 74V60M137 108H151" class="line" marker-end="url(#force)"/>
 <text x="200" y="86">Heat expands bore.</text><text x="200" y="120">Cooling produces</text><text x="200" y="154">interference grip.</text>
 <text x="18" y="193" class="small">Dashes: expanded-bore concept.</text>
</g>

<g transform="translate(465 485)">
 <text x="12" y="25" class="label">Hydraulic expansion</text>
 <circle cx="105" cy="112" r="62" class="body"/><circle cx="105" cy="112" r="47" class="grip"/>
 <circle cx="105" cy="112" r="36" class="body"/><circle cx="105" cy="112" r="24" class="tool"/>
 <rect x="97" y="40" width="16" height="28" class="body"/>
 <path d="M105 72V83M145 112H134M65 112H76" class="line" marker-end="url(#force)"/>
 <text x="200" y="86">Actuator</text><text x="200" y="120">pressurizes fluid;</text><text x="200" y="154">sleeve grips shank.</text>
 <text x="18" y="193" class="small">Gold ring: fluid chamber.</text>
</g>

<g transform="translate(15 695)">
 <text x="12" y="25" class="label">Mechanical milling chuck</text>
 <circle cx="105" cy="112" r="63" class="body"/><circle cx="105" cy="112" r="46" fill="#fff" stroke="#002144" stroke-width="2"/>
 <g stroke="#002144" stroke-width="2" fill="#ecac00"><rect x="90" y="54" width="10" height="25" transform="rotate(-15 95 66)"/><rect x="144" y="102" width="10" height="25" transform="rotate(75 149 114)"/><rect x="101" y="147" width="10" height="25" transform="rotate(165 106 159)"/><rect x="51" y="99" width="10" height="25" transform="rotate(255 56 111)"/></g>
 <circle cx="105" cy="112" r="33" class="body"/><circle cx="105" cy="112" r="23" class="tool"/>
 <path d="M105 76V84M140 112H133" class="line" marker-end="url(#force)"/>
 <text x="200" y="86">Nut / bearing drive</text><text x="200" y="120">compresses bore.</text><text x="200" y="154" class="small">One design shown.</text>
 <text x="18" y="193" class="small">Other designs use gearing and a collet.</text>
</g>

<g transform="translate(465 695)">
 <text x="12" y="25" class="label">Pressed collet / powRgrip</text>
 <path d="M48 78H76L93 158H137L154 78H182V177H48Z" class="body"/>
 <path d="M76 71H154L135 155H95Z" class="grip"/>
 <rect x="106" y="61" width="18" height="123" class="tool"/>
 <path d="M88 35V68M142 35V68" class="line" marker-end="url(#force)"/>
 <text x="210" y="86">Press fits tapered</text><text x="210" y="120">collet to holder.</text><text x="210" y="154" class="small">No ER nut or heating.</text>
 <text x="18" y="207" class="small">External unit inserts and releases collet.</text>
</g>

<text x="25" y="938" class="small">Blue: tool shank. Gold: gripping/actuating element or fluid, as labeled.</text>
<text x="25" y="962" class="small">Concepts only: no dimensions, assembly settings, speed approvals or rankings.</text>
</svg>
