<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">Trace vibration through the milling system</title>
<desc id="desc">Two force paths share the machine structure and meet at the cut. The upper tool path runs from machine and spindle through interface and holder to the cutter. The lower work path runs from table and machine through fixture to workpiece. Evidence at the cut includes where the pattern starts, engagement, speed and feed, and chips.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker>
  <style>.title{font:700 29px Arial,sans-serif;fill:#002144}.lane{font:700 23px Arial,sans-serif;fill:#002144}.head{font:700 21px Arial,sans-serif;fill:#002144}.body{font:20px Arial,sans-serif;fill:#202020}.small{font:18px Arial,sans-serif;fill:#202020}.box{fill:#f5f2ec;stroke:#002144;stroke-width:3}.cut{fill:#fff4d5;stroke:#ff4500;stroke-width:4}.line{stroke:#002144;stroke-width:4;fill:none;marker-end:url(#arrow)}.frame{stroke:#ecac00;stroke-width:6;fill:none}</style>
</defs>
<rect width="920" height="570" rx="18" fill="#fff"/>
<text class="title" x="30" y="45">TRACE BOTH FORCE PATHS BEFORE TUNING THE CUT</text>
<text class="lane" x="30" y="88">Tool side</text>
<g transform="translate(30 105)"><rect class="box" width="195" height="110" rx="12"/><text class="head" x="15" y="31">Machine + spindle</text><text class="small" x="15" y="62">repeats after setup</text><text class="small" x="15" y="87">abnormal motion</text></g>
<g transform="translate(255 105)"><rect class="box" width="195" height="110" rx="12"/><text class="head" x="15" y="31">Interface + holder</text><text class="small" x="15" y="62">seating • condition</text><text class="small" x="15" y="87">runout • projection</text></g>
<g transform="translate(480 105)"><rect class="box" width="180" height="110" rx="12"/><text class="head" x="15" y="31">Cutter</text><text class="small" x="15" y="62">wear • chipped edge</text><text class="small" x="15" y="87">built-up edge</text></g>
<text class="lane" x="30" y="343">Work side</text>
<g transform="translate(30 360)"><rect class="box" width="195" height="110" rx="12"/><text class="head" x="15" y="31">Table + machine</text><text class="small" x="15" y="62">supporting structure</text><text class="small" x="15" y="87">authorized inspection</text></g>
<g transform="translate(255 360)"><rect class="box" width="195" height="110" rx="12"/><text class="head" x="15" y="31">Fixture</text><text class="small" x="15" y="62">seating • locators</text><text class="small" x="15" y="87">clamp-force path</text></g>
<g transform="translate(480 360)"><rect class="box" width="180" height="110" rx="12"/><text class="head" x="15" y="31">Workpiece</text><text class="small" x="15" y="62">unsupported span</text><text class="small" x="15" y="87">thin wall • distortion</text></g>
<g transform="translate(700 105)"><rect class="cut" width="190" height="365" rx="15"/><text class="head" x="15" y="38">THE CUT</text><text class="small" x="15" y="75">where pattern begins</text><text class="small" x="15" y="105">engagement + path</text><text class="small" x="15" y="135">speed + feed/tooth</text><text class="small" x="15" y="165">chip evacuation</text><path d="M20 220q28-30 56 0t56 0t38 0" stroke="#ff4500" stroke-width="5" fill="none"/><text class="small" x="15" y="275">Observe location,</text><text class="small" x="15" y="302">finish, sound and</text><text class="small" x="15" y="329">edge condition.</text></g>
<path class="line" d="M225 160H255M450 160H480M660 160H700M225 415H255M450 415H480M660 415H700"/>
<path class="frame" d="M127 215V360"/><text class="small" x="148" y="275">Machine structure</text><text class="small" x="148" y="300">connects both sides</text>
<text class="body" x="167" y="535">Cutting force travels through both paths; flexibility at any link can respond.</text>
</svg>
