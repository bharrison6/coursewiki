<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Series and parallel resistor paths"><title>Series and parallel resistor paths</title><rect width="100%" height="100%" fill="white"/><style>text{font:17px sans-serif;fill:#172b45} .wire{fill:none;stroke:#172b45;stroke-width:3}</style><text x="125" y="30">Series: one path</text><path class="wire" d="M55 65H140 M210 65H280 M350 65H385V255H55V175 M55 125V65"/><circle class="wire" cx="55" cy="150" r="25"/><text x="43" y="156">DC</text><rect class="wire" x="140" y="53" width="70" height="24"/><rect class="wire" x="280" y="53" width="70" height="24"/><text x="160" y="107">R1</text><text x="300" y="107">R2</text><text x="130" y="290">Same current through both</text><text x="490" y="30">Parallel: two paths</text><path class="wire" d="M440 65H510V210 M440 65V125 M440 175V255H720V65 M510 95H555 M625 95H720 M510 200H555 M625 200H720"/><circle class="wire" cx="440" cy="150" r="25"/><text x="428" y="156">DC</text><rect class="wire" x="555" y="83" width="70" height="24"/><rect class="wire" x="555" y="188" width="70" height="24"/><text x="575" y="135">R1</text><text x="575" y="240">R2</text><text x="465" y="290">Same voltage across both</text><circle cx="510" cy="95" r="4"/><circle cx="720" cy="95" r="4"/><circle cx="510" cy="200" r="4"/><circle cx="720" cy="200" r="4"/></svg>