<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" role="img" aria-labelledby="title"><title id="title">Lap, twist pigtail, and Western Union splice shapes</title><rect width="420" height="610" fill="white"/><style>text{font:18px sans-serif;fill:#172b4d} .head{font-weight:bold;font-size:22px} .wire{fill:none;stroke:#9a5119;stroke-width:9;stroke-linecap:round} .lead{fill:#ccc;stroke:#172b4d;stroke-width:2} .solder{fill:#b8d9ea;stroke:#172b4d;stroke-width:2} .pad{fill:#b87333;stroke:#172b4d} .board{fill:#e2eddf;stroke:#172b4d}</style>
<text x="20" y="35" class="head">Lap / lay-over</text><path d="M30 85H265 M160 100H390" class="wire"/><text x="20" y="145">Straight ends overlap.</text><text x="20" y="170">Support them while soldering.</text>
<text x="20" y="230" class="head">Twist / pigtail</text><path d="M30 265L130 285Q150 260 170 285T210 285T250 285T290 285 M30 310L130 290Q150 315 170 290T210 290T250 290T290 290" class="wire"/><text x="20" y="350">Ends twist into a joined tail.</text>
<text x="20" y="415" class="head">Western Union / inline</text><path d="M30 465H210Q220 435 230 465T250 465T270 465L280 445 M390 480H220Q210 510 200 480T180 480T160 480L150 500" class="wire"/><text x="20" y="540">Each end wraps the opposite wire.</text><text x="20" y="585">Shapes only; not to scale or a wrap-count rule.</text></svg>