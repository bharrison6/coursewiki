<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="Two matched cells: series adds voltage; parallel adds ampere-hours">
<title>Two matched cells: series adds voltage; parallel adds ampere-hours</title><rect width="800" height="490" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#18324b"/></marker></defs>
<style>text{font:20px sans-serif;fill:#18324b} .box{fill:#edf4f8;stroke:#18324b;stroke-width:2} .flow{fill:none;stroke:#18324b;stroke-width:3;marker-end:url(#arrow)} .wire{fill:none;stroke:#18324b;stroke-width:3}</style>

<text x="25" y="35">Each cell: 3.6 V, 2.4 Ah (ideal)</text>
<text x="25" y="80">2s1p: series</text>
<path class="wire" d="M35 135 H90 M230 135 H295 M435 135 H490"/>
<rect class="box" x="90" y="105" width="140" height="60"/><text x="100" y="143">−   cell 1   +</text>
<rect class="box" x="295" y="105" width="140" height="60"/><text x="305" y="143">−   cell 2   +</text>
<text x="520" y="140">7.2 V, 2.4 Ah</text>
<text x="25" y="215">1s2p: parallel</text>
<path class="wire" d="M35 305 H90 V260 H180 M90 305 V350 H180 M320 260 H410 V350 H320 M410 305 H490"/>
<rect class="box" x="180" y="230" width="140" height="60"/><text x="190" y="268">−   cell 1   +</text>
<rect class="box" x="180" y="320" width="140" height="60"/><text x="190" y="358">−   cell 2   +</text>
<text x="520" y="310">3.6 V, 4.8 Ah</text>
<text x="25" y="425">Both use two cells. Both store an ideal 17.28 Wh.</text>
<text x="25" y="460">Concept diagram only: pack protection and interconnections omitted.</text>
</svg>