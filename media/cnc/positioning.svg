<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title">
<title id="title">One path in absolute points and incremental moves</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173957"/></marker></defs>
<rect width="760" height="340" fill="#fff"/><g font-family="Arial, sans-serif" font-size="18" fill="#172c40">
<path d="M70 275H680" fill="none" stroke="#7a8a96" stroke-width="2" marker-end="url(#arrow)"/><path d="M70 275V40" fill="none" stroke="#7a8a96" stroke-width="2" marker-end="url(#arrow)"/>
<text x="685" y="280">+X</text><text x="40" y="45">+Y</text>
<path d="M150 230H590" fill="none" stroke="#173957" stroke-width="4" marker-end="url(#arrow)"/><path d="M590 230V80" fill="none" stroke="#173957" stroke-width="4" marker-end="url(#arrow)"/><path d="M590 80H260" fill="none" stroke="#173957" stroke-width="4" marker-end="url(#arrow)"/>
<text x="100" y="255">A (6,4)</text><text x="590" y="255">B (26,4)</text><text x="590" y="60">C (26,19)</text><text x="200" y="60">D (11,19)</text>
<text x="300" y="215">ΔX = +20</text><text x="600" y="155">ΔY = +15</text><text x="345" y="115">ΔX = −15</text>
<text x="150" y="315">Coordinates in mm. Unlisted axis increments are zero.</text></g></svg>