<rect x="490" y="185" width="130" height="45" fill="#e2edf4" stroke="#173957"/>
<path d="M410 208H705" stroke="#667" stroke-dasharray="6 4"/>
<path d="M620 208H715" fill="none" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 208V85" fill="none" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/>
<text x="695" y="240">+Z</text><text x="632" y="90">+X radial</text><text x="412" y="280">Headstock</text>
<text x="410" y="312">X shown on the illustrated tool side.</text></g></svg>