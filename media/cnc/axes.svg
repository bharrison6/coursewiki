<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title">
<title id="title">Tool-relative axes on a vertical mill and a basic lathe</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173957"/></marker></defs>
<rect width="760" height="340" fill="#fff"/><g font-family="Arial, sans-serif" font-size="18" fill="#172c40">
<text x="30" y="30" font-weight="bold">Vertical mill — front perspective</text>
<path d="M55 235L225 235L305 180L135 180Z" fill="#e2edf4" stroke="#173957"/>
<path d="M175 210H320" fill="none" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/><path d="M175 210L270 145" fill="none" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/><path d="M175 210V65" fill="none" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/>
<text x="325" y="215">+X</text><text x="275" y="140">+Y (back)</text><text x="185" y="75">+Z</text>
<text x="30" y="280">Tool relative to work: right, back, up.</text>
