<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title">
<title id="title">Machine and work coordinates related by a translation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173957"/></marker></defs>
<rect width="760" height="340" fill="#fff"/><g font-family="Arial, sans-serif" font-size="18" fill="#172c40">
<path d="M65 275H690" stroke="#173957" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M65 275V45" stroke="#173957" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="690" y="300">+X</text><text x="25" y="45">+Y</text><text x="25" y="305">M (0,0)</text>
<path d="M65 275L390 130" stroke="#173957" stroke-width="3" marker-end="url(#arrow)"/>
<text x="100" y="180">Offset vector (100,60)</text>
<path d="M390 130H670" stroke="#527d91" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 130V45" stroke="#527d91" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="390" cy="130" r="5"/><text x="385" y="160">W (work zero)</text>
<path d="M390 130L535 75" stroke="#173957" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="535" cy="75" r="5"/><text x="545" y="60">P: work (20,15)</text><text x="545" y="85">machine (120,75)</text>
<text x="225" y="320">XY translation only; diagram not to scale.</text></g></svg>