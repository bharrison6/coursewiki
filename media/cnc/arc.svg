<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title">
<title id="title">Quarter arc: G03 from A to B, G02 from B to A, with centre offsets</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#173957"/></marker></defs>
<rect width="760" height="340" fill="#fff"/><g font-family="Arial, sans-serif" font-size="18" fill="#172c40">
<text x="30" y="30" font-weight="bold">G17: looking from +Z toward the XY plane</text>
<path d="M65 275H380" fill="none" stroke="#7a8a96" stroke-width="2" marker-end="url(#arrow)"/><path d="M65 275V55" fill="none" stroke="#7a8a96" stroke-width="2" marker-end="url(#arrow)"/>
<text x="385" y="280">+X</text><text x="30" y="55">+Y</text>
<path d="M150 235A140 140 0 0 0 290 95" fill="none" stroke="#173957" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M150 235V95" fill="none" stroke="#173957" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<path d="M290 95H150" fill="none" stroke="#527d91" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<circle cx="150" cy="95" r="5"/><text x="85" y="75">C (12,18)</text><text x="90" y="260">A (12,8)</text><text x="300" y="100">B (22,18)</text>
<text x="75" y="170">J +10</text><text x="180" y="83">I −10</text>
<text x="425" y="150">A → B: G03 (CCW)</text><text x="425" y="180">I = 0, J = +10</text>
<text x="425" y="225">B → A: G02 (CW)</text><text x="425" y="255">I = −10, J = 0</text>
<text x="100" y="315">Radius 10 mm. I/J measured from each arc's start.</text></g></svg>