<svg xmlns="http://www.w3.org/2000/svg" width="400" height="670" viewBox="0 0 400 670" role="img" aria-labelledby="title desc">
<title id="title">Compare display styles on the same cube</title><desc id="desc">Six panels preserve one viewing direction. Hidden edges are dashed when distinguished and solid in wireframe.</desc>
<rect width="400" height="670" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#152c43">
<g transform="translate(10 10)"><text x="0" y="20">Shaded, no edges</text><g stroke="none" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#d7e7f0"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#a8ccdf"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#639bb8"/></g></g>
<g transform="translate(210 10)"><text x="0" y="20">Shaded with edges</text><g stroke="#152c43" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#d7e7f0"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#a8ccdf"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#639bb8"/></g></g>
<g transform="translate(10 230)"><text x="0" y="20">Hidden removed</text><g stroke="#152c43" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#fff"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#fff"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#fff"/></g></g>
<g transform="translate(210 230)"><text x="0" y="20">Hidden visible</text><g stroke="#152c43" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#fff"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#fff"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#fff"/></g><path d="M20 155 L65 125 L140 155 M65 125 L65 55" transform="translate(0 -0)" fill="none" stroke="#152c43" stroke-width="2" stroke-dasharray="5 5"/></g>
<g transform="translate(10 450)"><text x="0" y="20">Wireframe</text><g stroke="#152c43" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#fff"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#fff"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#fff"/></g><path d="M20 155 L65 125 L140 155 M65 125 L65 55" transform="translate(0 -0)" fill="none" stroke="#152c43" stroke-width="2" /></g>
<g transform="translate(210 450)"><text x="0" y="20">Shaded + hidden</text><g stroke="#152c43" stroke-width="2" stroke-linejoin="round"><path d="M20 85 L65 55 L140 85 L95 115 Z" fill="#d7e7f0"/><path d="M20 85 L95 115 L95 185 L20 155 Z" fill="#a8ccdf"/><path d="M95 115 L140 85 L140 155 L95 185 Z" fill="#639bb8"/></g><path d="M20 155 L65 125 L140 155 M65 125 L65 55" transform="translate(0 -0)" fill="none" stroke="#152c43" stroke-width="2" stroke-dasharray="5 5"/></g>
</g></svg>
