<svg xmlns="http://www.w3.org/2000/svg" width="400" height="675" viewBox="0 0 400 675" role="img" aria-labelledby="title desc"><title id="title">Primary auxiliary construction for a rectangular inclined face</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="675" fill="white"/><text x="20" y="25">1. Front view: inclined face seen on edge</text><path class="edge" d="M70,230 L230,110 V260 H70 Z"/><text x="40" y="218">P</text><text x="230" y="95">Q</text><path class="project" d="M70,230 L178,374 M230,110 L338,254"/><path class="center" d="M80,285 L288,129"/><text x="258" y="125">Fold line</text><polygon class="edge" points="112,286 272,166 320,230 160,350" fill="#e8f3f8"/><text x="115" y="277">P</text><text x="273" y="160">Q</text><text x="20" y="405">2. Auxiliary: true rectangular face</text><text x="20" y="434">Projectors are normal to the fold line.</text><text x="20" y="463">Transfer the depth from the top view.</text><text x="20" y="510">3. Top view supplies the depth</text><rect class="edge" x="70" y="535" width="160" height="80" fill="white"/><path class="edge" d="M248,535 V615"/><path class="edge" d="M239,535 H256 M239,615 H256"/><text x="265" y="578">Depth 80</text><text x="20" y="650">Face length: 200. Width: 80 (same scale).</text></svg>