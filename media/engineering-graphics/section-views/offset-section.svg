<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">Offset cut through three staggered holes</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="470" fill="white"/><text x="20" y="28">1. Top of plate; three through holes</text><rect class="edge" x="70" y="80" width="260" height="150" fill="white"/><circle class="edge" cx="110" cy="120" r="15" fill="white"/><circle class="edge" cx="200" cy="190" r="15" fill="white"/><circle class="edge" cx="290" cy="120" r="15" fill="white"/><path class="cut" d="M45,120 H155 V190 H245 V120 H355"/><path class="cut" d="M45,120 l0,-32" marker-end="url(#arrow)"/><path class="cut" d="M355,120 l0,-32" marker-end="url(#arrow)"/><text x="30" y="77">A</text><text x="355" y="77">A</text><text x="20" y="285">2. SECTION A–A: holes brought into view</text><rect class="edge" x="70" y="330" width="260" height="80" fill="url(#hatch)"/><rect class="edge" x="95" y="330" width="30" height="80" fill="white"/><rect class="edge" x="185" y="330" width="30" height="80" fill="white"/><rect class="edge" x="275" y="330" width="30" height="80" fill="white"/><text x="20" y="453">Do not draw the jogs as part edges.</text></svg>