<svg xmlns="http://www.w3.org/2000/svg" width="400" height="525" viewBox="0 0 400 525" role="img" aria-labelledby="title desc"><title id="title">Match a cutting plane to a resulting section</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="525" fill="white"/><text x="20" y="28">Parent: plate with two through holes</text><rect class="edge" x="70" y="65" width="260" height="150" fill="white"/><circle class="edge" cx="120" cy="105" r="15" fill="white"/><circle class="edge" cx="280" cy="175" r="15" fill="white"/><path class="cut" d="M40,105 H360"/><path class="cut" d="M40,105 l0,-32" marker-end="url(#arrow)"/><path class="cut" d="M360,105 l0,-32" marker-end="url(#arrow)"/><text x="28" y="60">X</text><text x="360" y="60">X</text><text x="20" y="260">Which result matches SECTION X–X?</text><text x="20" y="300">Result A</text><rect class="edge" x="70" y="320" width="260" height="55" fill="url(#hatch)"/><rect class="edge" x="105" y="320" width="30" height="55" fill="white"/><text x="20" y="420">Result B</text><rect class="edge" x="70" y="440" width="260" height="55" fill="url(#hatch)"/><rect class="edge" x="105" y="440" width="30" height="55" fill="white"/><rect class="edge" x="265" y="440" width="30" height="55" fill="white"/></svg>