<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">Half section of a hollow cylinder</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="470" fill="white"/><text x="20" y="28">1. Top view; remove one quarter</text><circle class="edge" cx="200" cy="150" r="95" fill="white"/><circle class="edge" cx="200" cy="150" r="30" fill="white"/><path class="cut" d="M200,270 V150 H320"/><path class="cut" d="M320,150 l0,-32" marker-end="url(#arrow)"/><path class="cut" d="M200,270 l-32,0" marker-end="url(#arrow)"/><text x="230" y="275">Remove quarter</text><text x="20" y="305">2. Exterior left; section right</text><rect class="edge" x="105" y="330" width="190" height="90" fill="white"/><rect class="edge" x="230" y="330" width="65" height="90" fill="url(#hatch)"/><path class="center" d="M200,318 V432"/><text x="20" y="453">The center line divides the two halves.</text></svg>