<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">Aligned section of a disk with radial holes</title><desc id="desc">Original schematic; labels and accompanying lesson explain the cut and resulting view.</desc><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#52677c" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#135b88"/></marker></defs><style>text{font:16px Arial,sans-serif;fill:#142c41}.edge{stroke:#142c41;stroke-width:2;stroke-linejoin:round}path.edge{fill:none}.cut{fill:none;stroke:#135b88;stroke-width:2.5;stroke-dasharray:16 4 3 4}.center{fill:none;stroke:#52677c;stroke-width:1;stroke-dasharray:14 4 3 4}.project{fill:none;stroke:#718699;stroke-width:1}.hidden{fill:none;stroke:#52677c;stroke-width:1.5;stroke-dasharray:6 4}</style><rect width="400" height="470" fill="white"/><text x="20" y="28">1. Disk; radial holes at different angles</text><circle class="edge" cx="200" cy="155" r="100" fill="white"/><circle class="edge" cx="200" cy="155" r="25" fill="white"/><circle class="edge" cx="130" cy="155" r="12" fill="white"/><circle class="edge" cx="249.5" cy="105.5" r="12" fill="white"/><path class="cut" d="M75,155 H200 L289,66"/><path class="cut" d="M75,155 l0,-32" marker-end="url(#arrow)"/><path class="cut" d="M289,66 l-23,-23" marker-end="url(#arrow)"/><text x="55" y="110">A</text><text x="305" y="60">A</text><path class="project" d="M249.5,105.5 A70,70 0 0 1 270,155"/><text x="235" y="275">Rotate plane</text><text x="20" y="295">2. SECTION A–A: radial cut aligned</text><rect class="edge" x="100" y="335" width="200" height="60" fill="url(#hatch)"/><rect class="edge" x="175" y="335" width="50" height="60" fill="white"/><rect class="edge" x="118" y="335" width="24" height="60" fill="white"/><rect class="edge" x="258" y="335" width="24" height="60" fill="white"/><text x="20" y="445">Angular spacing comes from the top view.</text></svg>