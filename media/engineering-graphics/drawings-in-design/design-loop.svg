<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="title">
<title id="title">Design graphics and the test-refine loop</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17354d"/></marker></defs>
<rect width="400" height="600" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#17354d"><text x="20" y="28" font-size="20" font-weight="bold">Graphics support each decision</text><rect x="25" y="50" width="320" height="70" rx="8" fill="#eef5fa" stroke="#17354d"/><text x="40" y="76" font-size="18" font-weight="bold">1. Define the need</text><text x="40" y="102">Task, limits, and requirements</text><path d="M185 120v27" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="150" width="320" height="70" rx="8" fill="#eef5fa" stroke="#17354d"/><text x="40" y="176" font-size="18" font-weight="bold">2. Explore ideas</text><text x="40" y="202">Quick sketches + labels</text><path d="M185 220v27" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="250" width="320" height="70" rx="8" fill="#eef5fa" stroke="#17354d"/><text x="40" y="276" font-size="18" font-weight="bold">3. Develop the design</text><text x="40" y="302">CAD model + draft drawings</text><path d="M185 320v27" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="350" width="320" height="70" rx="8" fill="#eef5fa" stroke="#17354d"/><text x="40" y="376" font-size="18" font-weight="bold">4. Test and refine</text><text x="40" y="402">Results guide design changes</text><path d="M185 420v27" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="450" width="320" height="70" rx="8" fill="#eef5fa" stroke="#17354d"/><text x="40" y="476" font-size="18" font-weight="bold">5. Check and release</text><text x="40" y="502">Approved model / drawing set</text><path d="M345 385H375V285H347" fill="none" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="552">Repeat testing after refinement.</text><text x="25" y="577">Return to sketches if the idea changes.</text></g></svg>