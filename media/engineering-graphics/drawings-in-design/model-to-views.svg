<svg xmlns="http://www.w3.org/2000/svg" width="400" height="690" viewBox="0 0 400 690" role="img" aria-labelledby="title">
<title id="title">Block model and aligned third-angle drawing views</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17354d"/></marker></defs>
<rect width="400" height="690" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#17354d"><text x="20" y="28" font-size="20" font-weight="bold">One model supplies linked views</text>
<text x="20" y="58">1. Select the model and orientation</text>
<path d="M110 110L170 78H290V148L230 180H110Z" fill="#dcebf5" stroke="#17354d" stroke-width="2"/>
<path d="M110 110H230L290 78M230 110V180" fill="none" stroke="#17354d" stroke-width="2"/>
<text x="20" y="214">2. Place a base view on the sheet</text>
<path d="M200 226v32" stroke="#17354d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="270" width="360" height="260" fill="#f8fafc" stroke="#17354d"/>
<text x="32" y="297">Third-angle example</text>
<path d="M65 330V465M185 330V465M65 395H310M65 465H310" stroke="#8b9aaa" stroke-dasharray="4 4" fill="none"/>
<rect x="65" y="330" width="120" height="45" fill="#dcebf5" stroke="#17354d" stroke-width="2"/>
<rect x="65" y="395" width="120" height="70" fill="#fff" stroke="#17354d" stroke-width="2"/>
<rect x="265" y="395" width="45" height="70" fill="#dcebf5" stroke="#17354d" stroke-width="2"/>
<text x="205" y="354">Top: projected</text><text x="48" y="493">Front: base</text><text x="230" y="493">Right:</text><text x="230" y="515">projected</text>
<text x="20" y="559">3. Add projected views from the base</text>
<text x="20" y="588">Front + top share width.</text><text x="20" y="613">Front + right share height.</text>
<text x="20" y="646">Views show shape; add requirements</text><text x="20" y="671">before using a drawing for manufacture.</text></g></svg>