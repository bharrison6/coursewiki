<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Fix: before and after</title><desc id="desc">A point can move relative to the origin. After Fix: it stays at its current location.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M53 130 L67 130"/><path d="M60 123 L60 137"/><circle cx="145" cy="85" r="5" fill="#002144"/><path d="M115 85 L175 85 M145 55 L145 115"/><text x="30" y="165" fill="#002144" stroke="none" font-size="17">point can move</text><g transform="translate(300 0)"><path d="M53 130 L67 130"/><path d="M60 123 L60 137"/><circle cx="145" cy="85" r="5" fill="#002144"/><path d="M137 72 V63 A8 8 0 0 1 153 63 V72 M132 72 H158 V95 H132 Z"/><text x="30" y="165" fill="#002144" stroke="none" font-size="17">point stays here</text></g></g></svg>