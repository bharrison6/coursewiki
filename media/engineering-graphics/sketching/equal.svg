<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Equal: before and after</title><desc id="desc">Two line segments have different lengths. After: their lengths match; their positions remain separate.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><path d="M35 70 L105 70"/><path d="M150 130 L250 130"/><g transform="translate(300 0)"><path d="M35 70 L135 70"/><path d="M150 130 L250 130"/><path d="M82 62 L88 78"/><path d="M197 122 L203 138"/></g></g></svg>