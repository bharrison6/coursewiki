<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
<title id="title">Tangent: before and after</title><desc id="desc">A line cuts across a circle. After: the line touches the circle with no crossing and is perpendicular to the radius there.</desc>
<rect width="600" height="220" rx="8" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#002144" font-size="20"><text x="25" y="29">Before</text><text x="325" y="29">After</text></g>
<path d="M300 40 V200" stroke="#bbb"/>
<g fill="none" stroke="#002144" stroke-width="3" stroke-linecap="round"><circle cx="135" cy="90" r="45"/><path d="M35 110 L245 110"/><g transform="translate(300 0)"><circle cx="135" cy="90" r="45"/><path d="M35 135 L245 135"/><path d="M135 90 L135 135" stroke-dasharray="7 5"/><circle cx="135" cy="135" r="5" fill="#002144"/></g></g></svg>