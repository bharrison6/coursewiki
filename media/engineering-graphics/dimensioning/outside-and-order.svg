<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 685" role="img" aria-labelledby="title desc"><title id="title">Outside placement and shortest-first dimension order</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="685" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><path d="M50 190h70v-60h85v60h125v100h-280z" class="part"/><path d="M460 190h70v-60h85v60h125v100h-280z" class="part"/><line x1="120" y1="125" x2="120" y2="93" class="thin" /><line x1="205" y1="125" x2="205" y2="93" class="thin" /><line x1="120" y1="100" x2="205" y2="100" class="dim" /><text x="162.5" y="92" font-size="18" text-anchor="middle" >.85</text><line x1="50" y1="185" x2="50" y2="58" class="thin" /><line x1="330" y1="185" x2="330" y2="58" class="thin" /><line x1="50" y1="65" x2="330" y2="65" class="dim" /><text x="190.0" y="57" font-size="18" text-anchor="middle" >2.80</text><line x1="530" y1="155" x2="615" y2="155" class="dim" /><text x="572.5" y="147" font-size="18" text-anchor="middle" >.85</text><line x1="460" y1="230" x2="740" y2="230" class="dim" /><text x="600.0" y="222" font-size="18" text-anchor="middle" >2.80</text><text x="24" y="320" font-size="18" text-anchor="start" >Outside: shape stays clear.</text><text x="434" y="320" font-size="18" text-anchor="start" >Inside: lines compete with the shape.</text><text x="24" y="375" font-size="20" text-anchor="start" font-weight="700">GOOD · clear connection</text><text x="434" y="375" font-size="20" text-anchor="start" font-weight="700">AVOID · harder to read</text><path d="M50 525h70v-60h85v60h125v100h-280z" class="part"/><path d="M460 525h70v-60h85v60h125v100h-280z" class="part"/><line x1="120" y1="460" x2="120" y2="431" class="thin" /><line x1="205" y1="460" x2="205" y2="431" class="thin" /><line x1="120" y1="438" x2="205" y2="438" class="dim" /><text x="162.5" y="430" font-size="18" text-anchor="middle" >.85</text><line x1="50" y1="520" x2="50" y2="396" class="thin" /><line x1="330" y1="520" x2="330" y2="396" class="thin" /><line x1="50" y1="403" x2="330" y2="403" class="dim" /><text x="190.0" y="395" font-size="18" text-anchor="middle" >2.80</text><line x1="460" y1="520" x2="460" y2="431" class="thin" /><line x1="740" y1="520" x2="740" y2="431" class="thin" /><line x1="460" y1="438" x2="740" y2="438" class="dim" /><text x="600.0" y="430" font-size="18" text-anchor="middle" >2.80</text><line x1="530" y1="460" x2="530" y2="396" class="thin" /><line x1="615" y1="460" x2="615" y2="396" class="thin" /><line x1="530" y1="403" x2="615" y2="403" class="dim" /><text x="572.5" y="395" font-size="18" text-anchor="middle" >.85</text><text x="24" y="655" font-size="18" text-anchor="start" >Shortest nearest; overall farther out.</text><text x="434" y="655" font-size="18" text-anchor="start" >Short extensions cross the long dimension.</text></svg>