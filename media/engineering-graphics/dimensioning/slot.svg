<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Two alternative dimension schemes for a semicircular-ended slot</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="370" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">OPTION A · width + overall length</text><text x="434" y="32" font-size="20" text-anchor="start" font-weight="700">OPTION B · radii + center spacing</text><rect x="55" y="130" width="270" height="75" rx="37.5" class="part"/><line x1="40" y1="167.5" x2="340" y2="167.5" class="axis" /><rect x="465" y="130" width="270" height="75" rx="37.5" class="part"/><line x1="450" y1="167.5" x2="750" y2="167.5" class="axis" /><line x1="55" y1="125" x2="55" y2="88" class="thin" /><line x1="325" y1="125" x2="325" y2="88" class="thin" /><line x1="55" y1="95" x2="325" y2="95" class="dim" /><text x="190.0" y="87" font-size="18" text-anchor="middle" >1.80</text><line x1="330" y1="130" x2="372" y2="130" class="thin" /><line x1="330" y1="205" x2="372" y2="205" class="thin" /><line x1="365" y1="130" x2="365" y2="205" class="dim" /><rect x="336" y="154.5" width="58" height="25" fill="white"/><text x="365" y="173.5" font-size="17" text-anchor="middle" >.50</text><line x1="455.5" y1="167.5" x2="549.5" y2="167.5" class="axis" /><line x1="502.5" y1="120.5" x2="502.5" y2="214.5" class="axis" /><line x1="650.5" y1="167.5" x2="744.5" y2="167.5" class="axis" /><line x1="697.5" y1="120.5" x2="697.5" y2="214.5" class="axis" /><line x1="502.5" y1="125" x2="502.5" y2="88" class="thin" /><line x1="697.5" y1="125" x2="697.5" y2="88" class="thin" /><line x1="502.5" y1="95" x2="697.5" y2="95" class="dim" /><text x="600.0" y="87" font-size="18" text-anchor="middle" >1.30</text><path d="M 724.02 140.98 L 615 250 h 15" class="lead"/><text x="635" y="256" font-size="18" text-anchor="start" >2X R.25</text><text x="24" y="300" font-size="18" text-anchor="start" >Use one scheme, then add location, direction and end condition.</text><text x="24" y="340" font-size="18" text-anchor="start" >1.80 overall − .50 width = 1.30 center spacing. Do not control all three.</text></svg>