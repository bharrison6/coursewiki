<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 825" role="img" aria-labelledby="title desc"><title id="title">A three-stage dimension audit</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="825" fill="white"/><text x="24" y="40" font-size="20" text-anchor="start" font-weight="700">1. Size the body</text><rect x="90" y="95" width="240.0" height="135.0" class="part"/><circle cx="157.5" cy="181.25" r="15.0" class="part"/><line x1="132.5" y1="181.25" x2="182.5" y2="181.25" class="axis" /><line x1="157.5" y1="156.25" x2="157.5" y2="206.25" class="axis" /><line x1="90" y1="90" x2="90" y2="58" class="thin" /><line x1="330" y1="90" x2="330" y2="58" class="thin" /><line x1="90" y1="65" x2="330" y2="65" class="dim" /><text x="210.0" y="57" font-size="18" text-anchor="middle" >3.20</text><line x1="335" y1="95" x2="392" y2="95" class="thin" /><line x1="335" y1="230" x2="392" y2="230" class="thin" /><line x1="385" y1="95" x2="385" y2="230" class="dim" /><rect x="356" y="149.5" width="58" height="25" fill="white"/><text x="385" y="168.5" font-size="17" text-anchor="middle" >1.80</text><text x="455" y="105" font-size="18" text-anchor="start" >Thickness .30 (edge view)</text><text x="455" y="145" font-size="18" text-anchor="start" >Body: 3.20 × 1.80 × .30</text><text x="455" y="185" font-size="18" text-anchor="start" >Rectangular solid</text><text x="24" y="305" font-size="20" text-anchor="start" font-weight="700">2. Size the feature</text><rect x="90" y="360" width="240.0" height="135.0" class="part"/><circle cx="157.5" cy="446.25" r="15.0" class="part"/><line x1="132.5" y1="446.25" x2="182.5" y2="446.25" class="axis" /><line x1="157.5" y1="421.25" x2="157.5" y2="471.25" class="axis" /><line x1="90" y1="355" x2="90" y2="323" class="thin" /><line x1="330" y1="355" x2="330" y2="323" class="thin" /><line x1="90" y1="330" x2="330" y2="330" class="dim" /><text x="210.0" y="322" font-size="18" text-anchor="middle" >3.20</text><line x1="335" y1="360" x2="392" y2="360" class="thin" /><line x1="335" y1="495" x2="392" y2="495" class="thin" /><line x1="385" y1="360" x2="385" y2="495" class="dim" /><rect x="356" y="414.5" width="58" height="25" fill="white"/><text x="385" y="433.5" font-size="17" text-anchor="middle" >1.80</text><text x="455" y="370" font-size="18" text-anchor="start" >Thickness .30 (edge view)</text><path d="M 168.88 456.02 L 240 517 h 15" class="lead"/><text x="260" y="523" font-size="18" text-anchor="start" >⌀.40 THRU</text><text x="455" y="410" font-size="18" text-anchor="start" >Hole diameter: .40</text><text x="455" y="450" font-size="18" text-anchor="start" >End condition: through</text><text x="24" y="570" font-size="20" text-anchor="start" font-weight="700">3. Locate the feature</text><rect x="90" y="625" width="240.0" height="135.0" class="part"/><circle cx="157.5" cy="711.25" r="15.0" class="part"/><line x1="132.5" y1="711.25" x2="182.5" y2="711.25" class="axis" /><line x1="157.5" y1="686.25" x2="157.5" y2="736.25" class="axis" /><line x1="90" y1="620" x2="90" y2="588" class="thin" /><line x1="330" y1="620" x2="330" y2="588" class="thin" /><line x1="90" y1="595" x2="330" y2="595" class="dim" /><text x="210.0" y="587" font-size="18" text-anchor="middle" >3.20</text><line x1="335" y1="625" x2="392" y2="625" class="thin" /><line x1="335" y1="760" x2="392" y2="760" class="thin" /><li