<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 615" role="img" aria-labelledby="title desc"><title id="title">Spotface symbol and legacy hole-note vocabulary</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="615" fill="white"/><text x="24" y="32" font-size="20" text-anchor="start" font-weight="700">SPOTFACE · a local flat seat</text><path d="M55 115H125V151H155V235H55Z" class="part"/><path d="M245 115H315V235H215V151H245Z" class="part"/><line x1="63" y1="123" x2="58" y2="143" class="thin" /><line x1="269.0" y1="197" x2="264.0" y2="217" class="thin" /><line x1="83" y1="123" x2="78" y2="143" class="thin" /><line x1="279.0" y1="197" x2="274.0" y2="217" class="thin" /><line x1="103" y1="123" x2="98" y2="143" class="thin" /><line x1="289.0" y1="197" x2="284.0" y2="217" class="thin" /><line x1="185" y1="95" x2="185" y2="250" class="axis" /><text x="390" y="100" font-size="18" text-anchor="start" >⌀.30 THRU</text><path d="M390 122v25h34v-25" class="thin"/><text x="407" y="141" font-size="14" text-anchor="middle" >SF</text><text x="438" y="143" font-size="18" text-anchor="start" >⌀.70</text><text x="390" y="190" font-size="18" text-anchor="start" >Depth only as needed to clean up,</text><text x="390" y="220" font-size="18" text-anchor="start" >unless depth or remaining thickness</text><text x="390" y="250" font-size="18" text-anchor="start" >is specified. Sketch depth exaggerated.</text><text x="24" y="320" font-size="20" text-anchor="start" font-weight="700">LEGACY WORDS</text><text x="434" y="320" font-size="20" text-anchor="start" font-weight="700">SYMBOL NOTATION</text><text x="35" y="365" font-size="18" text-anchor="start" >.30 DIA</text><text x="445" y="365" font-size="18" text-anchor="start" >⌀.30</text><line x1="365" y1="360" x2="415" y2="360" class="thin" marker-end="url(#a)"/><text x="35" y="415" font-size="18" text-anchor="start" >.30 DIA × .55 DP</text><text x="445" y="415" font-size="18" text-anchor="start" >⌀.30 ↧ .55</text><line x1="365" y1="410" x2="415" y2="410" class="thin" marker-end="url(#a)"/><text x="35" y="465" font-size="18" text-anchor="start" >C&#x27;BORE .60 DIA × .15 DP</text><text x="445" y="465" font-size="18" text-anchor="start" >⌴ ⌀.60 ↧ .15</text><line x1="365" y1="460" x2="415" y2="460" class="thin" marker-end="url(#a)"/><text x="35" y="515" font-size="18" text-anchor="start" >C&#x27;SINK .60 DIA × 90°</text><text x="445" y="515" font-size="18" text-anchor="start" >⌵ ⌀.60 × 90°</text><line x1="365" y1="510" x2="415" y2="510" class="thin" marker-end="url(#a)"/><text x="24" y="585" font-size="18" text-anchor="start" >These translations illustrate vocabulary. Always read the complete note and its views.</text></svg>