<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 605" role="img" aria-labelledby="title desc"><title id="title">Six independent dimensions for a plate with one hole</title><desc id="desc">Original teaching diagram. Dimensions are illustrative, not a complete production drawing.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#002144"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#002144}.part{fill:none;stroke:#1F1E1C;stroke-width:2.7}.thin,.dim,.lead{fill:none;stroke:#002144;stroke-width:1.4}.dim{marker-start:url(#a);marker-end:url(#a)}.lead{marker-start:url(#a)}.axis{stroke:#565350;stroke-width:1;stroke-dasharray:14 4 3 4}.hidden{fill:none;stroke:#565350;stroke-width:1.5;stroke-dasharray:7 5}</style><rect width="820" height="605" fill="white"/><text x="24" y="34" font-size="20" text-anchor="start" font-weight="700">SIZE · rectangular body and cylindrical opening</text><rect x="80" y="105" width="240.0" height="135.0" class="part"/><circle cx="147.5" cy="191.25" r="15.0" class="part"/><line x1="122.5" y1="191.25" x2="172.5" y2="191.25" class="axis" /><line x1="147.5" y1="166.25" x2="147.5" y2="216.25" class="axis" /><line x1="80" y1="100" x2="80" y2="68" class="thin" /><line x1="320" y1="100" x2="320" y2="68" class="thin" /><line x1="80" y1="75" x2="320" y2="75" class="dim" /><text x="200.0" y="67" font-size="18" text-anchor="middle" >3.20</text><line x1="325" y1="105" x2="377" y2="105" class="thin" /><line x1="325" y1="240" x2="377" y2="240" class="thin" /><line x1="370" y1="105" x2="370" y2="240" class="dim" /><rect x="341" y="159.5" width="58" height="25" fill="white"/><text x="370" y="178.5" font-size="17" text-anchor="middle" >1.80</text><path d="M 158.88 201.02 L 245 275 h 15" class="lead"/><text x="265" y="281" font-size="18" text-anchor="start" >⌀.40 THRU</text><rect x="490" y="105" width="240" height="22.5" class="part"/><line x1="735" y1="105" x2="777" y2="105" class="thin" /><line x1="735" y1="127.5" x2="777" y2="127.5" class="thin" /><line x1="770" y1="80" x2="770" y2="105" class="thin" marker-end="url(#a)"/><line x1="770" y1="155" x2="770" y2="127.5" class="thin" marker-end="url(#a)"/><text x="785" y="123" font-size="17">.30</text><text x="490" y="160" font-size="18" text-anchor="start" >Edge view: thickness</text><text x="24" y="340" font-size="20" text-anchor="start" font-weight="700">LOCATION · two center coordinates</text><rect x="80" y="385" width="240.0" height="135.0" class="part"/><circle cx="147.5" cy="471.25" r="15.0" class="part"/><line x1="122.5" y1="471.25" x2="172.5" y2="471.25" class="axis" /><line x1="147.5" y1="446.25" x2="147.5" y2="496.25" class="axis" /><line x1="80" y1="525" x2="80" y2="562" class="thin" /><line x1="147.5" y1="525" x2="147.5" y2="562" class="thin" /><line x1="80" y1="555" x2="147.5" y2="555" class="dim" /><text x="113.75" y="547" font-size="18" text-anchor="middle" >.90</text><line x1="325" y1="471.25" x2="372" y2="471.25" class="thin" /><line x1="325" y1="520" x2="372" y2="520" class="thin" /><line x1="365" y1="471.25" x2="365" y2="520" class="dim" /><rect x="336" y="482.625" width="58" height="25" fill="white"/><text x="365" y="501.625" font-size="17" text-anchor="middle" >.65</text><line x1="172" y1="471.25" x2="372" y2="471.25" class="axis" /><text x="455" y="407" font-size="18" text-anchor="start" >Body size: 3 numbers</text><text x="455" y="447" font-size="18" text-anchor="start" >Hole size: 1 diameter</text><text x="455" y="487" font-size="18" text-anchor="start" >Hole location: 2 coordinates</text><text x="455" y="535" font-size="18" text-anchor="start" >End condition: THRU</text><text x="455" y="575" font-size="18" text-anchor="start" >All values in inches.</text></svg>