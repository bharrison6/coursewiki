<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Compare overlapping, touching, and separated parts</title><rect width="640" height="220" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="28" font-size="22" fill="#172b3a" stroke="none">Clearance is not the same as no interference</text><rect x="25" y="85" width="70" height="65" fill="#d9edf5"/><rect x="77" y="85" width="70" height="65" fill="#f4d88c"/><text x="25" y="190" font-size="18" fill="#172b3a" stroke="none">Overlap</text><rect x="77" y="85" width="18" height="65" fill="#cc7755"/><rect x="235" y="85" width="70" height="65" fill="#d9edf5"/><rect x="305" y="85" width="70" height="65" fill="#f4d88c"/><text x="235" y="190" font-size="18" fill="#172b3a" stroke="none">Touching</text><rect x="445" y="85" width="70" height="65" fill="#d9edf5"/><rect x="540" y="85" width="70" height="65" fill="#f4d88c"/><text x="445" y="190" font-size="18" fill="#172b3a" stroke="none">Clearance</text><line x1="515" y1="165" x2="540" y2="165" /><text x="513" y="205" font-size="14" fill="#172b3a" stroke="none">gap</text></g></svg>