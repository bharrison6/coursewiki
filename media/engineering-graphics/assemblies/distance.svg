<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Distance between parallel faces</title><rect width="640" height="220" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="26" font-size="21" fill="#172b3a" stroke="none">Distance between parallel faces</text><text x="25" y="55" font-size="15" fill="#172b3a" stroke="none">Before</text><text x="350" y="55" font-size="15" fill="#172b3a" stroke="none">After</text><line x1="310" y1="50" x2="310" y2="170" stroke="#a7b2ba" stroke-dasharray="5 5"/><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><line x1="60" y1="80" x2="240" y2="80" /><text x="130" y="120" font-size="19" fill="#172b3a" stroke="none">?</text><g transform="translate(325 0)"><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><line x1="60" y1="95" x2="240" y2="95" /><line x1="270" y1="95" x2="270" y2="150" /><line x1="260" y1="95" x2="280" y2="95" /><line x1="260" y1="150" x2="280" y2="150" /><text x="280" y="128" font-size="18" fill="#172b3a" stroke="none">d</text></g><text x="20" y="200" font-size="15" fill="#172b3a" stroke="none">The specified gap d is measured normal to the planes.</text></g></svg>