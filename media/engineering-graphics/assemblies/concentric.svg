<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Concentric cylindrical axes</title><rect width="640" height="220" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="26" font-size="21" fill="#172b3a" stroke="none">Concentric cylindrical axes</text><text x="25" y="55" font-size="15" fill="#172b3a" stroke="none">Before</text><text x="350" y="55" font-size="15" fill="#172b3a" stroke="none">After</text><line x1="310" y1="50" x2="310" y2="170" stroke="#a7b2ba" stroke-dasharray="5 5"/><rect x="35" y="110" width="225" height="40" fill="#d9edf5"/><line x1="25" y1="130" x2="275" y2="130" stroke-dasharray="6 5"/><rect x="80" y="65" width="145" height="20" fill="#f4d88c"/><line x1="65" y1="75" x2="240" y2="75" stroke-dasharray="6 5"/><g transform="translate(325 0)"><rect x="35" y="110" width="225" height="40" fill="#d9edf5"/><rect x="80" y="120" width="145" height="20" fill="#f4d88c"/><line x1="25" y1="130" x2="275" y2="130" stroke-dasharray="6 5"/><text x="80" y="91" font-size="14" fill="#172b3a" stroke="none">shared axis</text></g><text x="20" y="200" font-size="15" fill="#172b3a" stroke="none">Axial slide and spin remain unless separately constrained.</text></g></svg>