<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title"><title id="title">Tangent curved surface and plane</title><rect width="640" height="220" fill="white"/><g font-family="Arial, sans-serif" stroke="#172b3a" stroke-width="3" stroke-linecap="round"><text x="20" y="26" font-size="21" fill="#172b3a" stroke="none">Tangent curved surface and plane</text><text x="25" y="55" font-size="15" fill="#172b3a" stroke="none">Before</text><text x="350" y="55" font-size="15" fill="#172b3a" stroke="none">After</text><line x1="310" y1="50" x2="310" y2="170" stroke="#a7b2ba" stroke-dasharray="5 5"/><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><circle cx="150" cy="95" r="30" fill="white"/><g transform="translate(325 0)"><line x1="35" y1="150" x2="265" y2="150" stroke="#006b90"/><circle cx="150" cy="120" r="30" fill="white"/><circle cx="150" cy="150" r="4" fill="#a95200"/></g><text x="20" y="200" font-size="15" fill="#172b3a" stroke="none">Tangency sets contact; it does not enforce rolling without slip.</text></g></svg>