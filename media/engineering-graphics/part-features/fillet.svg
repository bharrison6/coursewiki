<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">A rounded outside corner in section</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Sharp edge; 2. Radius; 3. Rounded edge. Section view; Round the transition; Curved boundary</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Sharp edge</text><g transform="translate(0 40)"><path d="M30 130 V25 H150 V130 Z" fill="#dbe9f2" /><path d="M30 25 L90 25" fill="none" stroke="#b05018" stroke-width="4"/><path d="M30 25 L30 85" fill="none" stroke="#b05018" stroke-width="4"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section view</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Radius</text><g transform="translate(0 40)"><path d="M30 130 V25 H150 V130 Z" fill="#dbe9f2" /><path d="M30 70 A45 45 0 0 1 75 25" fill="none" /><path d="M75 70 L43 38" fill="none" /><text x="92" y="79" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">R</text></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Round the transition</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Rounded edge</text><g transform="translate(0 40)"><path d="M30 130 V70 A45 45 0 0 1 75 25 H150 V130 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Curved boundary</text></g></g></svg>