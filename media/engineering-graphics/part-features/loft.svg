<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Ordered sections define a loft</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Profiles; 2. Guide + order; 3. Transition. Separate planes; Guide meets sections; Changing section</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Profiles</text><g transform="translate(0 40)"><ellipse cx="90" cy="120" rx="65" ry="16" fill="none" /><ellipse cx="90" cy="75" rx="43" ry="12" fill="none" /><ellipse cx="90" cy="25" rx="22" ry="8" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Separate planes</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Guide + order</text><g transform="translate(0 40)"><ellipse cx="90" cy="120" rx="65" ry="16" fill="none" /><ellipse cx="90" cy="75" rx="43" ry="12" fill="none" /><ellipse cx="90" cy="25" rx="22" ry="8" fill="none" /><path d="M25 120 Q58 66 68 25" fill="none" stroke="#b05018" stroke-width="3"/><text x="167" y="125" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">1</text><text x="145" y="80" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">2</text><text x="130" y="30" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">3</text></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Guide meets sections</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">