<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">A chamfered outside corner in section</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Sharp edge; 2. Setbacks; 3. Beveled edge. Section view; Two equal distances; Straight boundary</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Sharp edge</text><g transform="translate(0 40)"><path d="M30 130 V25 H150 V130 Z" fill="#dbe9f2" /><path d="M30 25 L90 25" fill="none" stroke="#b05018" stroke-width="4"/><path d="M30 25 L30 85" fill="none" stroke="#b05018" stroke-width="4"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Section view</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Setbacks</text><g transform="translate(0 40)"><path d="M30 130 V25 H150 V130 Z" fill="#dbe9f2" /><path d="M30 70 L75 25" fill="none" /><path d="M30 12 L75 12" fill="none" /><path d="M17 25 L17 70" fill="none" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Two equal distances</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Beveled edge</text><g transform="translate(0 40)"><path d="M30 130 V70 L75 25 H150 V130 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Straight boundary</text></g></g></svg>