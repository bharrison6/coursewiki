<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Revolving an offset section</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Section + axis; 2. Rotate; 3. Sleeve. Gap becomes bore; Full turn; Axis through bore</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Section + axis</text><g transform="translate(0 40)"><path d="M90 5 L90 140" fill="none" stroke-dasharray="7 5"/><rect x="110" y="40" width="35" height="80" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Gap becomes bore</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Rotate</text><g transform="translate(0 40)"><path d="M90 5 L90 140" fill="none" stroke-dasharray="7 5"/><rect x="110" y="40" width="35" height="80" fill="#dbe9f2" /><path d="M40 65 C10 10 160 0 165 60" fill="none" /><path d="M158 51 L165 60 L169 49" fill="none" /><text x="68" y="27" stroke="none" fill="#152d43" font-size="16" text-anchor="middle">360°</text></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Full turn</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Sleeve</text><g transform="translate(0 40)"><rect x="35" y="40" width="110" height="80" fill="#dbe9f2" /><ellipse cx="90" cy="120" rx="55" ry="15" fill="#dbe9f2" /><rect x="35" y="40" width="110" height="80" fill="#dbe9f2" /><ellipse cx="90" cy="40" rx="55" ry="15" fill="#adcbdc" /><ellipse cx="90" cy="40" rx="28" ry="8" fill="#fff" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Axis through bore</text></g></g></svg>