<svg xmlns="http://www.w3.org/2000/svg" width="400" height="472" viewBox="0 0 400 472" role="img" aria-labelledby="title desc"><title id="title">Reflection changes handedness</title><desc id="desc">Read steps 1 and 2 across the top, then step 3 below. 1. Select tab; 2. Mirror plane; 3. Reflected tab. Asymmetric seed; Center plane; Equal distances</desc><rect width="400" height="472" fill="#fff"/><g stroke="#152d43" stroke-width="2" stroke-linejoin="round" font-family="Arial, sans-serif"><g transform="translate(10 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">1. Select tab</text><g transform="translate(0 40)"><path d="M25 35 H45 V100 H70 V120 H25 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Asymmetric seed</text></g><path d="M185 107 h28 l-7 -6 m7 6 l-7 6" fill="none"/><g transform="translate(210 0)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">2. Mirror plane</text><g transform="translate(0 40)"><path d="M25 35 H45 V100 H70 V120 H25 Z" fill="#dbe9f2" /><path d="M90 15 L90 140" fill="none" stroke-dasharray="6 5"/></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Center plane</text></g><path d="M300 217 V235 H200 V250 l-6 -7 m6 7 l6 -7" fill="none"/><g transform="translate(110 250)"><text x="90" y="27" stroke="none" fill="#152d43" font-size="18" text-anchor="middle">3. Reflected tab</text><g transform="translate(0 40)"><path d="M25 35 H45 V100 H70 V120 H25 Z" fill="#dbe9f2" /><path d="M90 15 L90 140" fill="none" stroke-dasharray="6 5"/><path d="M155 35 H135 V100 H110 V120 H155 Z" fill="#dbe9f2" /></g><text x="90" y="204" stroke="none" fill="#152d43" font-size="15" text-anchor="middle">Equal distances</text></g></g></svg>