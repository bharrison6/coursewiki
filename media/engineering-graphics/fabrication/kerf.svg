<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Kerf compensation toward waste</title>
  <desc id="desc">A dashed cutting path is centered in a wide kerf band. For an outside part the band lies outside the desired boundary; for a hole it lies inside. Offset from the desired edge is half the kerf.</desc>
  <rect width="400" height="520" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#102e4a">
    <text x="20" y="28" font-size="20">Outside part: path outside</text>
    <rect x="92" y="62" width="216" height="116" fill="#d9edf5" stroke="#edc77e" stroke-width="24"/>
    <rect x="104" y="74" width="192" height="92" fill="none" stroke="#102e4a" stroke-width="2"/>
    <rect x="92" y="62" width="216" height="116" fill="none" stroke="#102e4a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="153" y="125">Keep part</text>
    <text x="20" y="210">Path width = finished width + kerf</text>
    <text x="20" y="260" font-size="20">Opening: path inside</text>
    <rect x="60" y="280" width="280" height="150" fill="#d9edf5"/>
    <rect x="104" y="304" width="192" height="102" fill="#fff"/>
    <rect x="116" y="316" width="168" height="78" fill="none" stroke="#edc77e" stroke-width="24"/>
    <rect x="104" y="304" width="192" height="102" fill="none" stroke="#102e4a" stroke-width="2"/>
    <rect x="116" y="316" width="168" height="78" fill="none" stroke="#102e4a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="143" y="361">Remove waste</text>
    <text x="20" y="458">Path width = finished width − kerf</text>
    <text x="20" y="488">Dashed path; gold band = kerf.</text>
    <text x="20" y="510">Offset at each edge = half the kerf.</text>
  </g>
</svg>
