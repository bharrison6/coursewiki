<svg xmlns="http://www.w3.org/2000/svg" width="400" height="510" viewBox="0 0 400 510" role="img" aria-labelledby="title desc">
  <title id="title">Layers, supports, walls, and infill</title>
  <desc id="desc">Side view of a layered overhang on temporary supports, followed by a top slice with two perimeter walls and sparse infill.</desc>
  <rect width="400" height="510" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#102e4a">
    <text x="20" y="28" font-size="20">Side view: build upward</text>
    <path d="M45 208H350" stroke="#102e4a" stroke-width="5"/>
    <path d="M65 200V110H305V140H155V200Z" fill="#d9edf5" stroke="#102e4a" stroke-width="2"/>
    <path d="M65 120H305M65 130H305M65 140H155M65 150H155M65 160H155M65 170H155M65 180H155M65 190H155" stroke="#102e4a"/>
    <path d="M180 200V145M205 200V145M230 200V145M255 200V145M280 200V145" stroke="#a86500" stroke-width="5" stroke-dasharray="5 3"/>
    <text x="20" y="69">Layers</text><path d="M74 75L90 110" fill="none" stroke="#102e4a"/>
    <text x="200" y="69">Overhang</text><path d="M248 77V107" stroke="#102e4a"/>
    <text x="20" y="238">Build surface</text>
    <text x="190" y="238">Temporary supports</text><path d="M235 222V202" stroke="#a86500"/>
    <text x="20" y="290" font-size="20">Top view: one slice</text>
    <rect x="45" y="315" width="190" height="140" fill="#d9edf5" stroke="#102e4a" stroke-width="4"/>
    <rect x="53" y="323" width="174" height="124" fill="#fff" stroke="#102e4a" stroke-width="3"/>
    <path d="M54 350H226M54 385H226M54 420H226M87 324V446M122 324V446M157 324V446M192 324V446" stroke="#23728c" stroke-width="2"/>
    <text x="252" y="339">Walls</text><path d="M245 335H228" stroke="#102e4a"/>
    <text x="252" y="390">Infill</text><path d="M245 386H195" stroke="#102e4a"/>
    <text x="20" y="489">Schematic; spacing exaggerated.</text>
  </g>
</svg>
