<svg xmlns="http://www.w3.org/2000/svg" width="400" height="890" viewBox="0 0 400 890" role="img" aria-labelledby="title"><title id="title">Match front face A and sloping face B across pictorial, front, top and right views</title><rect width="400" height="890" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#18354b"><text x="20" y="28">Pictorial: corner removed through depth</text><polygon points="145.00,180.00 259.32,246.00 259.32,202.00 221.21,136.00 145.00,92.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><polygon points="259.32,246.00 335.53,202.00 335.53,158.00 259.32,202.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="221.21,136.00 259.32,202.00 335.53,158.00 297.42,92.00" fill="#ffe6a1" stroke="#18354b" stroke-width="2" /><polygon points="145.00,92.00 221.21,136.00 297.42,92.00 221.21,48.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><text x="186.91562936" y="173.39999999999998">A</text><text x="276.46265572000004" y="143.7">B</text><text x="20" y="315">A = front face; B = sloping face</text><text x="20" y="350">Front (width × height)</text><polygon points="90.00,465.00 240.00,465.00 240.00,415.00 190.00,365.00 90.00,365.00" fill="#dbeaf4" stroke="#18354b" stroke-width="2" /><text x="135" y="435">A</text><text x="255" y="385">B edge</text><path d="M250,387 L220,395" fill="none" stroke="#18354b" stroke-width="2" /><text x="20" y="510">Top (width × depth; front at bottom)</text><polygon points="90.00,535.00 240.00,535.00 240.00,635.00 90.00,635.00" fill="#edf3f7" stroke="#18354b" stroke-width="2" /><polygon points="190.00,535.00 240.00,535.00 240.00,635.00 190.00,635.00" fill="#ffe6a1" stroke="#18354b" stroke-width="2" /><text x="207" y="590">B</text><path d="M90,635 L240,635" fill="none" stroke="#18354b" stroke-width="2" style="stroke:#a33a00;stroke-width:4"/><text x="110" y="660">A edge</text><text x="20" y="700">Right (depth × height; front at left)</text><polygon points="100.00,725.00 200.00,725.00 200.00,825.00 100.00,825.00" fill="#c4d7e4" stroke="#18354b" stroke-width="2" /><polygon points="100.00,725.00 200.00,725.00 200.00,775.00 100.00,775.00" fill="#ffe6a1" stroke="#18354b" stroke-width="2" /><text x="140" y="758">B</text><path d="M100,725 L100,825" fill="none" stroke="#18354b" stroke-width="2" style="stroke:#a33a00;stroke-width:4"/><text x="25" y="810">A edge</text><text x="20" y="865">Named views are stacked, not a sheet layout.</text></g></svg>
