<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title">
  <title id="title">Saw tooth pitch, gullet, and set</title>
  <rect width="800" height="650" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="32" fill="#14263d" stroke-linejoin="round">
    <text x="32" y="44" font-weight="bold">SIDE VIEW: pitch and gullet</text>
    <g transform="translate(40 60)">
<path d="M40 180V100 L90 140 L110 140 L140 100 L190 140 L210 140 L240 100 L290 140 L310 140 L340 100 L390 140 L410 140 L440 100 L490 140 L510 140 L540 100 L590 140 L610 140 L640 100 V180Z" fill="#dbe5ef" stroke="#14263d" stroke-width="3" />
<path d="M140 93V55 M240 93V55 M140 62H240 M148 57L140 62L148 67 M232 57L240 62L232 67" fill="none" stroke="#14263d" stroke-width="2" />
<path d="M400 138L460 62H545" fill="none" stroke="#14263d" stroke-width="2" />
    </g>
    <text x="230" y="108" text-anchor="middle" stroke="#fff" stroke-width="6" paint-order="stroke fill">Pitch</text>
    <text x="592" y="128" stroke="#fff" stroke-width="6" paint-order="stroke fill">Gullet</text>
    <text x="32" y="294" font-weight="bold">EDGE VIEW: sideways set</text>
    <text x="32" y="336">(exaggerated)</text>
    <g transform="translate(40 100)">
<rect x="60" y="283" width="440" height="16" fill="#dbe5ef" stroke="#14263d" stroke-width="2" />
<path d="M95 291L115 255 M155 291L175 327 M215 291H235 M275 291L295 255 M335 291L355 327 M395 291H415 M455 291L475 255" stroke="#14263d" stroke-width="7" />
<path d="M55 251H520 M55 331H520" stroke="#586775" stroke-dasharray="6 5" />
    </g>
    <path d="M560 351H625 M540 391H625 M560 431H625" fill="none" stroke="#14263d" stroke-width="2"/>
    <text x="600" y="362" font-weight="bold" stroke="#fff" stroke-width="6" paint-order="stroke fill">1</text>
    <text x="600" y="402" font-weight="bold" stroke="#fff" stroke-width="6" paint-order="stroke fill">2</text>
    <text x="600" y="442" font-weight="bold" stroke="#fff" stroke-width="6" paint-order="stroke fill">3</text>
    <text x="32" y="492">1. Set to one side</text>
    <text x="430" y="492">2. Blade body</text>
    <text x="32" y="536">3. Set to other side</text>
    <text x="32" y="594">Set provides a kerf</text>
    <text x="32" y="636">wider than the body.</text>
  </g>
</svg>
