<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Lathe coordinates in diameter mode</title><desc id="desc">A 28 mm diameter bar extends left from the face. Work zero lies at the face on the spindle centreline. X28 is 14 mm radially from that line; positive Z is right.</desc>
<rect width="800" height="520" fill="#fff"/><g font-family="Arial,sans-serif" font-size="32" fill="#142d4e">
<text x="30" y="45">Diameter mode · side view</text>
<rect x="55" y="135" width="115" height="260" fill="#c8d0da" stroke="#142d4e" stroke-width="3"/>
<rect x="170" y="185" width="330" height="160" fill="#e5edf3" stroke="#142d4e" stroke-width="4"/>
<path d="M25 265H740 M500 265V80" stroke="#142d4e" stroke-width="3" stroke-dasharray="12 8" fill="none"/>
<path d="M725 255L745 265L725 275 M490 100L500 80L510 100" stroke="#142d4e" stroke-width="4" fill="none"/>
<text x="665" y="245">+Z</text><text x="520" y="105">+X outward</text>
<circle cx="500" cy="265" r="7" fill="#a63800"/>
<path d="M500 185H630 M500 265H630 M615 185V265 M606 195L615 185L624 195 M606 255L615 265L624 255" stroke="#006493" stroke-width="3" fill="none"/>
<text x="640" y="195">14 mm</text><text x="190" y="165">Ø28 → X28</text>
<path d="M505 275L560 370" stroke="#a63800" stroke-width="3"/><text x="390" y="410">Face: Z0</text><text x="390" y="453">Work zero: X0 Z0</text>
<text x="35" y="445">Headstock</text><text x="35" y="485">Centreline →</text>
</g></svg>
