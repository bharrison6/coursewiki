<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="t d">
  <title id="t">3-2-1 locating contacts and clamp directions</title>
  <desc id="d">A transparent rectangular block has three A supports underneath, two B contacts at the rear side and one C contact at its left end. Arrows push down, back and left toward these contacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9c4100"/>
    </marker>
  </defs>
  <rect width="800" height="720" fill="#fff"/>
  <!-- The contact key sits below the drawing. -->
  <g transform="translate(0 40)">
    <g stroke="#002144" stroke-width="2" fill="#e8edf2" fill-opacity="0.5">
      <path d="M200 220L460 220L590 140L330 140Z"/>
      <path d="M200 220L460 220L460 360L200 360Z"/>
      <path d="M460 220L590 140L590 280L460 360Z"/>
      <path d="M200 360L330 280L590 280 M330 280V140" fill="none" stroke-dasharray="6 5"/>
    </g>
    <g stroke="#002144" stroke-width="2">
      <g fill="#b9deef">
        <circle cx="245" cy="340" r="23"/>
        <circle cx="420" cy="340" r="23"/>
        <circle cx="395" cy="290" r="23"/>
      </g>
      <g fill="#f5dc9a">
        <circle cx="365" cy="240" r="23"/>
        <circle cx="535" cy="240" r="23"/>
      </g>
      <circle cx="260" cy="290" r="23" fill="#ddd"/>
    </g>
    <g stroke="#9c4100" stroke-width="4" marker-end="url(#arrow)">
      <path d="M395 60V175"/>
      <path d="M360 405L410 373"/>
      <path d="M660 260H570"/>
    </g>
    <g font-family="sans-serif" font-size="32" fill="#002144" stroke="#fff" stroke-width="4" paint-order="stroke fill" stroke-linejoin="round">
      <g text-anchor="middle">
        <text x="245" y="351">A</text>
        <text x="420" y="351">A</text>
        <text x="395" y="301">A</text>
        <text x="365" y="251">B</text>
        <text x="535" y="251">B</text>
        <text x="260" y="301">C</text>
      </g>
      <text x="420" y="80">Down to A</text>
      <text x="405" y="430">Back to B</text>
      <text x="610" y="230">Left to C</text>
    </g>
  </g>
  <g font-family="sans-serif" font-size="32" fill="#002144">
    <text x="30" y="45">Hidden contacts shown through block.</text>
    <text x="30" y="535">A: primary XY — 3 supports underneath</text>
    <text x="30" y="580">B: secondary XZ — 2 rear contacts</text>
    <text x="30" y="625">C: tertiary YZ — 1 left-end contact</text>
    <text x="30" y="690">Schematic; not a fixture design.</text>
  </g>
</svg>
