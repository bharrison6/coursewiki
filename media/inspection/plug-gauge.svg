<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d">
  <title id="t">Plain GO and NO-GO plug gauge</title>
  <desc id="d">The GO plug is smaller in diameter and checks the lower hole limit. The NO-GO plug is larger and checks the upper hole limit.</desc>
  <rect width="800" height="430" fill="#fff"/>
  <g stroke="#002144" stroke-width="3">
    <rect x="280" y="160" width="240" height="60" rx="12" fill="#e8edf2"/>
    <rect x="110" y="145" width="170" height="90" fill="#b9deef"/>
    <rect x="520" y="125" width="120" height="130" fill="#f5dc9a"/>
  </g>
  <g font-family="sans-serif" font-size="32" fill="#002144" text-anchor="middle">
    <text x="195" y="45">GO</text>
    <text x="195" y="85">Smaller diameter</text>
    <text x="580" y="45">NO-GO</text>
    <text x="580" y="85">Larger diameter</text>
    <text x="400" y="201">Handle</text>
    <text x="195" y="305">Should enter</text>
    <text x="580" y="305">Should not enter*</text>
    <text x="400" y="365">*Use the specified engagement rule.</text>
    <text x="400" y="405">Never force a gauge.</text>
  </g>
</svg>
