<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" role="img" aria-labelledby="title desc">
<title id="title">Conventional wheel marking sequence</title><desc id="desc">Read five fields from top to bottom: abrasive, grit, grade, structure, bond. An illustrative supplier key is A, 60, J, 7, V.</desc>
<rect width="800" height="590" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="36" fill="#102b49">
<text x="30" y="48">Illustrative marking: A 60 J 7 V</text>
<g fill="#eef4fa" stroke="#102b49" stroke-width="2"><rect x="30" y="75" width="740" height="78" rx="10"/><rect x="30" y="175" width="740" height="78" rx="10"/><rect x="30" y="275" width="740" height="78" rx="10"/><rect x="30" y="375" width="740" height="78" rx="10"/><rect x="30" y="475" width="740" height="78" rx="10"/></g>
<text x="50" y="125">A · Abrasive: cutting material</text><text x="50" y="225">60 · Grit: grain size</text><text x="50" y="325">J · Grade: grain retention</text><text x="50" y="425">7 · Structure: grain spacing</text><text x="50" y="525">V · Bond: binder</text>
</g><path d="M400 154v20m-7-8 7 8 7-8M400 254v20m-7-8 7 8 7-8M400 354v20m-7-8 7 8 7-8M400 454v20m-7-8 7 8 7-8" fill="none" stroke="#102b49" stroke-width="3"/>
</svg>
