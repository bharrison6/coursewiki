<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 985" role="img" aria-labelledby="title desc">
<title id="title">Steady rest stays fixed; follow rest travels with the cutter</title>
<desc id="desc">Two large panels compare a steady rest fixed to the lathe bed at one axial station and a follow rest attached to the carriage near the cutter. An end-view inset shows the follow rest's two radial contacts at one cross-section. A chuck drives the long rotating work in both examples.</desc>
<defs>
 <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167b45"/></marker>
 <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68469d"/></marker>
 <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126b9c"/></marker>
 <style>.panel{fill:#f7f7f5;stroke:#26343c;stroke-width:3}.device{fill:#d7dde1;stroke:#26343c;stroke-width:4}.work{fill:#e7ecef;stroke:#26343c;stroke-width:4}.bed{fill:#9aa7ae;stroke:#26343c;stroke-width:4}.label{font:700 36px Arial,sans-serif;fill:#172126}.note{font:27px Arial,sans-serif;fill:#26343c}.small{font:24px Arial,sans-serif;fill:#26343c}.drive{fill:#167b45}.support{fill:#68469d}.travel{fill:#126b9c}.role{font:700 30px Arial,sans-serif}.thin{fill:none;stroke:#26343c;stroke-width:4}.support-line{fill:none;stroke:#68469d;stroke-width:5;marker-end:url(#purple-arrow)}.drive-line{fill:none;stroke:#167b45;stroke-width:5;marker-end:url(#green-arrow)}.travel-line{fill:none;stroke:#126b9c;stroke-width:5;marker-end:url(#blue-arrow)}</style>
</defs>
<rect width="900" height="985" fill="#fff"/>
<text class="label" x="40" y="55">Supports do not replace the primary drive</text>
<g transform="translate(42 78)"><rect class="drive" width="40" height="30" rx="6"/><text class="role" x="54" y="27">Drive</text><rect class="support" x="220" width="40" height="30" rx="6"/><text class="role" x="274" y="27">Support</text><rect class="travel" x="470" width="40" height="30" rx="6"/><text class="role" x="524" y="27">Carriage travel</text></g>

<g id="steady-rest" transform="translate(35 135)">
 <title>Steady rest fixed to the bed</title><rect class="panel" width="830" height="370" rx="18"/><text class="label" x="25" y="45">Steady rest: fixed at one bed position</text>
 <g transform="translate(35 82)"><rect class="device" x="0" y="45" width="72" height="130"/><path class="device" d="M72 55L112 75V145L72 165Z"/><rect class="work" x="104" y="94" width="555" height="38" rx="15"/><rect class="bed" x="75" y="188" width="640" height="35" rx="6"/>
  <path class="device" d="M360 188V78A62 62 0 0 1 484 78V188H445V82A23 23 0 0 0 399 82V188Z"/>
  <path class="support-line" d="M422 64V94"/><path class="support-line" d="M383 121L408 116"/><path class="support-line" d="M461 121L436 116"/>
  <path class="drive-line" d="M8 25A70 70 0 0 1 62 17"/><text class="small" x="5" y="15">chuck drives</text>
 </g>
 <text class="note" x="30" y="330">The rest is clamped to the bed and supports one axial station.</text><text class="note" x="30" y="362">The rotating work still receives its primary drive from the chuck.</text>
</g>

<g id="follow-rest" transform="translate(35 530)">
 <title>Follow rest travels with the carriage near the cutter</title><rect class="panel" width="830" height="420" rx="18"/><text class="label" x="25" y="45">Follow rest: travels beside the cutter</text>
 <g transform="translate(35 82)"><rect class="device" x="0" y="45" width="72" height="130"/><path class="device" d="M72 55L112 75V145L72 165Z"/><rect class="work" x="104" y="94" width="555" height="38" rx="15"/><rect class="bed" x="75" y="205" width="640" height="35" rx="6"/>
  <rect class="device" x="390" y="165" width="190" height="40" rx="6"/><path class="device" d="M420 165V88H460V165Z"/>
  <path class="support-line" d="M440 82V100"/><path fill="#c45014" stroke="#26343c" stroke-width="4" d="M486 66L520 66L503 104Z"/><text class="small" x="476" y="55">cutter</text>
  <g id="follow-rest-end-view" transform="translate(575 0)"><title>End view of two radial contacts at one follow-rest station</title><rect class="panel" width="140" height="150" rx="12"/><text class="small" x="15" y="28">END VIEW</text><path class="device" d="M24 118V60H44V100H96V42H116V118Z"/><circle class="work" cx="70" cy="78" r="19"/><path class="support-line" d="M70 38V58"/><path class="support-line" d="M39 78H51"/><text class="small" x="34" y="145">2 pads</text></g>
  <path class="drive-line" d="M8 25A70 70 0 0 1 62 17"/><text class="small" x="5" y="15">chuck drives</text>
  <text class="small" x="90" y="240"><tspan x="90">carriage + cutter + rest</tspan><tspan x="90" dy="28">travel together</tspan></text><path class="travel-line" d="M260 260H650"/>
 </g>
 <text class="note" x="30" y="380">The carriage carries the rest beside the cutter.</text><text class="note" x="30" y="410">Chuck drives the work; the rest supplies support.</text>
</g>
</svg>
