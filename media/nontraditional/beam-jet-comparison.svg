<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-labelledby="title">
<title id="title">Laser, abrasive waterjet and plasma cutting compared</title>
<rect width="800" height="960" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="36" fill="#002144">
<text x="30" y="50" font-weight="bold">Three ways to cut a profile</text>
<g transform="translate(0 90)">
<rect x="20" width="760" height="245" rx="10" fill="#f2f5f7"/>
<text x="40" y="45" font-weight="bold">Laser</text>
<path d="M120 60V170" stroke="#b13d16" stroke-width="8"/>
<path d="M35 170H100V220H35ZM140 170H215V220H140Z" fill="#bbb" stroke="#002144" stroke-width="2"/>
<path d="M90 170H100V220H90ZM140 170H150V220H140Z" fill="#ffb695"/>
<text x="250" y="100">Focused light → heat</text>
<text x="250" y="155">Fine profiles; matched</text>
<text x="250" y="200">laser and material</text></g>
<g transform="translate(0 360)">
<rect x="20" width="760" height="245" rx="10" fill="#e6f3fa"/>
<text x="40" y="45" font-weight="bold">Abrasive waterjet</text>
<path d="M120 65V165" stroke="#005d87" stroke-width="12"/>
<path d="M35 170H100L110 220H35ZM140 170H215V220H130Z" fill="#bbb" stroke="#002144" stroke-width="2"/>
<g fill="#002144"><circle cx="118" cy="90" r="4"/><circle cx="122" cy="118" r="4"/><circle cx="118" cy="150" r="4"/></g>
<text x="250" y="100">Moving grit → erosion</text>
<text x="250" y="155">Many materials;</text>
<text x="250" y="200">no thermal HAZ</text></g>
<g transform="translate(0 630)">
<rect x="20" width="760" height="245" rx="10" fill="#f2f5f7"/>
<text x="40" y="45" font-weight="bold">Plasma</text>
<path d="M100 65H140L130 90H110Z" fill="#002144"/>
<path d="M120 90L105 175H135Z" fill="#b13d16"/>
<path d="M35 170H100V220H35ZM140 170H215V220H140Z" fill="#bbb" stroke="#002144" stroke-width="2"/>
<path d="M90 170H100V220H90ZM140 170H150V220H140Z" fill="#ffb695"/>
<text x="250" y="100">Ionized gas arc → heat</text>
<text x="250" y="155">Conductive metals;</text>
<text x="250" y="200">thermal HAZ</text></g>
<text x="30" y="930">Orange edge bands: thermal effects.</text></g></svg>