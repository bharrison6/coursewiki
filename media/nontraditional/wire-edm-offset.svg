<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 830" role="img" aria-labelledby="title">
<title id="title">Wire EDM center-path offset equals wire radius plus spark gap</title>
<rect width="800" height="830" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="36" fill="#002144">
<text x="30" y="50" font-weight="bold">Wire EDM: top view</text>
<rect x="30" y="90" width="740" height="470" fill="#e6f3fa"/>
<rect x="470" y="90" width="300" height="470" fill="#ddd"/>
<path d="M470 90V560" stroke="#002144" stroke-width="6"/>
<text x="490" y="155">Retained</text><text x="490" y="200">workpiece</text>
<text x="50" y="145">Dielectric fluid</text>
<path d="M330 165V550" stroke="#005d87" stroke-width="4" stroke-dasharray="12 9"/>
<circle cx="330" cy="320" r="90" fill="#ecac00" stroke="#002144" stroke-width="4"/>
<circle cx="330" cy="320" r="6" fill="#002144"/>
<text x="280" y="300">Wire</text>
<path d="M330 320H420M330 310V330M420 310V330" stroke="#002144" stroke-width="3"/>
<text x="65" y="385">Radius</text><path d="M190 375L370 327" stroke="#002144" stroke-width="2"/>
<path d="M420 320H470M470 310V330" stroke="#002144" stroke-width="3"/>
<text x="485" y="310">Spark gap</text><path d="M485 320L446 324" stroke="#002144" stroke-width="2"/>
<path d="M330 465H470M330 450V480M470 450V480" stroke="#002144" stroke-width="4"/>
<text x="50" y="510">Offset</text><path d="M160 500L395 468" stroke="#002144" stroke-width="2"/>
<text x="30" y="610">Dashed line: wire center path</text>
<text x="30" y="665">Solid line: finished wall</text>
<text x="30" y="720">Offset = radius + one-sided gap</text>
<text x="30" y="780">Wire and gap enlarged; not to scale.</text></g></svg>