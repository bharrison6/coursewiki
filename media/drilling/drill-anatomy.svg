</g>
<path class="line" d="M223 585L350 534"/>
<text x="366" y="540">Chisel edge</text>
<text x="366" y="604">Web: core behind</text><text x="366" y="646">the chisel edge</text>
<path d="M24 700H776" stroke="#c5ced7"/>
<text x="24" y="746" class="label">Included point angle: axial view</text>
<path class="metal" d="M80 778V808L135 841.05L190 808V778Z"/><path class="cut" d="M80 808L135 841.05L190 808"/>
<text x="220" y="826">118°</text>
