  <path class="axis" d="M58 180H495"/>
</g>
<path class="line" d="M120 136L143 204M360 136L356 223M640 136V177M440 307L474 184"/>
<text x="24" y="120">Lip at point</text><text x="300" y="120">Flute</text><text x="588" y="120">Shank</text>
<text x="200" y="338">Margin: narrow outer strip</text>
<text x="24" y="390">Flute = chip space</text>
<path d="M24 414H776" stroke="#c5ced7"/>
