<svg xmlns="http://www.w3.org/2000/svg" class="bgd-svg" viewBox="0 0 480 540" role="img" aria-label="Needle roller · radial. Long, slender rollers give a shallow radial section. This radial example includes both rings. Some needle assemblies run directly on a suitably prepared shaft; a separate thrust-needle arrangement is a different geometry."><title>Needle roller · radial. Long, slender rollers give a shallow radial section. This radial example includes both rings. Some needle assemblies run directly on a suitably prepared shaft; a separate thrust-needle arrangement is a different geometry.</title><style>.bgd-svg{--bgd-ink:#002144;--bgd-paper:#fbfaf8;--bgd-ring:#b7c4ce;--bgd-element:#deebf3;--bgd-shaft:#e8e7e2;--bgd-load:#b64114;--bgd-gold:#ecac00;background:var(--bgd-paper);color:var(--bgd-ink)}.bgd-svg text{fill:var(--bgd-ink);font-family:Arial,Helvetica,sans-serif;font-size:20px}.bgd-svg .title{font-size:23px;font-weight:700}.bgd-svg .small{font-size:17px}.bgd-svg .ring,.bgd-svg .element,.bgd-svg .shaft,.bgd-svg .housing{stroke:var(--bgd-ink);stroke-width:1.8;stroke-linejoin:round;fill:var(--bgd-ring)}.bgd-svg .element{fill:var(--bgd-element)}.bgd-svg .shaft{fill:var(--bgd-shaft)}.bgd-svg .housing{fill:#91a8b8}.bgd-svg .empty{fill:var(--bgd-paper);stroke:var(--bgd-ink);stroke-width:1.8}.bgd-svg .liner{fill:var(--bgd-gold);stroke:var(--bgd-ink);stroke-width:1}.bgd-svg .cage{fill:none;stroke:var(--bgd-gold);stroke-width:7}.bgd-svg .axis{fill:none;stroke:var(--bgd-ink);stroke-width:1;stroke-dasharray:10 4 2 4;opacity:.65}.bgd-svg .contact{fill:none;stroke:var(--bgd-load);stroke-width:2;stroke-dasharray:5 3}.bgd-svg .load,.bgd-svg .dim{fill:none;stroke:var(--bgd-load);stroke-width:3}.bgd-svg .load-head,.bgd-svg .dim-head{fill:var(--bgd-load)}.bgd-svg .leader{fill:none;stroke:var(--bgd-ink);stroke-width:1.5}.bgd-svg .divider{fill:none;stroke:#a5acb0;stroke-width:1}.bgd-svg .dimtext{fill:var(--bgd-load);font-size:20px;font-weight:700}</style><rect class="empty" x="0" y="0" width="480" height="540" rx="0"/><text class="title" x="18" y="29" text-anchor="start">Needle roller · radial</text><text class="small" x="18" y="53" text-anchor="start">Axial section · shaft axis runs left to right</text><g transform="translate(0 20)"><rect class="shaft" x="85" y="125" width="310" height="70" rx="0"/><path class="axis" d="M65 160L425 160"/><path class="ring" d="M155 90H315V113H307V105H163V113H155Z"/><rect class="ring" x="155" y="116" width="160" height="9" rx="0"/><rect class="element" x="165" y="105" width="140" height="11" rx="2"/><path class="axis" d="M174 110.5L297 110.5"/><g transform="translate(0 320) scale(1 -1)"><path class="ring" d="M155 90H315V113H307V105H163V113H155Z"/><rect class="ring" x="155" y="116" width="160" height="9" rx="0"/><rect class="element" x="165" y="105" width="140" height="11" rx="2"/><path class="axis" d="M174 110.5L297 110.5"/></g><path class="load" d="M370 77L370 125"/><path class="load-head" d="M370 125l-5 -10l10 0Z"/><text class="dimtext" x="383" y="97" text-anchor="start">Fᵣ</text></g><path class="divider" d="M18 300L462 300"/><text class="small end-label" x="20" y="324" text-anchor="start">End view · covers omitted</text><g data-bgd-end=""><circle class="ring" cx="112" cy="410" r="76"/><circle class="empty" cx="112" cy="410" r="60"/><circle class="ring" cx="112" cy="410" r="46"/><circle class="empty" cx="112" cy="410" r="36"/><circle class="cage" cx="112" cy="410" r="53"/><circle class="element" cx="165" cy="410" r="5"/><circle class="element" cx="163.19" cy="423.72" r="5"/><circle class="element" cx="157.9" cy="436.5" r="5"/><circle class="element" cx="149.48" cy="447.48" r="5"/><circle class="element" cx="138.5" cy="455.9" r="5"/><circle class="element" cx="125.72" cy="461.19" r="5"/><circle class="element" cx="112" cy="463" r="5"/><circle class="element" cx="98.28" cy="461.19" r="5"/><circle class="element" cx="85.5" cy="455.9" r="5"/><circle class="element" cx="74.52" cy="447.48" r="5"/><circle class=