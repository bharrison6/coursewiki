<svg xmlns="http://www.w3.org/2000/svg" class="bgd-svg" viewBox="0 0 480 375" role="img" aria-label="Pillow block and four-bolt flange housing shown from the shaft end; the bearing inside is a separate choice."><title>Pillow block and four-bolt flange housing shown from the shaft end; the bearing inside is a separate choice.</title><style>.bgd-svg{--bgd-ink:#002144;--bgd-paper:#fbfaf8;--bgd-ring:#b7c4ce;--bgd-element:#deebf3;--bgd-shaft:#e8e7e2;--bgd-load:#b64114;--bgd-gold:#ecac00;background:var(--bgd-paper);color:var(--bgd-ink)}.bgd-svg text{fill:var(--bgd-ink);font-family:Arial,Helvetica,sans-serif;font-size:20px}.bgd-svg .title{font-size:23px;font-weight:700}.bgd-svg .small{font-size:17px}.bgd-svg .ring,.bgd-svg .element,.bgd-svg .shaft,.bgd-svg .housing{stroke:var(--bgd-ink);stroke-width:1.8;stroke-linejoin:round;fill:var(--bgd-ring)}.bgd-svg .element{fill:var(--bgd-element)}.bgd-svg .shaft{fill:var(--bgd-shaft)}.bgd-svg .housing{fill:#91a8b8}.bgd-svg .empty{fill:var(--bgd-paper);stroke:var(--bgd-ink);stroke-width:1.8}.bgd-svg .liner{fill:var(--bgd-gold);stroke:var(--bgd-ink);stroke-width:1}.bgd-svg .cage{fill:none;stroke:var(--bgd-gold);stroke-width:7}.bgd-svg .axis{fill:none;stroke:var(--bgd-ink);stroke-width:1;stroke-dasharray:10 4 2 4;opacity:.65}.bgd-svg .contact{fill:none;stroke:var(--bgd-load);stroke-width:2;stroke-dasharray:5 3}.bgd-svg .load,.bgd-svg .dim{fill:none;stroke:var(--bgd-load);stroke-width:3}.bgd-svg .load-head,.bgd-svg .dim-head{fill:var(--bgd-load)}.bgd-svg .leader{fill:none;stroke:var(--bgd-ink);stroke-width:1.5}.bgd-svg .divider{fill:none;stroke:#a5acb0;stroke-width:1}.bgd-svg .dimtext{fill:var(--bgd-load);font-size:20px;font-weight:700}</style><rect class="empty" x="0" y="0" width="480" height="375" rx="0"/><text class="title" x="18" y="30" text-anchor="start">Housing shape is not the bearing family</text><text class="label" x="20" y="65" text-anchor="start">Pillow / plummer block</text><path class="housing" d="M30 224V196H57V138A63 63 0 0 1 183 138V196H210V224Z"/><rect class="ring" x="20" y="224" width="200" height="17" rx="0"/><circle class="ring" cx="120" cy="140" r="49"/><circle class="empty" cx="120" cy="140" r="34"/><circle class="shaft" cx="120" cy="140" r="22"/><rect class="empty" x="37" y="203" width="20" height="10" rx="4"/><rect class="empty" x="182" y="203" width="20" height="10" rx="4"/><text class="label" x="255" y="65" text-anchor="start">Flange-mounted housing</text><rect class="housing" x="278" y="88" width="154" height="154" rx="12"/><circle class="ring" cx="355" cy="165" r="50"/><circle class="empty" cx="355" cy="165" r="34"/><circle class="shaft" cx="355" cy="165" r="22"/><circle class="empty" cx="296" cy="106" r="7"/><circle class="empty" cx="296" cy="224" r="7"/><circle class="empty" cx="414" cy="106" r="7"/><circle class="empty" cx="414" cy="224" r="7"/><text class="small" x="20" y="282" text-anchor="start">Bolts to a support beneath it.</text><text class="small" x="255" y="282" text-anchor="start">Bolts to a facing support.</text><text class="label" x="20" y="319" text-anchor="start">The insert or bearing inside must still be identified.</text><text class="small" x="20" y="349" text-anchor="start">Housing outline alone does not tell you its load rating.</text></svg>
