<svg xmlns="http://www.w3.org/2000/svg" class="bgd-svg" viewBox="0 0 480 540" role="img" aria-label="Cylindrical roller thrust. Roller axes point radially across flat washer faces. The single-direction arrangement shown carries axial load, not radial guidance. Compare its radial roller orientation with the shaft-parallel rollers in the NU bearing."><title>Cylindrical roller thrust. Roller axes point radially across flat washer faces. The single-direction arrangement shown carries axial load, not radial guidance. Compare its radial roller orientation with the shaft-parallel rollers in the NU bearing.</title><style>.bgd-svg{--bgd-ink:#002144;--bgd-paper:#fbfaf8;--bgd-ring:#b7c4ce;--bgd-element:#deebf3;--bgd-shaft:#e8e7e2;--bgd-load:#b64114;--bgd-gold:#ecac00;background:var(--bgd-paper);color:var(--bgd-ink)}.bgd-svg text{fill:var(--bgd-ink);font-family:Arial,Helvetica,sans-serif;font-size:20px}.bgd-svg .title{font-size:23px;font-weight:700}.bgd-svg .small{font-size:17px}.bgd-svg .ring,.bgd-svg .element,.bgd-svg .shaft,.bgd-svg .housing{stroke:var(--bgd-ink);stroke-width:1.8;stroke-linejoin:round;fill:var(--bgd-ring)}.bgd-svg .element{fill:var(--bgd-element)}.bgd-svg .shaft{fill:var(--bgd-shaft)}.bgd-svg .housing{fill:#91a8b8}.bgd-svg .empty{fill:var(--bgd-paper);stroke:var(--bgd-ink);stroke-width:1.8}.bgd-svg .liner{fill:var(--bgd-gold);stroke:var(--bgd-ink);stroke-width:1}.bgd-svg .cage{fill:none;stroke:var(--bgd-gold);stroke-width:7}.bgd-svg .axis{fill:none;stroke:var(--bgd-ink);stroke-width:1;stroke-dasharray:10 4 2 4;opacity:.65}.bgd-svg .contact{fill:none;stroke:var(--bgd-load);stroke-width:2;stroke-dasharray:5 3}.bgd-svg .load,.bgd-svg .dim{fill:none;stroke:var(--bgd-load);stroke-width:3}.bgd-svg .load-head,.bgd-svg .dim-head{fill:var(--bgd-load)}.bgd-svg .leader{fill:none;stroke:var(--bgd-ink);stroke-width:1.5}.bgd-svg .divider{fill:none;stroke:#a5acb0;stroke-width:1}.bgd-svg .dimtext{fill:var(--bgd-load);font-size:20px;font-weight:700}</style><rect class="empty" x="0" y="0" width="480" height="540" rx="0"/><text class="title" x="18" y="29" text-anchor="start">Cylindrical roller thrust</text><text class="small" x="18" y="53" text-anchor="start">Axial section · shaft axis runs left to right</text><g transform="translate(0 20)"><rect class="shaft" x="85" y="125" width="310" height="70" rx="0"/><path class="axis" d="M65 160L425 160"/><rect class="ring" x="182" y="59" width="32" height="66" rx="0"/><rect class="ring" x="239" y="59" width="32" height="66" rx="0"/><rect class="element" x="214" y="68" width="25" height="46" rx="2"/><path class="axis" d="M226.5 74L226.5 108"/><g transform="translate(0 320) scale(1 -1)"><rect class="ring" x="182" y="59" width="32" height="66" rx="0"/><rect class="ring" x="239" y="59" width="32" height="66" rx="0"/><rect class="element" x="214" y="68" width="25" height="46" rx="2"/><path class="axis" d="M226.5 74L226.5 108"/></g><path class="load" d="M331 160L415 160"/><path class="load-head" d="M415 160l-10 5l0 -10Z"/><text class="dimtext" x="394" y="188" text-anchor="start">Fₐ</text></g><path class="divider" d="M18 300L462 300"/><text class="small end-label" x="20" y="324" text-anchor="start">Face view · front washer removed</text><g data-bgd-end=""><circle class="ring" cx="112" cy="410" r="76"/><circle class="empty" cx="112" cy="410" r="36"/><circle class="cage" cx="112" cy="410" r="53"/><g transform="translate(165 410) rotate(0)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(157.9 436.5) rotate(30)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(138.5 455.9) rotate(60)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(112 463) rotate(90)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(85.5 455.9) rotate(120)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(66.1 436.5) rotate(150)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(59 410) rotate(180)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(66.1 383.5) rotate(210)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(85.5 364.1) rotate(240)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(112 357) rotate(270)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(138.5 364.1) rotate(300)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g><g transform="translate(157.9 383.5) rotate(330)"><rect class="element" x="-15" y="-5" width="30" height="10" rx="2"/></g></g><text class="small" x="211" y="363" text-anchor="start">Radially directed rollers</text><text class="small" x="211" y="391" text-anchor="start">Flat washer raceways</text><text class="small" x="211" y="423" text-anchor="start">Roller axes radiate outward.</text><text class="small" x="18" y="525" text-anchor="start">Schematic geometry; arrows show load directions.</text></svg>
