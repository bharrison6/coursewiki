<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 275" role="img" aria-labelledby="title desc">
<title id="title">Compare thread forms</title><desc id="desc">Square, V, trapezoidal and asymmetric buttress profiles side by side.</desc><rect width="920" height="275" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:18px} .line{fill:none;stroke:#172b4d;stroke-width:3} .dim{fill:none;stroke:#172b4d;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#172b4d"/></marker></defs><text x="20" y="30" font-weight="bold">Thread profiles along the screw axis</text><text x="20" y="65" font-weight="bold">Square</text><path d="M15 140H30V85H65V140H100V85H135V140H170V85H205V140" class="line"/><path d="M20 160H215" stroke="#8e9aa8"/><text x="20" y="200" font-size="16">Parallel flanks</text><text x="245" y="65" font-weight="bold">V / machine screw</text><path d="M240 140L270 88H280L310 140L340 88H350L380 140L410 88H420L450 140" class="line"/><path d="M245 160H440" stroke="#8e9aa8"/><text x="245" y="200" font-size="16">Angled flanks</text><text x="470" y="65" font-weight="bold">ACME / trapezoidal</text><path d="M470 140H480L495 85H520L535 140H550L565 85H590L605 140H620L635 85H660L675 140" class="line"/><path d="M470 160H665" stroke="#8e9aa8"/><text x="470" y="200" font-size="16">Flat crest, wider root</text><text x="695" y="65" font-weight="bold">Buttress</text><path d="M695 140V85H710L750 140H765V85H780L820 140H835V85H850L890 140" class="line"/><path d="M695 160H890" stroke="#8e9aa8"/><text x="695" y="200" font-size="16">One working direction</text><path d="M680 110H695" stroke="#172b4d" stroke-width="2" marker-end="url(#a)"/><text x="20" y="248">Schematic only: no manufacturing dimensions or thread angles implied.</text></svg>
