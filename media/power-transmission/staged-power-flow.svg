<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Useful power and losses through two efficiency stages</title>
  <desc id="desc">One hundred watts enter an eighty-percent stage. Eighty watts continue and twenty watts branch as loss. The eighty watts enter a ninety-percent stage. Seventy-two watts continue and eight watts branch as loss.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17476b"/></marker></defs>
  <rect width="900" height="360" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#172b3a">
    <text x="32" y="34" font-size="23" font-weight="700">Each efficiency uses that stage's own input</text>
    <text x="35" y="145" font-size="21" font-weight="700">100 W input</text>
    <path d="M145 137H215" stroke="#17476b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="220" y="92" width="190" height="90" rx="8" fill="#e8f3f8" stroke="#17476b" stroke-width="3"/>
    <text x="315" y="124" text-anchor="middle" font-size="21" font-weight="700">Stage 1</text>
    <text x="315" y="154" text-anchor="middle" font-size="19">80% of 100 W</text>
    <path d="M410 137H500" stroke="#17476b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="455" y="121" text-anchor="middle" font-size="20" font-weight="700">80 W</text>
    <rect x="505" y="92" width="190" height="90" rx="8" fill="#e8f3f8" stroke="#17476b" stroke-width="3"/>
    <text x="600" y="124" text-anchor="middle" font-size="21" font-weight="700">Stage 2</text>
    <text x="600" y="154" text-anchor="middle" font-size="19">90% of 80 W</text>
    <path d="M695 137H790" stroke="#17476b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="744" y="120" text-anchor="middle" font-size="20" font-weight="700">72 W</text>
    <text x="840" y="132" text-anchor="middle" font-size="20" font-weight="700">useful</text>
    <text x="840" y="157" text-anchor="middle" font-size="20" font-weight="700">output</text>
    <path d="M315 182V260" stroke="#c54b1c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="220" y="267" width="190" height="58" rx="8" fill="#fff2e8" stroke="#c54b1c" stroke-width="3"/>
    <text x="315" y="302" text-anchor="middle" font-size="20" font-weight="700">20 W loss</text>
    <path d="M600 182V260" stroke="#c54b1c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="505" y="267" width="190" height="58" rx="8" fill="#fff2e8" stroke="#c54b1c" stroke-width="3"/>
    <text x="600" y="302" text-anchor="middle" font-size="20" font-weight="700">8 W loss</text>
    <text x="32" y="347" font-size="18">Check: 72 W useful + 20 W loss + 8 W loss = 100 W input</text>
  </g>
</svg>
