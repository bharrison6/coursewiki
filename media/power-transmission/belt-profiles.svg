<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">How three belt profiles transmit force</title><desc id="desc">Flat and V sections use friction; synchronous teeth use matching grooves. The V-belt contacts the groove sides with clearance at its bottom.</desc>
<rect width="760" height="300" fill="#fff"/>
<g font-family="Arial,sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">
<text x="125" y="32" font-weight="bold">Flat belt</text><text x="375" y="32" font-weight="bold">V-belt</text><text x="630" y="32" font-weight="bold">Timing belt</text>
<g stroke="#172b4d" stroke-width="2"><path d="M35 125H215V205H35Z" fill="#e4eaf1"/><path d="M35 105H215V125H35Z" fill="#ecac00"/>
<path d="M285 90H310L355 195H395L440 90H465V215H285Z" fill="#e4eaf1"/><path d="M310 90H440L406 169H344Z" fill="#ecac00"/>
<path d="M535 140H558V167H582V140H608V167H632V140H658V167H682V140H725V215H535Z" fill="#e4eaf1"/>
<path d="M535 113H725V140H682V167H658V140H632V167H608V140H582V167H558V140H535Z" fill="#ecac00"/></g>
<text x="125" y="253">Friction at the surface</text><text x="375" y="253">Friction on both sides</text><text x="630" y="253">Teeth carry the load</text>
<text x="375" y="282" font-size="15">Clearance below the belt</text><path d="M375 222V186" stroke="#172b4d" fill="none"/>
<text x="125" y="74" font-size="15">Cross section</text><text x="375" y="74" font-size="15">Cross section</text><text x="630" y="74" font-size="15">Along the belt</text>
</g></svg>
