<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="From six free motions to one intended shaft rotation"><title>From six free motions to one intended shaft rotation</title><rect width="800" height="300" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17476b"/></marker></defs><g font-family="Arial,sans-serif" font-size="18" fill="#172b3a" stroke-linecap="round"><text x="30" y="30">Free body: 3 translations + 3 rotations</text><text x="440" y="30">Complete rotary support: Rx remains</text><rect x="130" y="110" width="130" height="60" fill="#dcebf5" stroke="#17476b"/><path d="M195 140L340 140" fill="none" stroke="#17476b" stroke-width="3" marker-end="url(#arrow)"/><text x="335" y="170">Tx</text><path d="M195 140L195 55" fill="none" stroke="#17476b" stroke-width="3" marker-end="url(#arrow)"/><text x="205" y="72">Ty</text><path d="M195 140L70 215" fill="none" stroke="#17476b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="240">Tz</text><text x="35" y="275">Rx, Ry, Rz: turn about each axis</text><rect x="455" y="110" width="300" height="55" fill="#dcebf5" stroke="#17476b"/><path d="M495 90V190M515 90V190M695 90V190M715 90V190" stroke="#17476b" stroke-width="9"/><text x="445" y="225">Spaced supports restrain Ty, Tz, Ry, Rz</text><text x="445" y="260">Axial location restrains Tx</text><path d="M755 100C795 100 795 177 755 177" fill="none" stroke="#17476b" stroke-width="3" marker-end="url(#arrow)"/><text x="755" y="85">Rx</text></g></svg>